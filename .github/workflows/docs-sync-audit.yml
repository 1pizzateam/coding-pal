name: Documentation Sync Audit

on:
  workflow_call:
    inputs:
      scope: { type: string, default: 'src/' }

jobs:
  audit:
    uses: 1pizzateam/coding-pal/.github/workflows/copilot-audit.yml@main
    with:
      agent: docs-sync
      scope: ${{ inputs.scope }}
      pr_title: "docs: sync documentation with ${{ inputs.scope }}"
    secrets: inherit
