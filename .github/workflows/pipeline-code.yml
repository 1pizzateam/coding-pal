name: Pipeline - Code (reusable)

on:
  workflow_call:
    inputs:
      issue_number:
        description: 'Issue number to implement from plan.md (optional when triggered by workflow_run)'
        required: false
        type: string
        default: ''
      workflow_run_id:
        description: 'Plan workflow_run ID to download plan-spec artifact from'
        required: false
        type: string
        default: ''
      project_title:
        description: 'GitHub Project V2 board title'
        required: false
        type: string
        default: 'DoomR'
      node_version:
        description: 'Node.js version'
        required: false
        type: string
        default: '22'
    secrets:
      PIPELINE_GITHUB_TOKEN:
        required: true
      COPILOT_GITHUB_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  code:
    runs-on: ubuntu-latest
    concurrency:
      group: copilot-code-${{ github.repository }}-${{ inputs.issue_number || inputs.workflow_run_id || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Resolve issue number, base branch, and restore think.md and plan.md
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.workflow_run_id }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          rm -rf /tmp/specs
          mkdir -p /tmp/specs

          if [ -n "$RUN_ID" ] && [ -z "$INPUT_ISSUE_NUMBER" ]; then
            if ! gh run download "$RUN_ID" -n plan-spec -D /tmp/specs 2>/dev/null; then
              echo "Triggering Plan workflow run (#${RUN_ID}) was skipped (no plan-spec artifact); skipping Code."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            ISSUE_NUMBER=$(tr -d '[:space:]' < /tmp/specs/issue_number.txt)
          else
            ISSUE_NUMBER="$INPUT_ISSUE_NUMBER"
            echo "$ISSUE_NUMBER" > /tmp/specs/issue_number.txt
          fi

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "::error::Could not determine ISSUE_NUMBER."
            exit 1
          fi

          BASE_REF=$(gh repo view --json defaultBranchRef --jq '.defaultBranchRef.name // "main"')

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "ISSUE_NUMBER=${ISSUE_NUMBER}" >> "$GITHUB_ENV"
          echo "BASE_REF=${BASE_REF}" >> "$GITHUB_ENV"
          SPEC_DIR="/tmp/specs/issue-${ISSUE_NUMBER}"
          THINK_FILE="${SPEC_DIR}/think.md"
          PLAN_FILE="${SPEC_DIR}/plan.md"
          mkdir -p "$SPEC_DIR"

          if [ ! -s "$THINK_FILE" ]; then
            echo "Fetching latest think.md from issue #${ISSUE_NUMBER} comments..."
            gh issue view "$ISSUE_NUMBER" --json comments \
              --jq '[.comments[].body | select(test("^# Think:"; "m"))] | last // empty' > "$THINK_FILE"
          fi

          if [ ! -s "$PLAN_FILE" ]; then
            echo "Fetching latest plan.md from issue #${ISSUE_NUMBER} comments..."
            gh issue view "$ISSUE_NUMBER" --json comments \
              --jq '[.comments[].body | select(test("^# Plan:"; "m"))] | last // empty' > "$PLAN_FILE"
          fi

          if [ ! -s "$THINK_FILE" ] || [ ! -s "$PLAN_FILE" ]; then
            echo "::error::Missing think.md or plan.md for issue #${ISSUE_NUMBER}. Run Think and Plan workflows first."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.resolve.outputs.skip != 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_GITHUB_TOKEN }}

      - name: Configure git identity and restore specs
        if: steps.resolve.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BASE_REF"
          mkdir -p specs
          cp -R /tmp/specs/. specs/

      - name: Sync issue to Code on Project board
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PROJECT_TITLE: ${{ inputs.project_title }}
          TARGET_STATUS: Code
        run: |
          if [ -z "$PROJECT_TITLE" ]; then
            echo "::notice::No project_title configured; skipping Project status update."
            exit 0
          fi

          DATA=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $number: Int!, $projectTitle: String!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $number) { id }
                owner {
                  ... on ProjectV2Owner {
                    projectsV2(first: 20, query: $projectTitle) {
                      nodes {
                        id
                        title
                        field(name: "Status") {
                          ... on ProjectV2SingleSelectField {
                            id
                            options { id name }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" -F number="$ISSUE_NUMBER" -f projectTitle="$PROJECT_TITLE")

          ISSUE_ID=$(echo "$DATA" | jq -r '.data.repository.issue.id // empty')
          PROJECT=$(echo "$DATA" | jq -c --arg title "$PROJECT_TITLE" '.data.repository.owner.projectsV2.nodes[]? | select((.title | ascii_downcase) == ($title | ascii_downcase))' | head -n 1)
          PROJECT_ID=$(echo "$PROJECT" | jq -r '.id // empty')
          FIELD_ID=$(echo "$PROJECT" | jq -r '.field.id // empty')
          OPTION_ID=$(echo "$PROJECT" | jq -r --arg status "$TARGET_STATUS" '.field.options[] | select((.name | ascii_downcase) == ($status | ascii_downcase)) | .id' | head -n 1)
          if [ -z "$ISSUE_ID" ] || [ -z "$PROJECT_ID" ] || [ -z "$FIELD_ID" ] || [ -z "$OPTION_ID" ]; then
            echo "::error::Could not find issue, project, Status field, or '$TARGET_STATUS' option for ${OWNER}/${REPO} in Project '$PROJECT_TITLE'."
            exit 1
          fi

          ITEM_ID=$(gh api graphql -f query='
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } }
            }' -f projectId="$PROJECT_ID" -f contentId="$ISSUE_ID" --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                value: { singleSelectOptionId: $optionId }
              }) { projectV2Item { id } }
            }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$FIELD_ID" -f optionId="$OPTION_ID" >/dev/null

      - name: Prepare implementation branch and commit specs
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title')
          SLUG=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-36 | sed -E 's/-+$//')
          if [ -z "$SLUG" ]; then SLUG="implementation"; fi
          BRANCH_NAME="feature/issue-${ISSUE_NUMBER}-${SLUG}"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> "$GITHUB_ENV"

          git checkout -B "$BRANCH_NAME"
          git add "specs/issue-${ISSUE_NUMBER}/think.md" "specs/issue-${ISSUE_NUMBER}/plan.md"
          if [ -f "specs/issue-${ISSUE_NUMBER}/editor-requests.json" ]; then
            git add "specs/issue-${ISSUE_NUMBER}/editor-requests.json"
          fi
          git commit -m "docs(specs): add think.md and plan.md for issue #${ISSUE_NUMBER}"

      - name: Install ALTEN-group/coding-pal code primitives
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/ALTEN-group/coding-pal.git /tmp/alten-coding-pal
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/1pizzateam/coding-pal.git /tmp/1pizza-coding-pal
          rm -rf .github/instructions .github/agents .github/prompts .github/skills .github/copilot-instructions.md .agents .claude .cursor .gemini CLAUDE.md GEMINI.md AGENTS.md .cursorrules .windsurfrules
          mkdir -p .github/instructions .github/agents .agents/skills
          cp /tmp/1pizza-coding-pal/instructions/*.md .github/instructions/
          cp -R /tmp/1pizza-coding-pal/skills/* .agents/skills/
          cp /tmp/alten-coding-pal/instructions/sharp-agent.instructions.md .github/instructions/
          cp /tmp/alten-coding-pal/instructions/code-loop.instructions.md .github/instructions/
          [ -d tests ] && [ -f /tmp/alten-coding-pal/instructions/node-unit-tests.instructions.md ] && cp /tmp/alten-coding-pal/instructions/node-unit-tests.instructions.md .github/instructions/
          [ -d website ] && [ -f /tmp/alten-coding-pal/instructions/vitepress-docs.instructions.md ] && cp /tmp/alten-coding-pal/instructions/vitepress-docs.instructions.md .github/instructions/
          [ -d website ] && [ -d /tmp/alten-coding-pal/skills/vitepress-docs-examples ] && cp -R /tmp/alten-coding-pal/skills/vitepress-docs-examples .agents/skills/vitepress-docs-examples
          cp /tmp/alten-coding-pal/agents/code.agent.md .github/agents/
          for skill in plan code-loop pr-record scope-guard secret-guard dependency-guard task-gate control-guard test-probe preview-smoke criteria-verify; do
            cp -R "/tmp/alten-coding-pal/skills/${skill}" ".agents/skills/${skill}"
          done
          rm -rf /tmp/alten-coding-pal /tmp/1pizza-coding-pal

          printf "%s\n" \
            ".github/instructions/" \
            ".github/agents/" \
            ".agents/" \
            "specs/issue_number.txt" \
            "specs/pr_number.txt" \
            "reports/" \
            "pr-body.md" >> .git/info/exclude
          echo '[{"path": "/", "status": 200, "maxMs": 2000}]' > /tmp/preview-routes.json

      - uses: actions/setup-node@v4
        if: steps.resolve.outputs.skip != 'true'
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Clone sibling DoomR.js workspace for companion game editors
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          case "$REPO_NAME" in
            Cadenza|MappR|PixelGun|PolyGun|ShaderGun)
              if [ ! -d ../DoomR.js ]; then
                git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/1pizzateam/DoomR.js.git ../DoomR.js
                npm --prefix ../DoomR.js ci
              fi
              ;;
          esac

      - if: steps.resolve.outputs.skip != 'true'
        run: npm ci
      - if: steps.resolve.outputs.skip != 'true'
        run: npm install -g @github/copilot

      - name: Run Code Agent to implement plan.md and prepare pr-body.md
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ALLOW_PENDING_APPROVAL: "1"
        run: |
          ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title')
          SPEC_DIR="specs/issue-${ISSUE_NUMBER}"
          THINK_FILE="${SPEC_DIR}/think.md"
          PLAN_FILE="${SPEC_DIR}/plan.md"

          copilot --agent="code" --allow-all-tools \
            --prompt "Implement the validated Plan record at ${PLAN_FILE} (with ${THINK_FILE}) for GitHub Issue #${ISSUE_NUMBER} (${ISSUE_TITLE}) on the current branch ${BRANCH_NAME} (base: ${BASE_REF}).

          Follow .github/instructions/code-loop.instructions.md, .agents/skills/code-loop/SKILL.md, and .agents/skills/pr-record/SKILL.md.
          1. Validate specs first: node .agents/skills/plan/scripts/validate-plan.mjs --dir ${SPEC_DIR} --stage draft
          2. Check the branch: node .agents/skills/code-loop/scripts/branch-guard.mjs --git --base ${BASE_REF}
          3. Drive the implementation loop one step at a time using code-loop:
             - node .agents/skills/code-loop/scripts/code-loop.mjs next --dir ${SPEC_DIR} --allow-pending-approval
             - node .agents/skills/code-loop/scripts/code-loop.mjs start <n> --dir ${SPEC_DIR} --allow-pending-approval
             - Apply Step <n>'s New Code (writing only files in Step <n>'s Files and within In Scope).
             - Run Step <n>'s Verification and Bootable Check commands, plus:
               - node .agents/skills/task-gate/scripts/task-gate.mjs --stage 'test:npm test' --stage 'build:npm run build'
               - node .agents/skills/scope-guard/scripts/scope-guard.mjs --git --base origin/${BASE_REF} --scope '${SPEC_DIR}/**' (plus a --scope flag for each In Scope path in ${PLAN_FILE})
               - node .agents/skills/secret-guard/scripts/secret-guard.mjs --git --base origin/${BASE_REF}
               - node .agents/skills/dependency-guard/scripts/dependency-guard.mjs --git --base origin/${BASE_REF}
               - node .agents/skills/control-guard/scripts/control-guard.mjs --git origin/${BASE_REF}
             - If any check fails, record with code-loop.mjs fail <n> --reason '<reason>' --dir ${SPEC_DIR}, fix the code, and re-run checks.
             - When green, record with: node .agents/skills/code-loop/scripts/code-loop.mjs pass <n> --dir ${SPEC_DIR}
             - Stage and commit Step <n>'s modified files and ${SPEC_DIR}/progress.json with a commit message referencing Step <n> and #${ISSUE_NUMBER}.
          4. Repeat until all steps in ${PLAN_FILE} are done in ${SPEC_DIR}/progress.json.
          5. Before authoring the PR body, run the full verification controls across the completed implementation:
             - Ensure every acceptance criterion test includes its AC-<n> token in the test name and passes criteria-verify:
               node .agents/skills/criteria-verify/scripts/verify-criteria.mjs --plan ${PLAN_FILE} --report <report-file> --require-test-files
             - For modified tracked source files under src/**, verify test falsifiability with:
               node .agents/skills/test-probe/scripts/test-probe.mjs --base origin/${BASE_REF} --test-cmd 'npm test' --source <each modified src/** file>
             - Verify control integrity with:
               node .agents/skills/control-guard/scripts/control-guard.mjs --git origin/${BASE_REF}
             - If this is a published @1pizzateam/* library, follow .agents/skills/release-readiness/SKILL.md and verify library documentation and package readiness with:
               node .agents/skills/release-readiness/scripts/verify-release-readiness.mjs --mode pr --require-dist --build-docs
          6. Author the pull request body at pr-body.md following .agents/skills/pr-record/references/pr-record-contract.md (with ## Links, ## Acceptance Criteria Traceability, ## Dependencies, ## Blast Radius, and ## Human Validation all set to Pending) and validate it until it exits 0:
             node .agents/skills/pr-record/scripts/validate-pr.mjs --body pr-body.md --dir ${SPEC_DIR} --stage code --allow-pending-approval"

      - name: Run deterministic Code exit gates
        if: steps.resolve.outputs.skip != 'true'
        env:
          ALLOW_PENDING_APPROVAL: "1"
        run: |
          SPEC_DIR="specs/issue-${ISSUE_NUMBER}"
          if [ -f "${SPEC_DIR}/progress.json" ] && ! git diff --quiet "${SPEC_DIR}/progress.json"; then
            git add "${SPEC_DIR}/progress.json"
            git commit -m "chore(code-loop): record final progress for #${ISSUE_NUMBER}"
          fi
          node .agents/skills/code-loop/scripts/branch-guard.mjs --git --base "$BASE_REF"
          node .agents/skills/code-loop/scripts/code-loop.mjs check-history --dir "$SPEC_DIR" --base "origin/${BASE_REF}"
          node .agents/skills/control-guard/scripts/control-guard.mjs --git "origin/${BASE_REF}"
          node .agents/skills/secret-guard/scripts/secret-guard.mjs --git --base "origin/${BASE_REF}"
          node .agents/skills/dependency-guard/scripts/dependency-guard.mjs --git --base "origin/${BASE_REF}"
          SCOPE_ARGS=(--scope "${SPEC_DIR}/**" --scope "pr-body.md" --scope "reports/**")
          while IFS= read -r scope_glob; do
            [ -n "$scope_glob" ] && SCOPE_ARGS+=(--scope "$scope_glob")
          done < <(node -e '
            const fs = require("fs");
            const md = fs.readFileSync(process.argv[1], "utf8");
            const sec = md.match(/^##\s+In Scope\s*\n([\s\S]*?)(?:\n##\s+|$)/m);
            if (sec) {
              for (const m of sec[1].matchAll(/`([^`\n]+)`/g)) {
                console.log(m[1].trim());
              }
            }
          ' "${SPEC_DIR}/plan.md")
          node .agents/skills/scope-guard/scripts/scope-guard.mjs --git --base "origin/${BASE_REF}" "${SCOPE_ARGS[@]}"
          TASK_STAGES=(--stage "test:npm test" --stage "build:npm run build")
          if [ -f package.json ] && [ "$(node -p "const p=require('./package.json'); Boolean(p.name && p.name.startsWith('@1pizzateam/') && !p.private)")" = "true" ]; then
            TASK_STAGES+=(--stage "release-readiness:node .agents/skills/release-readiness/scripts/verify-release-readiness.mjs --mode pr --require-dist --build-docs")
          fi
          node .agents/skills/task-gate/scripts/task-gate.mjs "${TASK_STAGES[@]}"

          mkdir -p reports
          if [ -f "./node_modules/jest/bin/jest.js" ]; then
            node --experimental-vm-modules ./node_modules/jest/bin/jest.js --json --outputFile=reports/test-report.json
            node .agents/skills/criteria-verify/scripts/verify-criteria.mjs --plan "${SPEC_DIR}/plan.md" --report reports/test-report.json --require-test-files >> "$GITHUB_STEP_SUMMARY"
          else
            {
              for tf in tests/*.test.mjs tests/*.test.js scripts/test-*.mjs; do
                if [ -f "$tf" ]; then
                  echo "# file: ${tf}"
                  node "$tf"
                fi
              done
            } | tee reports/test-report.log
            node .agents/skills/criteria-verify/scripts/verify-criteria.mjs --plan "${SPEC_DIR}/plan.md" --report reports/test-report.log --require-test-files >> "$GITHUB_STEP_SUMMARY"
          fi

          MODIFIED_SRCS=$(git diff --name-only --diff-filter=M "origin/${BASE_REF}..HEAD" -- 'src/**')
          if [ -n "$MODIFIED_SRCS" ]; then
            PROBE_ARGS=()
            for src in $MODIFIED_SRCS; do
              PROBE_ARGS+=(--source "$src")
            done
            node .agents/skills/test-probe/scripts/test-probe.mjs --base "origin/${BASE_REF}" --test-cmd "npm test" "${PROBE_ARGS[@]}"
          fi

          if node -e 'const pkg=require("./package.json"); process.exit((pkg.dependencies?.vite || pkg.devDependencies?.vite) ? 0 : 1)' 2>/dev/null; then
            npx vite preview --port 4173 --host 127.0.0.1 >/tmp/vite-preview.log 2>&1 &
            PREVIEW_PID=$!
            trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
            node .agents/skills/preview-smoke/scripts/preview-smoke.mjs --url http://127.0.0.1:4173 --routes /tmp/preview-routes.json --timeout-ms 5000 --retries 5 --retry-delay-ms 1000
            kill "$PREVIEW_PID" 2>/dev/null || true
          fi

          node .agents/skills/pr-record/scripts/validate-pr.mjs --body pr-body.md --dir "$SPEC_DIR" --stage code --allow-pending-approval
          cat pr-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Push branch and open Pull Request
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title')
          PR_TITLE="feat(issue-${ISSUE_NUMBER}): ${ISSUE_TITLE}"

          git push --force-with-lease origin "$BRANCH_NAME"

          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base "$BASE_REF" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            PR_NUMBER="$EXISTING_PR"
            gh pr edit "$PR_NUMBER" --title "$PR_TITLE" --body-file pr-body.md
            PR_URL=$(gh pr view "$PR_NUMBER" --json url --jq '.url')
          else
            PR_URL=$(gh pr create --base "$BASE_REF" --head "$BRANCH_NAME" --title "$PR_TITLE" --body-file pr-body.md)
            PR_NUMBER=$(gh pr view "$BRANCH_NAME" --json number --jq '.number')
          fi

          echo "$PR_NUMBER" > specs/pr_number.txt
          echo "$ISSUE_NUMBER" > specs/issue_number.txt
          echo "PR_NUMBER=${PR_NUMBER}" >> "$GITHUB_ENV"
          echo "PR_URL=${PR_URL}" >> "$GITHUB_ENV"
          gh issue comment "$ISSUE_NUMBER" --body "Pull request opened for #${ISSUE_NUMBER}: ${PR_URL}"

      - name: Check for manual validation checkpoint after Code
        id: checkpoint
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          ISSUE_JSON=$(gh issue view "$ISSUE_NUMBER" --json body,labels)
          PAUSE_CODE=$(echo "$ISSUE_JSON" | jq -r '
            (([.labels[].name] | any(. == "3-code" or . == "pause:code")))
            or ((.body // "") | test("(\\[pause:code\\]|- \\[[xX]\\] [Pp]ause after [Cc]ode)"))
          ')

          if [ "$PAUSE_CODE" != "true" ]; then
            echo "paused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "paused=true" >> "$GITHUB_OUTPUT"
          gh label create "review:code" --color "FBCA04" --force --description "Paused after Code; PR open and waiting for manual validation or merge" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "review:code" --remove-label "1-think,2-plan,3-code,4-release,pause:code" || true
          gh pr edit "$PR_NUMBER" --add-label "review:code" || true
          gh issue comment "$ISSUE_NUMBER" --body "⏸️ **Paused after Code for Manual PR Validation**

          Pull Request #${PR_NUMBER} (${PR_URL}) is open and ready for your review.
          - **Manual merge:** Review and merge PR #${PR_NUMBER} directly on GitHub.
          - **Run Prove & auto-merge:** Add the **\`4-release\`** label to this issue (or run \`Pipeline - Prove\` for PR #${PR_NUMBER}) to run the 13 Prove controls and merge automatically."

          QUEUE_DATA=$(gh api graphql -f query='
            query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                issues(states: [OPEN], first: 100) {
                  nodes {
                    number
                    createdAt
                    labels(first: 20) { nodes { name } }
                    timelineItems(itemTypes: [LABELED_EVENT], last: 20) {
                      nodes {
                        ... on LabeledEvent {
                          createdAt
                          label { name }
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" 2>/dev/null || true)

          NEXT_ISSUE=$(echo "$QUEUE_DATA" | jq -r --argjson current "${ISSUE_NUMBER:-0}" '
            [
              .data.repository.issues.nodes[]?
              | select(.number != $current)
              | select([.labels.nodes[].name] | any(. == "1-think" or . == "2-plan" or . == "3-code" or . == "4-release"))
              | select(([.labels.nodes[].name] | index("needs:developer")) == null)
              | {
                  number: .number,
                  readyAt: (([.timelineItems.nodes[]? | select(.label.name == "1-think" or .label.name == "2-plan" or .label.name == "3-code" or .label.name == "4-release") | .createdAt] | last) // .createdAt)
                }
            ]
            | sort_by(.readyAt, .number)
            | .[0].number // empty
          ')

          if [ -n "$NEXT_ISSUE" ]; then
            echo "Advancing FIFO queue to next labeled issue #${NEXT_ISSUE} while PR #${PR_NUMBER} (#${ISSUE_NUMBER}) awaits manual review..."
            gh workflow run think.yml -f issue_number="$NEXT_ISSUE"
          fi

      - name: Upload code-spec artifact for Prove workflow
        if: steps.resolve.outputs.skip != 'true' && steps.checkpoint.outputs.paused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: code-spec
          path: |
            specs/issue_number.txt
            specs/pr_number.txt
            specs/issue-${{ env.ISSUE_NUMBER }}/think.md
            specs/issue-${{ env.ISSUE_NUMBER }}/plan.md
            specs/issue-${{ env.ISSUE_NUMBER }}/editor-requests.json
          retention-days: 7

      - name: Advance FIFO queue if Code fails
        if: failure() && steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "${ISSUE_NUMBER:-}" ]; then
            gh label create needs:developer --force --description "Pipeline failed or fix-loop limit reached; developer attention required" || true
            gh issue edit "$ISSUE_NUMBER" --add-label "needs:developer" --remove-label "1-think,2-plan,3-code,4-release" || true
          fi

          QUEUE_DATA=$(gh api graphql -f query='
            query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                issues(states: [OPEN], first: 100) {
                  nodes {
                    number
                    createdAt
                    labels(first: 20) { nodes { name } }
                    timelineItems(itemTypes: [LABELED_EVENT], last: 20) {
                      nodes {
                        ... on LabeledEvent {
                          createdAt
                          label { name }
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" 2>/dev/null || true)

          NEXT_ISSUE=$(echo "$QUEUE_DATA" | jq -r --argjson current "${ISSUE_NUMBER:-0}" '
            [
              .data.repository.issues.nodes[]?
              | select(.number != $current)
              | select([.labels.nodes[].name] | any(. == "1-think" or . == "2-plan" or . == "3-code" or . == "4-release"))
              | select(([.labels.nodes[].name] | index("needs:developer")) == null)
              | {
                  number: .number,
                  readyAt: (([.timelineItems.nodes[]? | select(.label.name == "1-think" or .label.name == "2-plan" or .label.name == "3-code" or .label.name == "4-release") | .createdAt] | last) // .createdAt)
                }
            ]
            | sort_by(.readyAt, .number)
            | .[0].number // empty
          ')

          if [ -n "$NEXT_ISSUE" ]; then
            echo "Advancing FIFO queue to next labeled issue #${NEXT_ISSUE}..."
            gh workflow run think.yml -f issue_number="$NEXT_ISSUE"
          fi
