name: Audit - Runner

on:
  workflow_call:
    inputs:
      agent:
        description: 'Copilot agent name (e.g. dependency-leverage, vector-first, perf-audit, dead-code, test-gap, docs-sync)'
        required: true
        type: string
      scope:
        description: 'Target path to audit'
        required: false
        default: 'src/'
        type: string
      prompt:
        description: 'Extra instructions for the agent'
        required: false
        default: ''
        type: string
      project_title:
        description: 'GitHub Project V2 board title (defaults to repository name)'
        required: false
        default: ''
        type: string
    secrets:
      PIPELINE_GITHUB_TOKEN:
        required: true
      COPILOT_GITHUB_TOKEN:
        required: true

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    concurrency:
      group: copilot-audit-${{ inputs.agent }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_GITHUB_TOKEN }}

      - name: Check scheduled audit activity and backlog gate
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          CURRENT_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          AGENT: ${{ inputs.agent }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$REPO_PRIVATE" = "true" ]; then
            echo "::notice::Skipping scheduled ${AGENT} audit: ${CURRENT_REPO} is a private repository."
            echo "Skipped scheduled \`${AGENT}\` audit: private repository." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RECENT_COMMIT=$(git log -1 --since="7 days ago" --format="%H" 2>/dev/null || true)
          if [ -z "$RECENT_COMMIT" ]; then
            echo "::notice::Skipping scheduled ${AGENT} audit: no new commits in ${CURRENT_REPO} in the last 7 days."
            echo "Skipped scheduled \`${AGENT}\` audit: no new commits in the last 7 days." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AUDIT_LABEL="audit:${AGENT}"
          OPEN_AUDIT_COUNT=$(gh issue list --repo "$CURRENT_REPO" --state open --label "$AUDIT_LABEL" --limit 100 --json number 2>/dev/null | jq 'if type == "array" then length else 0 end' || echo "0")
          if [ "$OPEN_AUDIT_COUNT" -ge 10 ]; then
            echo "::notice::Skipping scheduled ${AGENT} audit: ${OPEN_AUDIT_COUNT} open ${AUDIT_LABEL} issues already awaiting triage."
            echo "Skipped scheduled \`${AGENT}\` audit: ${OPEN_AUDIT_COUNT} open \`${AUDIT_LABEL}\` issues already awaiting triage." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Inject 1pizzateam/coding-pal primitives
        if: steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/1pizzateam/coding-pal.git /tmp/coding-pal
          rm -rf .github/instructions .github/agents .github/prompts .github/skills .github/copilot-instructions.md .agents .claude .cursor .gemini CLAUDE.md GEMINI.md AGENTS.md .cursorrules .windsurfrules
          mkdir -p .github/instructions .github/agents .agents/skills
          cp /tmp/coding-pal/instructions/*.md .github/instructions/
          cp /tmp/coding-pal/agents/*.md .github/agents/
          cp -R /tmp/coding-pal/skills/* .agents/skills/
          rm -rf /tmp/coding-pal

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Clone sibling DoomR.js workspace for companion game editors
        if: steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          case "$REPO_NAME" in
            Cadenza|FaceGun|MappR|PixelGun|PolyGun|ShaderGun)
              if [ ! -d ../DoomR.js ]; then
                git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/1pizzateam/DoomR.js.git" ../DoomR.js
              fi
              if [ "$REPO_NAME" = "FaceGun" ] && [ ! -d ../FaceR.js ]; then
                git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/1pizzateam/FaceR.js.git" ../FaceR.js
              fi
              ;;
          esac

      - name: Install project dependencies for codebase investigation
        if: steps.preflight.outputs.skip != 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts 2>/dev/null || npm ci || true
          fi

      - name: Cache Copilot CLI
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.copilot-cli
          key: copilot-cli-${{ runner.os }}-node22

      - name: Install Copilot CLI
        if: steps.preflight.outputs.skip != 'true'
        run: |
          if [ ! -x "$HOME/.copilot-cli/bin/copilot" ]; then
            npm install --prefix "$HOME/.copilot-cli" -g @github/copilot
          fi
          echo "$HOME/.copilot-cli/bin" >> "$GITHUB_PATH"

      - name: Run ${{ inputs.agent }} agent
        if: steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          CURRENT_REPO: ${{ github.repository }}
          AGENT: ${{ inputs.agent }}
          SCOPE: ${{ inputs.scope }}
          EXTRA_PROMPT: ${{ inputs.prompt }}
        run: |
          OPEN_ISSUES_CONTEXT=$(gh issue list --repo "$CURRENT_REPO" --state open --limit 200 --json number,title,body 2>/dev/null | jq -r '
            if type == "array" and length > 0 then
              "Existing open issues in this repository (do NOT re-report or bundle any finding, file, or symbol already tracked below):\n" +
              (map(
                "- #" + (.number | tostring) + ": " + (.title // "") +
                (([(.body // "") | scan("`([A-Za-z0-9_./$-]+)`") | .[0]] | unique) as $refs |
                 if ($refs | length) > 0 then " (refs: " + ($refs[0:12] | map("`" + . + "`") | join(", ")) + ")" else "" end)
              ) | join("\n"))
            else "" end
          ' 2>/dev/null || echo "")
          copilot --model="gemini-3.8-flash" --agent="$AGENT" --allow-all-tools \
            --prompt "Scope: ${SCOPE}. ${EXTRA_PROMPT} ${OPEN_ISSUES_CONTEXT} Do not modify repository source, test, or documentation files. Keep each finding scoped to a single cohesive module/concern (do not bundle unrelated files or exports into one catch-all issue) and skip any symbol or file already tracked by an open issue. Write structured findings to audit-findings.json as a JSON array of objects, where each element has keys: { \"title\": \"<concise issue title>\", \"priority\": \"<Urgent|High|Medium|Low>\", \"model\": \"<claude-sonnet-5.5|claude-opus-5.5|claude-haiku-5.5|gpt-6.1-sol|gpt-6.1-terra|gpt-6-luna|gpt-5.3-codex|gemini-4-argon|gemini-3.8-flash|auto>\", \"effort\": \"<Low|Medium|High|Max>\", \"problem\": \"<clear problem explanation>\", \"affectedFiles\": [\"<file path>\"], \"suggestedFix\": \"<concrete remediation>\", \"acceptanceCriteria\": [\"- **AC-1:** <testable criterion>\"], \"body\": \"## Problem\\n\\n<problem>\\n\\n## Affected Files\\n\\n- \`<file>\`\\n\\n## Suggested Fix\\n\\n<fix>\\n\\n## Acceptance Criteria\\n\\n- **AC-1:** <criterion>\" } (or [] if no findings exist), choosing model and effort based on finding complexity and priority (e.g. gemini-3.8-flash/claude-haiku-5.5 + Low for trivial cleanup/docs, claude-sonnet-5.5 + Medium/High for standard code/tests/refactors, claude-opus-5.5 + High/Max for complex architectural/hot-loop changes), and write a brief Markdown summary of the audit to audit-report.md. Always separate Markdown headings and sections with real newlines (\\n\\n), never a single line. If an upstream @1pizzateam/* library (`@1pizzateam/roostr` -> `1pizzateam/RoostR.js`, `@1pizzateam/bumpr` -> `1pizzateam/BumpR.js`, `@1pizzateam/loopr` -> `1pizzateam/LoopR.js`, `@1pizzateam/spock` -> `1pizzateam/Spock.js`, `@1pizzateam/groovr` -> `1pizzateam/GroovR.js`, `@1pizzateam/facer` -> `1pizzateam/FaceR.js`) should be updated instead of (or prior to) changing this repository, write the structured request array to upstream-requests.json with objects `{ \"package\": \"@1pizzateam/<pkg>\", \"repo\": \"1pizzateam/<Repo>\", \"priority\": \"<Urgent|High|Medium|Low>\", \"model\": \"<claude-sonnet-5.5|claude-opus-5.5|claude-haiku-5.5|gpt-6.1-sol|gpt-6.1-terra|gpt-6-luna|gpt-5.3-codex|gemini-4-argon|gemini-3.8-flash|auto>\", \"effort\": \"<Low|Medium|High|Max>\", \"library_issue_title\": \"<upstream issue title>\", \"library_issue_body\": \"## Problem\\n\\n<problem>\\n\\n## Proposed API\\n\\n<proposed API>\\n\\n## Acceptance Criteria\\n\\n- **AC-1:** <criterion>\", \"consumer_issue_title\": \"<blocked consumer issue title>\", \"consumer_issue_body\": \"## Problem\\n\\n<problem>\\n\\n## Affected Files\\n\\n- \`<file>\`\\n\\n## Suggested Fix\\n\\n<fix>\\n\\n## Acceptance Criteria\\n\\n- **AC-1:** <criterion>\" }`. If a finding in DoomR.js requires a companion update in one of the 1PizzaTeam game editors (`cadenza` -> `1pizzateam/Cadenza`, `facegun` -> `1pizzateam/FaceGun`, `mappr` -> `1pizzateam/MappR`, `pixelgun` -> `1pizzateam/PixelGun`, `polygun` -> `1pizzateam/PolyGun`, `shadergun` -> `1pizzateam/ShaderGun`), write a JSON array to editor-requests.json with objects `{ \"editor\": \"<cadenza|facegun|mappr|pixelgun|polygun|shadergun>\", \"repo\": \"1pizzateam/<Editor>\", \"priority\": \"<Urgent|High|Medium|Low>\", \"model\": \"<claude-sonnet-5.5|claude-opus-5.5|claude-haiku-5.5|gpt-6.1-sol|gpt-6.1-terra|gpt-6-luna|gpt-5.3-codex|gemini-4-argon|gemini-3.8-flash|auto>\", \"effort\": \"<Low|Medium|High|Max>\", \"title\": \"<issue title>\", \"problem\": \"<what changed in DoomR.js>\", \"affectedFiles\": [\"<DoomR.js file>\"], \"suggestedDirection\": \"<editor changes needed>\", \"body\": \"## Problem\\n\\n<problem>\\n\\n## Affected DoomR.js Files\\n\\n- \`<file>\`\\n\\n## Suggested Direction\\n\\n<direction>\" }`."

      - name: Create issues for audit findings and add to Project
        id: create_findings
        if: always() && steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          CURRENT_REPO: ${{ github.repository }}
          AGENT: ${{ inputs.agent }}
          SCOPE: ${{ inputs.scope }}
          PROJECT_TITLE: ${{ inputs.project_title }}
        run: |
          if [ ! -s audit-findings.json ]; then
            rm -f audit-findings.json
            echo "created_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT=$(jq 'if type == "array" then length else 0 end' audit-findings.json 2>/dev/null || echo "0")
          if [ "$COUNT" -eq 0 ]; then
            rm -f audit-findings.json
            echo "created_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OWNER="${CURRENT_REPO%%/*}"
          REPO="${CURRENT_REPO#*/}"
          PROJECT_TITLE="${PROJECT_TITLE:-$REPO}"
          AUDIT_LABEL="audit:${AGENT}"

          gh label create "$AUDIT_LABEL" --repo "$CURRENT_REPO" --force --description "Finding reported by ${AGENT} audit" || true

          OPEN_ISSUES=$(gh issue list --repo "$CURRENT_REPO" --state open --limit 200 --json number,title,body 2>/dev/null || echo '[]')

          CREATED_COUNT=0
          for ((i = 0; i < COUNT; i++)); do
            TITLE=$(jq -r ".[$i].title // empty" audit-findings.json)
            PRIORITY=$(jq -r --argjson idx "$i" '
              ((.[$idx].priority // .[$idx].severity // "") | tostring | ascii_downcase | gsub("^\\s+|\\s+$"; "")) as $p |
              if ($p == "urgent" or $p == "critical" or $p == "p0") then "Urgent"
              elif ($p == "high" or $p == "major" or $p == "p1") then "High"
              elif ($p == "low" or $p == "minor" or $p == "trivial" or $p == "p3") then "Low"
              else "Medium" end
            ' audit-findings.json)
            MODEL=$(jq -r --argjson idx "$i" '
              ((.[$idx].model // "") | tostring | ascii_downcase | gsub("^\\s+|\\s+$"; "")) as $m |
              if ($m == "claude-opus-5.5" or $m == "opus") then "claude-opus-5.5"
              elif ($m == "claude-haiku-5.5" or $m == "haiku") then "claude-haiku-5.5"
              elif ($m == "gpt-6.1-sol") then "gpt-6.1-sol"
              elif ($m == "gpt-6.1-terra" or $m == "terra") then "gpt-6.1-terra"
              elif ($m == "gpt-6-luna" or $m == "luna") then "gpt-6-luna"
              elif ($m == "gpt-5.3-codex" or $m == "codex") then "gpt-5.3-codex"
              elif ($m == "gemini-4-argon" or $m == "argon") then "gemini-4-argon"
              elif ($m == "gemini-3.8-flash" or $m == "flash") then "gemini-3.8-flash"
              elif ($m == "auto") then "auto"
              else "claude-sonnet-5.5" end
            ' audit-findings.json)
            EFFORT=$(jq -r --argjson idx "$i" '
              ((.[$idx].effort // .[$idx].reasoningEffort // .[$idx].reasoning_effort // "") | tostring | ascii_downcase | gsub("^\\s+|\\s+$"; "")) as $e |
              if ($e == "max" or $e == "xhigh") then "Max"
              elif ($e == "high") then "High"
              elif ($e == "low" or $e == "minimal" or $e == "none") then "Low"
              else "Medium" end
            ' audit-findings.json)
            BODY=$(jq -r --argjson idx "$i" '
              def norm:
                gsub("\\r\\n"; "\n")
                | gsub("\\\\r\\\\n"; "\n")
                | gsub("\\\\n"; "\n")
                | gsub("(?<a>[^\\n])[ \\t]+(?<b>\\*\\*(?:Problem(?: Statement)?|Affected(?: [A-Za-z0-9_./-]+)* Files|Suggested (?:Fix|Direction|Remediation)|Proposed (?:API|Changes|Solution)|Acceptance Criteria):?\\*\\*:?)"; "\(.a)\n\n\(.b)")
                | gsub("(?m)^[ \\t]*\\*\\*(?<sec>Problem(?: Statement)?|Affected(?: [A-Za-z0-9_./-]+)* Files|Suggested (?:Fix|Direction|Remediation)|Proposed (?:API|Changes|Solution)|Acceptance Criteria):?\\*\\*:?[ \\t]*"; "## \(.sec)\n\n")
                | gsub("(?<a>[^\\n])\\s+(?<h>#{1,3}\\s+(?:Problem|Context|Summary|Root Cause|Affected|Suggested|Proposed|Acceptance|Verification)\\b)"; "\(.a)\n\n\(.h)")
                | gsub("(?<a>[^\\n])\\s+(?<h>#{2,3}\\s+)"; "\(.a)\n\n\(.h)")
                | gsub("(?m)^#{1,3}\\s+(?<sec>Problem(?: Statement)?|Context|Summary|Root Cause|Affected(?: [A-Za-z0-9_./-]+)* Files(?: \\([^)]*\\))?|Suggested (?:Fix|Direction|Remediation)|Proposed (?:API|Changes|Solution)|Acceptance Criteria|Verification)\\b:?[ \\t]*(?<rest>\\S[^\\n]*)"; "## \(.sec)\n\n\(.rest)")
                | gsub("(?m)^#\\s+(?<sec>Problem(?: Statement)?|Context|Summary|Root Cause|Affected(?: [A-Za-z0-9_./-]+)* Files(?: \\([^)]*\\))?|Suggested (?:Fix|Direction|Remediation)|Proposed (?:API|Changes|Solution)|Acceptance Criteria|Verification)\\b:?[ \\t]*$"; "## \(.sec)")
                | gsub("(?<a>[^\\n])[ \\t]+(?<b>- \\*\\*AC-[0-9]+:\\*\\*)"; "\(.a)\n\(.b)")
                | gsub("(?<a>[^\\n-])[ \\t]+(?<b>\\*\\*AC-[0-9]+:\\*\\*)"; "\(.a)\n- \(.b)")
                | gsub("(?<a>[^\\n])[ \\t]+(?<b>- `[^`]+`)"; "\(.a)\n\(.b)")
                | if (test("(?im)^#{2,3}\\s+Acceptance Criteria") | not) and test("(?m)^- \\*\\*AC-1:\\*\\*") then
                    sub("(?m)^(?<b>- \\*\\*AC-1:\\*\\*)"; "\n\n## Acceptance Criteria\n\n\(.b)")
                  else . end
                | if (test("\\n") | not) and test("^#{1,6}\\s+") then
                    "## Problem\n\n" + sub("^#{1,6}\\s+"; "")
                  else . end
                | gsub("(?m)^(?<h>#{2,3}\\s+[^\\n]+)\\n(?<c>[^\\n#])"; "\(.h)\n\n\(.c)")
                | gsub("(?<a>[^\\n])\\n(?<h>#{2,3}\\s+)"; "\(.a)\n\n\(.h)")
                | gsub("\\n{3,}"; "\n\n")
                | sub("^\\s+"; "")
                | sub("\\s+$"; "");
              .[$idx] |
              ((.body // "") | tostring | norm) as $raw |
              ((.problem // "") | tostring | norm) as $prob |
              ((.affectedFiles // .affected_files // []) | if type == "array" and length > 0 then (map(tostring | if test("^\\s*-\\s+") then . else "- `" + (gsub("^`|`$"; "")) + "`" end) | join("\n")) elif type == "string" then (. | norm) else "" end) as $files |
              ((.suggestedFix // .suggested_fix // .suggestedRemediation // .suggested_remediation // .suggestedDirection // .suggested_direction // .proposedApi // .proposed_api // "") | tostring | norm) as $fix |
              ((.acceptanceCriteria // .acceptance_criteria // []) | if type == "array" and length > 0 then (map(tostring | if test("^\\s*-\\s+") then . else "- " + . end) | join("\n")) elif type == "string" then (. | norm) else "" end) as $ac |
              if ($raw | test("(?m)^#{2,3}\\s+")) then
                $raw
              elif (($prob | length) > 0 or ($files | length) > 0 or ($fix | length) > 0 or ($ac | length) > 0) then
                ([
                  (if ($prob | length) > 0 then "## Problem\n\n" + $prob elif ($raw | length) > 0 then "## Problem\n\n" + $raw else empty end),
                  (if ($files | length) > 0 then "## Affected Files\n\n" + $files else empty end),
                  (if ($fix | length) > 0 then "## Suggested Fix\n\n" + $fix else empty end),
                  (if ($ac | length) > 0 then "## Acceptance Criteria\n\n" + $ac else empty end)
                ] | join("\n\n") | norm)
              else
                $raw
              end
            ' audit-findings.json)

            if [ -z "$TITLE" ] || [ -z "$BODY" ]; then
              continue
            fi

            FULL_BODY="${BODY}

          ---
          _Reported by \`${AGENT}\` audit in \`${SCOPE}\`._"

            EXISTING_NUM=$(echo "$OPEN_ISSUES" | jq -r --arg t "$TITLE" --arg b "$BODY" '
              def files(s):
                [ (s // "") | scan("`([A-Za-z0-9_./-]+\\.[A-Za-z0-9]+)`") | .[0] | ascii_downcase ] | unique;
              def syms(t; b):
                ([ (t // ""), (b // "") | scan("`([A-Za-z_][A-Za-z0-9_$]{2,})`") | .[0] ]
                 + [ (t // "") | scan("\\b([A-Z][A-Z0-9_]{2,}|[a-z]+[A-Z][A-Za-z0-9_]*)\\b") | .[0] ])
                | map(select((test("\\.") | not) and (ascii_downcase | test("^(true|false|null|undefined|none|todo|fixme|chore|feat|fix|test|docs|perf|refactor)$") | not)))
                | unique;
              files($b) as $cfiles |
              syms($t; $b) as $csyms |
              .[]? |
              select(
                ((.title // "" | ascii_downcase) == ($t | ascii_downcase))
                or (
                  ($cfiles | length) > 0 and ($csyms | length) > 0
                  and (files((.title // "") + "\n" + (.body // "")) as $ifiles | [$cfiles[] | select(. as $f | $ifiles | index($f))] | length > 0)
                  and (syms(.title; .body) as $isyms | [$csyms[] | select(. as $s | $isyms | index($s))] | length > 0)
                )
              ) | .number
            ' | head -n 1)
            if [ -n "$EXISTING_NUM" ]; then
              NEEDS_LAYOUT_FIX=$(echo "$OPEN_ISSUES" | jq -r --argjson num "$EXISTING_NUM" --arg t "$TITLE" '
                (.[]? | select(.number == $num and ((.title // "" | ascii_downcase) == ($t | ascii_downcase))) | .body // "") as $b |
                if ($b | length) > 0 and (($b | test("(?m)^#{1,3}\\s+(?:Problem|Context|Summary|Root Cause|Affected|Suggested|Proposed|Acceptance)\\b:?[ \\t]+\\S")) or (($b | split("\n---\n")[0] // "") | test("\\n") | not)) then "true" else "false" end
              ')
              if [ "$NEEDS_LAYOUT_FIX" = "true" ]; then
                gh issue edit "$EXISTING_NUM" --repo "$CURRENT_REPO" --body "$FULL_BODY" >/dev/null 2>&1 || true
              fi
              echo "Skipping duplicate finding (already open as #${EXISTING_NUM}): ${TITLE}"
              continue
            fi

            ISSUE_URL=$(gh issue create --repo "$CURRENT_REPO" \
              --title "$TITLE" \
              --label "$AUDIT_LABEL" \
              --body "$FULL_BODY")
            ISSUE_NUMBER="${ISSUE_URL##*/}"
            CREATED_COUNT=$((CREATED_COUNT + 1))

            OPEN_ISSUES=$(echo "$OPEN_ISSUES" | jq -c --argjson num "${ISSUE_NUMBER:-0}" --arg title "$TITLE" --arg body "$FULL_BODY" '. + [{"number": $num, "title": $title, "body": $body}]')

            DATA=$(gh api graphql -f query='
              query($owner: String!, $repo: String!, $number: Int!, $projectTitle: String!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    id
                    projectItems(first: 20) {
                      nodes {
                        id
                        project { id }
                      }
                    }
                  }
                  owner {
                    ... on Organization {
                      issueFields(first: 20) {
                        nodes {
                          ... on IssueFieldSingleSelect {
                            id
                            name
                            options { id name }
                          }
                        }
                      }
                      projectsV2(first: 20, query: $projectTitle) {
                        nodes {
                          id
                          title
                          field(name: "Status") {
                            ... on ProjectV2SingleSelectField {
                              id
                              options { id name }
                            }
                          }
                        }
                      }
                    }
                    ... on User {
                      projectsV2(first: 20, query: $projectTitle) {
                        nodes {
                          id
                          title
                          field(name: "Status") {
                            ... on ProjectV2SingleSelectField {
                              id
                              options { id name }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }' -f owner="$OWNER" -f repo="$REPO" -F number="$ISSUE_NUMBER" -f projectTitle="$PROJECT_TITLE" 2>/dev/null || true)
            DATA="${DATA:-"{}"}"

            ISSUE_ID=$(echo "$DATA" | jq -r '.data.repository.issue.id // empty' | head -n 1)
            PRIORITY_FIELD=$(echo "$DATA" | jq -c '.data.repository.owner.issueFields.nodes[]? | select((.name // "" | ascii_downcase) == "priority")' | head -n 1)
            PRIORITY_FIELD_ID=$(echo "$PRIORITY_FIELD" | jq -r '.id // empty')
            PRIORITY_OPTION_ID=$(echo "$PRIORITY_FIELD" | jq -r --arg p "$PRIORITY" '(.options[]? | select((.name | ascii_downcase) == ($p | ascii_downcase)) | .id), (.options[]? | select((.name | ascii_downcase) == "medium") | .id)' | head -n 1)
            if [ -z "$PRIORITY_FIELD_ID" ] || [ -z "$PRIORITY_OPTION_ID" ]; then
              PRIORITY_FIELD_ID="IFSS_kgDOAoWpGg"
              case "$PRIORITY" in
                Urgent) PRIORITY_OPTION_ID="IFSSO_kgDOBGndlw" ;;
                High)   PRIORITY_OPTION_ID="IFSSO_kgDOBGndmA" ;;
                Low)    PRIORITY_OPTION_ID="IFSSO_kgDOBGndmg" ;;
                *)      PRIORITY_OPTION_ID="IFSSO_kgDOBGndmQ" ;;
              esac
            fi
            if [ -n "$ISSUE_ID" ] && [ -n "$PRIORITY_FIELD_ID" ] && [ -n "$PRIORITY_OPTION_ID" ]; then
              gh api graphql -f query='
                mutation($issueId: ID!, $fieldId: ID!, $optionId: ID!) {
                  setIssueFieldValue(input: {
                    issueId: $issueId,
                    issueFields: [{ fieldId: $fieldId, singleSelectOptionId: $optionId }]
                  }) { issue { id } }
                }' -f issueId="$ISSUE_ID" -f fieldId="$PRIORITY_FIELD_ID" -f optionId="$PRIORITY_OPTION_ID" >/dev/null 2>&1 || true
            fi
            MODEL_FIELD=$(echo "$DATA" | jq -c '.data.repository.owner.issueFields.nodes[]? | select((.name // "" | ascii_downcase) == "model")' | head -n 1)
            MODEL_FIELD_ID=$(echo "$MODEL_FIELD" | jq -r '.id // empty')
            MODEL_OPTION_ID=$(echo "$MODEL_FIELD" | jq -r --arg m "$MODEL" '(.options[]? | select((.name | ascii_downcase) == ($m | ascii_downcase)) | .id), (.options[]? | select((.name | ascii_downcase) == "claude-sonnet-5.5") | .id)' | head -n 1)
            if [ -z "$MODEL_FIELD_ID" ] || [ -z "$MODEL_OPTION_ID" ]; then
              MODEL_FIELD_ID="IFSS_kgDOAvKZhw"
              case "$MODEL" in
                claude-opus-5.5)  MODEL_OPTION_ID="IFSSO_kgDOBSkjjA" ;;
                claude-haiku-5.5) MODEL_OPTION_ID="IFSSO_kgDOBSkjjQ" ;;
                gpt-6.1-sol)      MODEL_OPTION_ID="IFSSO_kgDOBSkjjg" ;;
                gpt-6.1-terra)    MODEL_OPTION_ID="IFSSO_kgDOBSkjjw" ;;
                gpt-6-luna)       MODEL_OPTION_ID="IFSSO_kgDOBSkjkA" ;;
                gpt-5.3-codex)    MODEL_OPTION_ID="IFSSO_kgDOBSkjkQ" ;;
                gemini-4-argon)   MODEL_OPTION_ID="IFSSO_kgDOBSkjkg" ;;
                gemini-3.8-flash) MODEL_OPTION_ID="IFSSO_kgDOBSkjkw" ;;
                auto)             MODEL_OPTION_ID="IFSSO_kgDOBSkjlQ" ;;
                *)                MODEL_OPTION_ID="IFSSO_kgDOBSkjiw" ;;
              esac
            fi
            if [ -n "$ISSUE_ID" ] && [ -n "$MODEL_FIELD_ID" ] && [ -n "$MODEL_OPTION_ID" ]; then
              gh api graphql -f query='
                mutation($issueId: ID!, $fieldId: ID!, $optionId: ID!) {
                  setIssueFieldValue(input: {
                    issueId: $issueId,
                    issueFields: [{ fieldId: $fieldId, singleSelectOptionId: $optionId }]
                  }) { issue { id } }
                }' -f issueId="$ISSUE_ID" -f fieldId="$MODEL_FIELD_ID" -f optionId="$MODEL_OPTION_ID" >/dev/null 2>&1 || true
            fi
            EFFORT_FIELD=$(echo "$DATA" | jq -c '.data.repository.owner.issueFields.nodes[]? | select((.name // "" | ascii_downcase) == "effort")' | head -n 1)
            EFFORT_FIELD_ID=$(echo "$EFFORT_FIELD" | jq -r '.id // empty')
            EFFORT_OPTION_ID=$(echo "$EFFORT_FIELD" | jq -r --arg e "$EFFORT" '(.options[]? | select((.name | ascii_downcase) == ($e | ascii_downcase)) | .id), (.options[]? | select((.name | ascii_downcase) == "medium") | .id)' | head -n 1)
            if [ -z "$EFFORT_FIELD_ID" ] || [ -z "$EFFORT_OPTION_ID" ]; then
              EFFORT_FIELD_ID="IFSS_kgDOAvKWEg"
              case "$EFFORT" in
                Max)  EFFORT_OPTION_ID="IFSSO_kgDOBSkdRA" ;;
                High) EFFORT_OPTION_ID="IFSSO_kgDOBSkdRQ" ;;
                Low)  EFFORT_OPTION_ID="IFSSO_kgDOBSkdRw" ;;
                *)    EFFORT_OPTION_ID="IFSSO_kgDOBSkdRg" ;;
              esac
            fi
            if [ -n "$ISSUE_ID" ] && [ -n "$EFFORT_FIELD_ID" ] && [ -n "$EFFORT_OPTION_ID" ]; then
              gh api graphql -f query='
                mutation($issueId: ID!, $fieldId: ID!, $optionId: ID!) {
                  setIssueFieldValue(input: {
                    issueId: $issueId,
                    issueFields: [{ fieldId: $fieldId, singleSelectOptionId: $optionId }]
                  }) { issue { id } }
                }' -f issueId="$ISSUE_ID" -f fieldId="$EFFORT_FIELD_ID" -f optionId="$EFFORT_OPTION_ID" >/dev/null 2>&1 || true
            fi

            PROJECT=$(echo "$DATA" | jq -c --arg title "$PROJECT_TITLE" --arg repo "$REPO" '.data.repository.owner.projectsV2.nodes[]? | select((.title | ascii_downcase | sub("\\.js$"; "")) == ($title | ascii_downcase | sub("\\.js$"; "")) or (.title | ascii_downcase) == ($repo | ascii_downcase))' | head -n 1)
            PROJECT_ID=$(echo "$PROJECT" | jq -r '.id // empty')
            FIELD_ID=$(echo "$PROJECT" | jq -r '.field.id // empty')
            OPTION_ID=$(echo "$PROJECT" | jq -r '.field.options[]? | select((.name | ascii_downcase) == "triage") | .id' | head -n 1)

            if [ -n "$ISSUE_ID" ] && [ -n "$PROJECT_ID" ]; then
              ITEM_ID=$(gh api graphql -f query='
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } }
                }' -f projectId="$PROJECT_ID" -f contentId="$ISSUE_ID" --jq '.data.addProjectV2ItemById.item.id' 2>/dev/null || true)
              if [ -z "$ITEM_ID" ]; then
                ITEM_ID=$(echo "$DATA" | jq -r --arg pid "$PROJECT_ID" '.data.repository.issue.projectItems.nodes[]? | select(.project.id == $pid) | .id' | head -n 1)
              fi
              if [ -n "$ITEM_ID" ] && [ -n "$FIELD_ID" ] && [ -n "$OPTION_ID" ]; then
                gh api graphql -f query='
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                      value: { singleSelectOptionId: $optionId }
                    }) { projectV2Item { id } }
                  }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$FIELD_ID" -f optionId="$OPTION_ID" >/dev/null 2>&1 || true
              fi
            fi

            {
              if [ "$CREATED_COUNT" -eq 1 ]; then
                echo ""
                echo "### Created Audit Finding Issues"
              fi
              echo "- ${ISSUE_URL}: ${TITLE}"
            } >> audit-report.md
          done

          echo "created_count=${CREATED_COUNT}" >> "$GITHUB_OUTPUT"
          rm -f audit-findings.json

      - name: Escalate upstream @1pizzateam/* library requests
        if: always() && steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          CURRENT_REPO: ${{ github.repository }}
          AGENT: ${{ inputs.agent }}
          PROJECT_TITLE: ${{ inputs.project_title }}
        run: |
          if [ ! -s upstream-requests.json ]; then
            rm -f upstream-requests.json
            exit 0
          fi

          COUNT=$(jq 'if type == "array" then length else 0 end' upstream-requests.json 2>/dev/null || echo "0")
          if [ "$COUNT" -eq 0 ]; then
            rm -f upstream-requests.json
            exit 0
          fi

          AUDIT_LABEL="audit:${AGENT}"
          gh label create "blocked:upstream" --repo "$CURRENT_REPO" --force --description "Waiting on an upstream @1pizzateam library release" || true
          gh label create "upstream-escalated:1" --repo "$CURRENT_REPO" --force --description "Escalated once to an upstream @1pizzateam library" || true
          gh label create "$AUDIT_LABEL" --repo "$CURRENT_REPO" --force --description "Finding reported by ${AGENT} audit" || true

          add_to_project() {
            local target_full="$1"
            local issue_num="$2"
            local custom_title="${3:-}"
            local priority_val="${4:-Medium}"
            local model_val="${5:-claude-sonnet-5.5}"
            local effort_val="${6:-Medium}"
            local owner="${target_full%%/*}"
            local repo="${target_full#*/}"
            local ptitle="${custom_title:-$repo}"
            local data
            data=$(gh api graphql -f query='
              query($owner: String!, $repo: String!, $number: Int!, $projectTitle: String!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    id
                    projectItems(first: 20) {
                      nodes {
                        id
                        project { id }
                      }
                    }
                  }
                  owner {
                    ... on Organization {
                      issueFields(first: 20) {
                        nodes {
                          ... on IssueFieldSingleSelect {
                            id
                            name
                            options { id name }
                          }
                        }
                      }
                      projectsV2(first: 20, query: $projectTitle) {
                        nodes {
                          id
                          title
                          field(name: "Status") {
                            ... on ProjectV2SingleSelectField {
                              id
                              options { id name }
                            }
                          }
                        }
                      }
                    }
                    ... on User {
                      projectsV2(first: 20, query: $projectTitle) {
                        nodes {
                          id
                          title
                          field(name: "Status") {
                            ... on ProjectV2SingleSelectField {
                              id
                              options { id name }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }' -f owner="$owner" -f repo="$repo" -F number="$issue_num" -f projectTitle="$ptitle" 2>/dev/null || true)
            data="${data:-"{}"}"
            local issue_id priority_field priority_field_id priority_option_id model_field model_field_id model_option_id effort_field effort_field_id effort_option_id project project_id field_id option_id item_id
            issue_id=$(echo "$data" | jq -r '.data.repository.issue.id // empty' | head -n 1)
            priority_field=$(echo "$data" | jq -c '.data.repository.owner.issueFields.nodes[]? | select((.name // "" | ascii_downcase) == "priority")' | head -n 1)
            priority_field_id=$(echo "$priority_field" | jq -r '.id // empty')
            priority_option_id=$(echo "$priority_field" | jq -r --arg p "$priority_val" '(.options[]? | select((.name | ascii_downcase) == ($p | ascii_downcase)) | .id), (.options[]? | select((.name | ascii_downcase) == "medium") | .id)' | head -n 1)
            if [ -z "$priority_field_id" ] || [ -z "$priority_option_id" ]; then
              priority_field_id="IFSS_kgDOAoWpGg"
              case "$priority_val" in
                Urgent) priority_option_id="IFSSO_kgDOBGndlw" ;;
                High)   priority_option_id="IFSSO_kgDOBGndmA" ;;
                Low)    priority_option_id="IFSSO_kgDOBGndmg" ;;
                *)      priority_option_id="IFSSO_kgDOBGndmQ" ;;
              esac
            fi
            if [ -n "$issue_id" ] && [ -n "$priority_field_id" ] && [ -n "$priority_option_id" ]; then
              gh api graphql -f query='
                mutation($issueId: ID!, $fieldId: ID!, $optionId: ID!) {
                  setIssueFieldValue(input: {
                    issueId: $issueId,
                    issueFields: [{ fieldId: $fieldId, singleSelectOptionId: $optionId }]
                  }) { issue { id } }
                }' -f issueId="$issue_id" -f fieldId="$priority_field_id" -f optionId="$priority_option_id" >/dev/null 2>&1 || true
            fi
            model_field=$(echo "$data" | jq -c '.data.repository.owner.issueFields.nodes[]? | select((.name // "" | ascii_downcase) == "model")' | head -n 1)
            model_field_id=$(echo "$model_field" | jq -r '.id // empty')
            model_option_id=$(echo "$model_field" | jq -r --arg m "$model_val" '(.options[]? | select((.name | ascii_downcase) == ($m | ascii_downcase)) | .id), (.options[]? | select((.name | ascii_downcase) == "claude-sonnet-5.5") | .id)' | head -n 1)
            if [ -z "$model_field_id" ] || [ -z "$model_option_id" ]; then
              model_field_id="IFSS_kgDOAvKZhw"
              case "$model_val" in
                claude-opus-5.5)  model_option_id="IFSSO_kgDOBSkjjA" ;;
                claude-haiku-5.5) model_option_id="IFSSO_kgDOBSkjjQ" ;;
                gpt-6.1-sol)      model_option_id="IFSSO_kgDOBSkjjg" ;;
                gpt-6.1-terra)    model_option_id="IFSSO_kgDOBSkjjw" ;;
                gpt-6-luna)       model_option_id="IFSSO_kgDOBSkjkA" ;;
                gpt-5.3-codex)    model_option_id="IFSSO_kgDOBSkjkQ" ;;
                gemini-4-argon)   model_option_id="IFSSO_kgDOBSkjkg" ;;
                gemini-3.8-flash) model_option_id="IFSSO_kgDOBSkjkw" ;;
                auto)             model_option_id="IFSSO_kgDOBSkjlQ" ;;
                *)                model_option_id="IFSSO_kgDOBSkjiw" ;;
              esac
            fi
            if [ -n "$issue_id" ] && [ -n "$model_field_id" ] && [ -n "$model_option_id" ]; then
              gh api graphql -f query='
                mutation($issueId: ID!, $fieldId: ID!, $optionId: ID!) {
                  setIssueFieldValue(input: {
                    issueId: $issueId,
                    issueFields: [{ fieldId: $fieldId, singleSelectOptionId: $optionId }]
                  }) { issue { id } }
                }' -f issueId="$issue_id" -f fieldId="$model_field_id" -f optionId="$model_option_id" >/dev/null 2>&1 || true
            fi
            effort_field=$(echo "$data" | jq -c '.data.repository.owner.issueFields.nodes[]? | select((.name // "" | ascii_downcase) == "effort")' | head -n 1)
            effort_field_id=$(echo "$effort_field" | jq -r '.id // empty')
            effort_option_id=$(echo "$effort_field" | jq -r --arg e "$effort_val" '(.options[]? | select((.name | ascii_downcase) == ($e | ascii_downcase)) | .id), (.options[]? | select((.name | ascii_downcase) == "medium") | .id)' | head -n 1)
            if [ -z "$effort_field_id" ] || [ -z "$effort_option_id" ]; then
              effort_field_id="IFSS_kgDOAvKWEg"
              case "$effort_val" in
                Max)  effort_option_id="IFSSO_kgDOBSkdRA" ;;
                High) effort_option_id="IFSSO_kgDOBSkdRQ" ;;
                Low)  effort_option_id="IFSSO_kgDOBSkdRw" ;;
                *)    effort_option_id="IFSSO_kgDOBSkdRg" ;;
              esac
            fi
            if [ -n "$issue_id" ] && [ -n "$effort_field_id" ] && [ -n "$effort_option_id" ]; then
              gh api graphql -f query='
                mutation($issueId: ID!, $fieldId: ID!, $optionId: ID!) {
                  setIssueFieldValue(input: {
                    issueId: $issueId,
                    issueFields: [{ fieldId: $fieldId, singleSelectOptionId: $optionId }]
                  }) { issue { id } }
                }' -f issueId="$issue_id" -f fieldId="$effort_field_id" -f optionId="$effort_option_id" >/dev/null 2>&1 || true
            fi
            project=$(echo "$data" | jq -c --arg title "$ptitle" --arg repo "$repo" '.data.repository.owner.projectsV2.nodes[]? | select((.title | ascii_downcase | sub("\\.js$"; "")) == ($title | ascii_downcase | sub("\\.js$"; "")) or (.title | ascii_downcase) == ($repo | ascii_downcase))' | head -n 1)
            project_id=$(echo "$project" | jq -r '.id // empty')
            field_id=$(echo "$project" | jq -r '.field.id // empty')
            option_id=$(echo "$project" | jq -r '.field.options[]? | select((.name | ascii_downcase) == "triage") | .id' | head -n 1)
            if [ -n "$issue_id" ] && [ -n "$project_id" ]; then
              item_id=$(gh api graphql -f query='
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } }
                }' -f projectId="$project_id" -f contentId="$issue_id" --jq '.data.addProjectV2ItemById.item.id' 2>/dev/null || true)
              if [ -z "$item_id" ]; then
                item_id=$(echo "$data" | jq -r --arg pid "$project_id" '.data.repository.issue.projectItems.nodes[]? | select(.project.id == $pid) | .id' | head -n 1)
              fi
              if [ -n "$item_id" ] && [ -n "$field_id" ] && [ -n "$option_id" ]; then
                gh api graphql -f query='
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                      value: { singleSelectOptionId: $optionId }
                    }) { projectV2Item { id } }
                  }' -f projectId="$project_id" -f itemId="$item_id" -f fieldId="$field_id" -f optionId="$option_id" >/dev/null 2>&1 || true
              fi
            fi
          }

          OPEN_CONSUMER_ISSUES=$(gh issue list --repo "$CURRENT_REPO" --state open --limit 200 --json number,title,body 2>/dev/null || echo '[]')

          NORM_JQ='
            def norm:
              gsub("\\r\\n"; "\n")
              | gsub("\\\\r\\\\n"; "\n")
              | gsub("\\\\n"; "\n")
              | gsub("(?<a>[^\\n])[ \\t]+(?<b>\\*\\*(?:Problem(?: Statement)?|Affected(?: [A-Za-z0-9_./-]+)* Files|Suggested (?:Fix|Direction|Remediation)|Proposed (?:API|Changes|Solution)|Acceptance Criteria):?\\*\\*:?)"; "\(.a)\n\n\(.b)")
              | gsub("(?m)^[ \\t]*\\*\\*(?<sec>Problem(?: Statement)?|Affected(?: [A-Za-z0-9_./-]+)* Files|Suggested (?:Fix|Direction|Remediation)|Proposed (?:API|Changes|Solution)|Acceptance Criteria):?\\*\\*:?[ \\t]*"; "## \(.sec)\n\n")
              | gsub("(?<a>[^\\n])\\s+(?<h>#{1,3}\\s+(?:Problem|Context|Summary|Root Cause|Affected|Suggested|Proposed|Acceptance|Verification)\\b)"; "\(.a)\n\n\(.h)")
              | gsub("(?<a>[^\\n])\\s+(?<h>#{2,3}\\s+)"; "\(.a)\n\n\(.h)")
              | gsub("(?m)^#{1,3}\\s+(?<sec>Problem(?: Statement)?|Context|Summary|Root Cause|Affected(?: [A-Za-z0-9_./-]+)* Files(?: \\([^)]*\\))?|Suggested (?:Fix|Direction|Remediation)|Proposed (?:API|Changes|Solution)|Acceptance Criteria|Verification)\\b:?[ \\t]*(?<rest>\\S[^\\n]*)"; "## \(.sec)\n\n\(.rest)")
              | gsub("(?m)^#\\s+(?<sec>Problem(?: Statement)?|Context|Summary|Root Cause|Affected(?: [A-Za-z0-9_./-]+)* Files(?: \\([^)]*\\))?|Suggested (?:Fix|Direction|Remediation)|Proposed (?:API|Changes|Solution)|Acceptance Criteria|Verification)\\b:?[ \\t]*$"; "## \(.sec)")
              | gsub("(?<a>[^\\n])[ \\t]+(?<b>- \\*\\*AC-[0-9]+:\\*\\*)"; "\(.a)\n\(.b)")
              | gsub("(?<a>[^\\n-])[ \\t]+(?<b>\\*\\*AC-[0-9]+:\\*\\*)"; "\(.a)\n- \(.b)")
              | gsub("(?<a>[^\\n])[ \\t]+(?<b>- `[^`]+`)"; "\(.a)\n\(.b)")
              | if (test("(?im)^#{2,3}\\s+Acceptance Criteria") | not) and test("(?m)^- \\*\\*AC-1:\\*\\*") then
                  sub("(?m)^(?<b>- \\*\\*AC-1:\\*\\*)"; "\n\n## Acceptance Criteria\n\n\(.b)")
                else . end
              | if (test("\\n") | not) and test("^#{1,6}\\s+") then
                  "## Problem\n\n" + sub("^#{1,6}\\s+"; "")
                else . end
              | gsub("(?m)^(?<h>#{2,3}\\s+[^\\n]+)\\n(?<c>[^\\n#])"; "\(.h)\n\n\(.c)")
              | gsub("(?<a>[^\\n])\\n(?<h>#{2,3}\\s+)"; "\(.a)\n\n\(.h)")
              | gsub("\\n{3,}"; "\n\n")
              | sub("^\\s+"; "")
              | sub("\\s+$"; "");
          '

          MAX=$((COUNT > 3 ? 3 : COUNT))
          for ((i = 0; i < MAX; i++)); do
            PKG=$(jq -r ".[$i].package // empty" upstream-requests.json)
            TARGET_REPO=$(jq -r ".[$i].repo // empty" upstream-requests.json)
            UPSTREAM_PRIORITY=$(jq -r --argjson idx "$i" '
              ((.[$idx].priority // .[$idx].severity // "") | tostring | ascii_downcase | gsub("^\\s+|\\s+$"; "")) as $p |
              if ($p == "urgent" or $p == "critical" or $p == "p0") then "Urgent"
              elif ($p == "high" or $p == "major" or $p == "p1") then "High"
              elif ($p == "low" or $p == "minor" or $p == "trivial" or $p == "p3") then "Low"
              else "Medium" end
            ' upstream-requests.json)
            UPSTREAM_MODEL=$(jq -r --argjson idx "$i" '
              ((.[$idx].model // "") | tostring | ascii_downcase | gsub("^\\s+|\\s+$"; "")) as $m |
              if ($m == "claude-opus-5.5" or $m == "opus") then "claude-opus-5.5"
              elif ($m == "claude-haiku-5.5" or $m == "haiku") then "claude-haiku-5.5"
              elif ($m == "gpt-6.1-sol") then "gpt-6.1-sol"
              elif ($m == "gpt-6.1-terra" or $m == "terra") then "gpt-6.1-terra"
              elif ($m == "gpt-6-luna" or $m == "luna") then "gpt-6-luna"
              elif ($m == "gpt-5.3-codex" or $m == "codex") then "gpt-5.3-codex"
              elif ($m == "gemini-4-argon" or $m == "argon") then "gemini-4-argon"
              elif ($m == "gemini-3.8-flash" or $m == "flash") then "gemini-3.8-flash"
              elif ($m == "auto") then "auto"
              else "claude-sonnet-5.5" end
            ' upstream-requests.json)
            UPSTREAM_EFFORT=$(jq -r --argjson idx "$i" '
              ((.[$idx].effort // .[$idx].reasoningEffort // .[$idx].reasoning_effort // "") | tostring | ascii_downcase | gsub("^\\s+|\\s+$"; "")) as $e |
              if ($e == "max" or $e == "xhigh") then "Max"
              elif ($e == "high") then "High"
              elif ($e == "low" or $e == "minimal" or $e == "none") then "Low"
              else "Medium" end
            ' upstream-requests.json)
            LIB_TITLE=$(jq -r ".[$i].library_issue_title // empty" upstream-requests.json)
            LIB_BODY=$(jq -r --argjson idx "$i" "${NORM_JQ} (.[$idx].library_issue_body // \"\") | tostring | norm" upstream-requests.json)
            CONSUMER_TITLE=$(jq -r ".[$i].consumer_issue_title // empty" upstream-requests.json)
            CONSUMER_BODY=$(jq -r --argjson idx "$i" "${NORM_JQ} (.[$idx].consumer_issue_body // \"\") | tostring | norm" upstream-requests.json)

            if [ -z "$PKG" ] || [ -z "$TARGET_REPO" ] || [ -z "$LIB_TITLE" ] || [ -z "$CONSUMER_TITLE" ]; then
              continue
            fi
            if [ "$TARGET_REPO" = "$CURRENT_REPO" ]; then
              continue
            fi

            CONSUMER_FULL_BODY="${CONSUMER_BODY}

          ---
          ### Upstream Dependency Gate
          - **Waiting-Package:** \`${PKG}\`
          - **Waiting-Repo:** \`${TARGET_REPO}\`"

            EXISTING_CONSUMER=$(echo "$OPEN_CONSUMER_ISSUES" | jq -r --arg t "$CONSUMER_TITLE" '.[]? | select((.title // "" | ascii_downcase) == ($t | ascii_downcase)) | .number' | head -n 1)
            OPEN_LIB_ISSUES=$(gh issue list --repo "$TARGET_REPO" --state open --limit 200 --json number,title,body 2>/dev/null || echo '[]')
            EXISTING_LIB=$(echo "$OPEN_LIB_ISSUES" | jq -r --arg t "$LIB_TITLE" '.[]? | select((.title // "" | ascii_downcase) == ($t | ascii_downcase)) | .number' | head -n 1)
            if [ -n "$EXISTING_CONSUMER" ] || [ -n "$EXISTING_LIB" ]; then
              if [ -n "$EXISTING_CONSUMER" ]; then
                NEEDS_CONSUMER_FIX=$(echo "$OPEN_CONSUMER_ISSUES" | jq -r --argjson num "$EXISTING_CONSUMER" '
                  (.[]? | select(.number == $num) | .body // "") as $b |
                  if ($b | length) > 0 and (($b | test("(?m)^#{1,3}\\s+(?:Problem|Context|Summary|Root Cause|Affected|Suggested|Proposed|Acceptance)\\b:?[ \\t]+\\S")) or (($b | split("\n---\n")[0] // "") | test("\\n") | not)) then "true" else "false" end
                ')
                if [ "$NEEDS_CONSUMER_FIX" = "true" ]; then
                  gh issue edit "$EXISTING_CONSUMER" --repo "$CURRENT_REPO" --body "$CONSUMER_FULL_BODY" >/dev/null 2>&1 || true
                fi
              fi
              if [ -n "$EXISTING_LIB" ] && [ -n "$EXISTING_CONSUMER" ]; then
                NEEDS_LIB_FIX=$(echo "$OPEN_LIB_ISSUES" | jq -r --argjson num "$EXISTING_LIB" '
                  (.[]? | select(.number == $num) | .body // "") as $b |
                  if ($b | length) > 0 and (($b | test("(?m)^#{1,3}\\s+(?:Problem|Context|Summary|Root Cause|Affected|Suggested|Proposed|Acceptance)\\b:?[ \\t]+\\S")) or (($b | split("\n---\n")[0] // "") | test("\\n") | not)) then "true" else "false" end
                ')
                if [ "$NEEDS_LIB_FIX" = "true" ]; then
                  gh issue edit "$EXISTING_LIB" --repo "$TARGET_REPO" --body "${LIB_BODY}

          ---
          ### Downstream Consumer Callback
          - **Downstream-Repo:** \`${CURRENT_REPO}\`
          - **Downstream-Issue:** #${EXISTING_CONSUMER}
          - **Upstream-Escalated:** 1" >/dev/null 2>&1 || true
                fi
              fi
              echo "Skipping duplicate upstream escalation (already open): ${LIB_TITLE}"
              continue
            fi

            # 1. Create the blocked tracking issue in the consumer repo (e.g. DoomR.js) and add to Project
            CONSUMER_ISSUE_URL=$(gh issue create --repo "$CURRENT_REPO" \
              --title "$CONSUMER_TITLE" \
              --label "blocked:upstream" \
              --label "upstream-escalated:1" \
              --label "$AUDIT_LABEL" \
              --body "$CONSUMER_FULL_BODY")
            CONSUMER_ISSUE_NUMBER="${CONSUMER_ISSUE_URL##*/}"
            OPEN_CONSUMER_ISSUES=$(echo "$OPEN_CONSUMER_ISSUES" | jq -c --argjson num "${CONSUMER_ISSUE_NUMBER:-0}" --arg title "$CONSUMER_TITLE" '. + [{"number": $num, "title": $title}]')
            add_to_project "$CURRENT_REPO" "$CONSUMER_ISSUE_NUMBER" "$PROJECT_TITLE" "$UPSTREAM_PRIORITY" "$UPSTREAM_MODEL" "$UPSTREAM_EFFORT"

            # 2. Create the upstream issue for triage on the upstream library Project board
            gh label create "upstream-escalated:1" --repo "$TARGET_REPO" --force --description "Triggered by downstream consumer audit" || true
            gh label create "$AUDIT_LABEL" --repo "$TARGET_REPO" --force --description "Finding reported by ${AGENT} audit" || true

            LIB_ISSUE_URL=$(gh issue create --repo "$TARGET_REPO" \
              --title "$LIB_TITLE" \
              --label "upstream-escalated:1" \
              --label "$AUDIT_LABEL" \
              --body "${LIB_BODY}

          ---
          ### Downstream Consumer Callback
          - **Downstream-Repo:** \`${CURRENT_REPO}\`
          - **Downstream-Issue:** #${CONSUMER_ISSUE_NUMBER}
          - **Upstream-Escalated:** 1")
            LIB_ISSUE_NUMBER="${LIB_ISSUE_URL##*/}"
            add_to_project "$TARGET_REPO" "$LIB_ISSUE_NUMBER" "" "$UPSTREAM_PRIORITY" "$UPSTREAM_MODEL" "$UPSTREAM_EFFORT"

            # 3. Record the exact upstream issue reference on the consumer issue
            gh issue comment "$CONSUMER_ISSUE_NUMBER" --repo "$CURRENT_REPO" \
              --body "Blocked waiting on upstream library issue ${TARGET_REPO}#${LIB_ISSUE_NUMBER} (${LIB_ISSUE_URL}) for package \`${PKG}\`. Once \`${TARGET_REPO}\` merges and publishes the new release to npm, this issue will automatically be labeled \`5-release\` and resume implementation."

            {
              echo ""
              echo "### Escalated Upstream Library Issue"
              echo "- **Library:** \`${PKG}\` (\`${TARGET_REPO}\`)"
              echo "- **Upstream Issue:** ${LIB_ISSUE_URL}"
              echo "- **Downstream Tracking Issue:** ${CONSUMER_ISSUE_URL} (labeled \`blocked:upstream\`)"
            } >> audit-report.md
          done

          rm -f upstream-requests.json

      - name: Dispatch companion game editor requests
        if: always() && steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          CURRENT_REPO: ${{ github.repository }}
          AGENT: ${{ inputs.agent }}
        run: |
          if [ ! -s editor-requests.json ]; then
            rm -f editor-requests.json
            exit 0
          fi

          COUNT=$(jq 'if type == "array" then length else 0 end' editor-requests.json 2>/dev/null || echo "0")
          if [ "$COUNT" -eq 0 ]; then
            rm -f editor-requests.json
            exit 0
          fi

          AUDIT_LABEL="audit:${AGENT}"
          MAX=$((COUNT > 5 ? 5 : COUNT))
          for ((i = 0; i < MAX; i++)); do
            EDITOR_NAME=$(jq -r "(.[$i].editor // empty) | ascii_downcase" editor-requests.json)
            TARGET_REPO=$(jq -r ".[$i].repo // empty" editor-requests.json)
            ED_TITLE=$(jq -r ".[$i].title // empty" editor-requests.json)
            ED_PRIORITY=$(jq -r --argjson idx "$i" '
              ((.[$idx].priority // .[$idx].severity // "") | tostring | ascii_downcase | gsub("^\\s+|\\s+$"; "")) as $p |
              if ($p == "urgent" or $p == "critical" or $p == "p0") then "Urgent"
              elif ($p == "high" or $p == "major" or $p == "p1") then "High"
              elif ($p == "low" or $p == "minor" or $p == "trivial" or $p == "p3") then "Low"
              else "Medium" end
            ' editor-requests.json)
            ED_MODEL=$(jq -r --argjson idx "$i" '
              ((.[$idx].model // "") | tostring | ascii_downcase | gsub("^\\s+|\\s+$"; "")) as $m |
              if ($m == "claude-opus-5.5" or $m == "opus") then "claude-opus-5.5"
              elif ($m == "claude-haiku-5.5" or $m == "haiku") then "claude-haiku-5.5"
              elif ($m == "gpt-6.1-sol") then "gpt-6.1-sol"
              elif ($m == "gpt-6.1-terra" or $m == "terra") then "gpt-6.1-terra"
              elif ($m == "gpt-6-luna" or $m == "luna") then "gpt-6-luna"
              elif ($m == "gpt-5.3-codex" or $m == "codex") then "gpt-5.3-codex"
              elif ($m == "gemini-4-argon" or $m == "argon") then "gemini-4-argon"
              elif ($m == "gemini-3.8-flash" or $m == "flash") then "gemini-3.8-flash"
              elif ($m == "auto") then "auto"
              else "claude-sonnet-5.5" end
            ' editor-requests.json)
            ED_EFFORT=$(jq -r --argjson idx "$i" '
              ((.[$idx].effort // .[$idx].reasoningEffort // .[$idx].reasoning_effort // "") | tostring | ascii_downcase | gsub("^\\s+|\\s+$"; "")) as $e |
              if ($e == "max" or $e == "xhigh") then "Max"
              elif ($e == "high") then "High"
              elif ($e == "low" or $e == "minimal" or $e == "none") then "Low"
              else "Medium" end
            ' editor-requests.json)
            ED_BODY=$(jq -r --argjson idx "$i" '
              def norm:
                gsub("\\r\\n"; "\n")
                | gsub("\\\\r\\\\n"; "\n")
                | gsub("\\\\n"; "\n")
                | gsub("(?<a>[^\\n])[ \\t]+(?<b>\\*\\*(?:Problem(?: Statement)?|Affected(?: [A-Za-z0-9_./-]+)* Files|Suggested (?:Fix|Direction|Remediation)|Proposed (?:API|Changes|Solution)|Acceptance Criteria):?\\*\\*:?)"; "\(.a)\n\n\(.b)")
                | gsub("(?m)^[ \\t]*\\*\\*(?<sec>Problem(?: Statement)?|Affected(?: [A-Za-z0-9_./-]+)* Files|Suggested (?:Fix|Direction|Remediation)|Proposed (?:API|Changes|Solution)|Acceptance Criteria):?\\*\\*:?[ \\t]*"; "## \(.sec)\n\n")
                | gsub("(?<a>[^\\n])\\s+(?<h>#{1,3}\\s+(?:Problem|Context|Summary|Root Cause|Affected|Suggested|Proposed|Acceptance|Verification)\\b)"; "\(.a)\n\n\(.h)")
                | gsub("(?<a>[^\\n])\\s+(?<h>#{2,3}\\s+)"; "\(.a)\n\n\(.h)")
                | gsub("(?m)^#{1,3}\\s+(?<sec>Problem(?: Statement)?|Context|Summary|Root Cause|Affected(?: [A-Za-z0-9_./-]+)* Files(?: \\([^)]*\\))?|Suggested (?:Fix|Direction|Remediation)|Proposed (?:API|Changes|Solution)|Acceptance Criteria|Verification)\\b:?[ \\t]*(?<rest>\\S[^\\n]*)"; "## \(.sec)\n\n\(.rest)")
                | gsub("(?m)^#\\s+(?<sec>Problem(?: Statement)?|Context|Summary|Root Cause|Affected(?: [A-Za-z0-9_./-]+)* Files(?: \\([^)]*\\))?|Suggested (?:Fix|Direction|Remediation)|Proposed (?:API|Changes|Solution)|Acceptance Criteria|Verification)\\b:?[ \\t]*$"; "## \(.sec)")
                | gsub("(?<a>[^\\n])[ \\t]+(?<b>- \\*\\*AC-[0-9]+:\\*\\*)"; "\(.a)\n\(.b)")
                | gsub("(?<a>[^\\n-])[ \\t]+(?<b>\\*\\*AC-[0-9]+:\\*\\*)"; "\(.a)\n- \(.b)")
                | gsub("(?<a>[^\\n])[ \\t]+(?<b>- `[^`]+`)"; "\(.a)\n\(.b)")
                | if (test("(?im)^#{2,3}\\s+Acceptance Criteria") | not) and test("(?m)^- \\*\\*AC-1:\\*\\*") then
                    sub("(?m)^(?<b>- \\*\\*AC-1:\\*\\*)"; "\n\n## Acceptance Criteria\n\n\(.b)")
                  else . end
                | if (test("\\n") | not) and test("^#{1,6}\\s+") then
                    "## Problem\n\n" + sub("^#{1,6}\\s+"; "")
                  else . end
                | gsub("(?m)^(?<h>#{2,3}\\s+[^\\n]+)\\n(?<c>[^\\n#])"; "\(.h)\n\n\(.c)")
                | gsub("(?<a>[^\\n])\\n(?<h>#{2,3}\\s+)"; "\(.a)\n\n\(.h)")
                | gsub("\\n{3,}"; "\n\n")
                | sub("^\\s+"; "")
                | sub("\\s+$"; "");
              .[$idx] |
              ((.body // "") | tostring | norm) as $raw |
              ((.problem // "") | tostring | norm) as $prob |
              ((.affectedFiles // .affected_files // []) | if type == "array" and length > 0 then (map(tostring | if test("^\\s*-\\s+") then . else "- `" + (gsub("^`|`$"; "")) + "`" end) | join("\n")) elif type == "string" then (. | norm) else "" end) as $files |
              ((.suggestedDirection // .suggested_direction // .suggestedFix // .suggested_fix // "") | tostring | norm) as $dir |
              if ($raw | test("(?m)^#{2,3}\\s+")) then
                $raw
              elif (($prob | length) > 0 or ($files | length) > 0 or ($dir | length) > 0) then
                ([
                  (if ($prob | length) > 0 then "## Problem\n\n" + $prob elif ($raw | length) > 0 then "## Problem\n\n" + $raw else empty end),
                  "## Affected DoomR.js Files\n\n" + (if ($files | length) > 0 then $files else "- (see upstream DoomR.js audit)" end),
                  (if ($dir | length) > 0 then "## Suggested Direction\n\n" + $dir else empty end)
                ] | join("\n\n") | norm)
              else
                $raw
              end
            ' editor-requests.json)

            if [ -z "$TARGET_REPO" ] && [ -n "$EDITOR_NAME" ]; then
              case "$EDITOR_NAME" in
                cadenza)   TARGET_REPO="1pizzateam/Cadenza" ;;
                facegun)   TARGET_REPO="1pizzateam/FaceGun" ;;
                mappr)     TARGET_REPO="1pizzateam/MappR" ;;
                pixelgun)  TARGET_REPO="1pizzateam/PixelGun" ;;
                polygun)   TARGET_REPO="1pizzateam/PolyGun" ;;
                shadergun) TARGET_REPO="1pizzateam/ShaderGun" ;;
              esac
            fi

            case "$TARGET_REPO" in
              1pizzateam/Cadenza|1pizzateam/FaceGun|1pizzateam/MappR|1pizzateam/PixelGun|1pizzateam/PolyGun|1pizzateam/ShaderGun) ;;
              *) continue ;;
            esac

            if [ -z "$ED_TITLE" ] || [ "$TARGET_REPO" = "$CURRENT_REPO" ]; then
              continue
            fi

            EXISTING_ED=$(gh issue list --repo "$TARGET_REPO" --state open --limit 200 --json number,title 2>/dev/null | jq -r --arg t "$ED_TITLE" '.[]? | select((.title // "" | ascii_downcase) == ($t | ascii_downcase)) | .number' | head -n 1)
            if [ -n "$EXISTING_ED" ]; then
              echo "Skipping duplicate companion editor request (already open in ${TARGET_REPO} as #${EXISTING_ED}): ${ED_TITLE}"
              continue
            fi

            gh label create "downstream:doomr" --repo "$TARGET_REPO" --force --description "Triggered by DoomR.js companion editor sync" || true
            gh label create "$AUDIT_LABEL" --repo "$TARGET_REPO" --force --description "Finding reported by ${AGENT} audit" || true

            ED_ISSUE_URL=$(gh issue create --repo "$TARGET_REPO" \
              --title "$ED_TITLE" \
              --label "downstream:doomr" \
              --label "$AUDIT_LABEL" \
              --body "${ED_BODY}

          ---
          ### Triggered by Companion Game Repository
          - **Source-Repo:** \`${CURRENT_REPO}\`")
            ED_ISSUE_NUMBER="${ED_ISSUE_URL##*/}"

            ED_OWNER="${TARGET_REPO%%/*}"
            ED_REPO="${TARGET_REPO#*/}"
            ED_DATA=$(gh api graphql -f query='
              query($owner: String!, $repo: String!, $number: Int!, $projectTitle: String!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    id
                    projectItems(first: 20) {
                      nodes {
                        id
                        project { id }
                      }
                    }
                  }
                  owner {
                    ... on Organization {
                      issueFields(first: 20) {
                        nodes {
                          ... on IssueFieldSingleSelect {
                            id
                            name
                            options { id name }
                          }
                        }
                      }
                      projectsV2(first: 20, query: $projectTitle) {
                        nodes {
                          id
                          title
                          field(name: "Status") {
                            ... on ProjectV2SingleSelectField {
                              id
                              options { id name }
                            }
                          }
                        }
                      }
                    }
                    ... on User {
                      projectsV2(first: 20, query: $projectTitle) {
                        nodes {
                          id
                          title
                          field(name: "Status") {
                            ... on ProjectV2SingleSelectField {
                              id
                              options { id name }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }' -f owner="$ED_OWNER" -f repo="$ED_REPO" -F number="$ED_ISSUE_NUMBER" -f projectTitle="$ED_REPO" 2>/dev/null || true)
            ED_DATA="${ED_DATA:-"{}"}"
            ED_ISSUE_ID=$(echo "$ED_DATA" | jq -r '.data.repository.issue.id // empty' | head -n 1)
            ED_PRIORITY_FIELD=$(echo "$ED_DATA" | jq -c '.data.repository.owner.issueFields.nodes[]? | select((.name // "" | ascii_downcase) == "priority")' | head -n 1)
            ED_PRIORITY_FIELD_ID=$(echo "$ED_PRIORITY_FIELD" | jq -r '.id // empty')
            ED_PRIORITY_OPTION_ID=$(echo "$ED_PRIORITY_FIELD" | jq -r --arg p "$ED_PRIORITY" '(.options[]? | select((.name | ascii_downcase) == ($p | ascii_downcase)) | .id), (.options[]? | select((.name | ascii_downcase) == "medium") | .id)' | head -n 1)
            if [ -z "$ED_PRIORITY_FIELD_ID" ] || [ -z "$ED_PRIORITY_OPTION_ID" ]; then
              ED_PRIORITY_FIELD_ID="IFSS_kgDOAoWpGg"
              case "$ED_PRIORITY" in
                Urgent) ED_PRIORITY_OPTION_ID="IFSSO_kgDOBGndlw" ;;
                High)   ED_PRIORITY_OPTION_ID="IFSSO_kgDOBGndmA" ;;
                Low)    ED_PRIORITY_OPTION_ID="IFSSO_kgDOBGndmg" ;;
                *)      ED_PRIORITY_OPTION_ID="IFSSO_kgDOBGndmQ" ;;
              esac
            fi
            if [ -n "$ED_ISSUE_ID" ] && [ -n "$ED_PRIORITY_FIELD_ID" ] && [ -n "$ED_PRIORITY_OPTION_ID" ]; then
              gh api graphql -f query='
                mutation($issueId: ID!, $fieldId: ID!, $optionId: ID!) {
                  setIssueFieldValue(input: {
                    issueId: $issueId,
                    issueFields: [{ fieldId: $fieldId, singleSelectOptionId: $optionId }]
                  }) { issue { id } }
                }' -f issueId="$ED_ISSUE_ID" -f fieldId="$ED_PRIORITY_FIELD_ID" -f optionId="$ED_PRIORITY_OPTION_ID" >/dev/null 2>&1 || true
            fi
            ED_MODEL_FIELD=$(echo "$ED_DATA" | jq -c '.data.repository.owner.issueFields.nodes[]? | select((.name // "" | ascii_downcase) == "model")' | head -n 1)
            ED_MODEL_FIELD_ID=$(echo "$ED_MODEL_FIELD" | jq -r '.id // empty')
            ED_MODEL_OPTION_ID=$(echo "$ED_MODEL_FIELD" | jq -r --arg m "$ED_MODEL" '(.options[]? | select((.name | ascii_downcase) == ($m | ascii_downcase)) | .id), (.options[]? | select((.name | ascii_downcase) == "claude-sonnet-5.5") | .id)' | head -n 1)
            if [ -z "$ED_MODEL_FIELD_ID" ] || [ -z "$ED_MODEL_OPTION_ID" ]; then
              ED_MODEL_FIELD_ID="IFSS_kgDOAvKZhw"
              case "$ED_MODEL" in
                claude-opus-5.5)  ED_MODEL_OPTION_ID="IFSSO_kgDOBSkjjA" ;;
                claude-haiku-5.5) ED_MODEL_OPTION_ID="IFSSO_kgDOBSkjjQ" ;;
                gpt-6.1-sol)      ED_MODEL_OPTION_ID="IFSSO_kgDOBSkjjg" ;;
                gpt-6.1-terra)    ED_MODEL_OPTION_ID="IFSSO_kgDOBSkjjw" ;;
                gpt-6-luna)       ED_MODEL_OPTION_ID="IFSSO_kgDOBSkjkA" ;;
                gpt-5.3-codex)    ED_MODEL_OPTION_ID="IFSSO_kgDOBSkjkQ" ;;
                gemini-4-argon)   ED_MODEL_OPTION_ID="IFSSO_kgDOBSkjkg" ;;
                gemini-3.8-flash) ED_MODEL_OPTION_ID="IFSSO_kgDOBSkjkw" ;;
                auto)             ED_MODEL_OPTION_ID="IFSSO_kgDOBSkjlQ" ;;
                *)                ED_MODEL_OPTION_ID="IFSSO_kgDOBSkjiw" ;;
              esac
            fi
            if [ -n "$ED_ISSUE_ID" ] && [ -n "$ED_MODEL_FIELD_ID" ] && [ -n "$ED_MODEL_OPTION_ID" ]; then
              gh api graphql -f query='
                mutation($issueId: ID!, $fieldId: ID!, $optionId: ID!) {
                  setIssueFieldValue(input: {
                    issueId: $issueId,
                    issueFields: [{ fieldId: $fieldId, singleSelectOptionId: $optionId }]
                  }) { issue { id } }
                }' -f issueId="$ED_ISSUE_ID" -f fieldId="$ED_MODEL_FIELD_ID" -f optionId="$ED_MODEL_OPTION_ID" >/dev/null 2>&1 || true
            fi
            ED_EFFORT_FIELD=$(echo "$ED_DATA" | jq -c '.data.repository.owner.issueFields.nodes[]? | select((.name // "" | ascii_downcase) == "effort")' | head -n 1)
            ED_EFFORT_FIELD_ID=$(echo "$ED_EFFORT_FIELD" | jq -r '.id // empty')
            ED_EFFORT_OPTION_ID=$(echo "$ED_EFFORT_FIELD" | jq -r --arg e "$ED_EFFORT" '(.options[]? | select((.name | ascii_downcase) == ($e | ascii_downcase)) | .id), (.options[]? | select((.name | ascii_downcase) == "medium") | .id)' | head -n 1)
            if [ -z "$ED_EFFORT_FIELD_ID" ] || [ -z "$ED_EFFORT_OPTION_ID" ]; then
              ED_EFFORT_FIELD_ID="IFSS_kgDOAvKWEg"
              case "$ED_EFFORT" in
                Max)  ED_EFFORT_OPTION_ID="IFSSO_kgDOBSkdRA" ;;
                High) ED_EFFORT_OPTION_ID="IFSSO_kgDOBSkdRQ" ;;
                Low)  ED_EFFORT_OPTION_ID="IFSSO_kgDOBSkdRw" ;;
                *)    ED_EFFORT_OPTION_ID="IFSSO_kgDOBSkdRg" ;;
              esac
            fi
            if [ -n "$ED_ISSUE_ID" ] && [ -n "$ED_EFFORT_FIELD_ID" ] && [ -n "$ED_EFFORT_OPTION_ID" ]; then
              gh api graphql -f query='
                mutation($issueId: ID!, $fieldId: ID!, $optionId: ID!) {
                  setIssueFieldValue(input: {
                    issueId: $issueId,
                    issueFields: [{ fieldId: $fieldId, singleSelectOptionId: $optionId }]
                  }) { issue { id } }
                }' -f issueId="$ED_ISSUE_ID" -f fieldId="$ED_EFFORT_FIELD_ID" -f optionId="$ED_EFFORT_OPTION_ID" >/dev/null 2>&1 || true
            fi
            ED_PROJECT=$(echo "$ED_DATA" | jq -c --arg title "$ED_REPO" --arg repo "$ED_REPO" '.data.repository.owner.projectsV2.nodes[]? | select((.title | ascii_downcase | sub("\\.js$"; "")) == ($title | ascii_downcase | sub("\\.js$"; "")) or (.title | ascii_downcase) == ($repo | ascii_downcase))' | head -n 1)
            ED_PROJECT_ID=$(echo "$ED_PROJECT" | jq -r '.id // empty')
            ED_FIELD_ID=$(echo "$ED_PROJECT" | jq -r '.field.id // empty')
            ED_OPTION_ID=$(echo "$ED_PROJECT" | jq -r '.field.options[]? | select((.name | ascii_downcase) == "triage") | .id' | head -n 1)
            if [ -n "$ED_ISSUE_ID" ] && [ -n "$ED_PROJECT_ID" ]; then
              ED_ITEM_ID=$(gh api graphql -f query='
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } }
                }' -f projectId="$ED_PROJECT_ID" -f contentId="$ED_ISSUE_ID" --jq '.data.addProjectV2ItemById.item.id' 2>/dev/null || true)
              if [ -z "$ED_ITEM_ID" ]; then
                ED_ITEM_ID=$(echo "$ED_DATA" | jq -r --arg pid "$ED_PROJECT_ID" '.data.repository.issue.projectItems.nodes[]? | select(.project.id == $pid) | .id' | head -n 1)
              fi
              if [ -n "$ED_ITEM_ID" ] && [ -n "$ED_FIELD_ID" ] && [ -n "$ED_OPTION_ID" ]; then
                gh api graphql -f query='
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                      value: { singleSelectOptionId: $optionId }
                    }) { projectV2Item { id } }
                  }' -f projectId="$ED_PROJECT_ID" -f itemId="$ED_ITEM_ID" -f fieldId="$ED_FIELD_ID" -f optionId="$ED_OPTION_ID" >/dev/null 2>&1 || true
              fi
            fi

            {
              echo ""
              echo "### Triggered Companion Game Editor Issue"
              echo "- **Editor Repository:** \`${TARGET_REPO}\`"
              echo "- **Issue:** ${ED_ISSUE_URL}"
            } >> audit-report.md
          done

          rm -f editor-requests.json

      - name: Restore repo primitives and publish summary
        if: always() && steps.preflight.outputs.skip != 'true'
        env:
          AGENT: ${{ inputs.agent }}
          SCOPE: ${{ inputs.scope }}
        run: |
          git clean -fd .github/instructions .github/agents .github/prompts .github/skills .agents .claude .cursor .gemini
          git checkout -- . 2>/dev/null || true
          if [ -f audit-report.md ]; then
            cat audit-report.md >> "$GITHUB_STEP_SUMMARY"
            rm -f audit-report.md
          else
            echo "Automated \`${AGENT}\` audit in \`${SCOPE}\`." >> "$GITHUB_STEP_SUMMARY"
          fi
