name: Audit - Runner

on:
  workflow_call:
    inputs:
      agent:
        description: 'Copilot agent name (e.g. dependency-leverage, vector-first, perf-audit, dead-code, test-gap, docs-sync)'
        required: true
        type: string
      scope:
        description: 'Target path to audit'
        required: false
        default: 'src/'
        type: string
      prompt:
        description: 'Extra instructions for the agent'
        required: false
        default: ''
        type: string
      pr_title:
        description: 'Commit and Pull Request title'
        required: true
        type: string
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    concurrency:
      group: copilot-audit-${{ inputs.agent }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject 1pizzateam/coding-pal primitives
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/1pizzateam/coding-pal.git /tmp/coding-pal
          rm -rf .github/instructions .github/agents .github/prompts .github/skills .github/copilot-instructions.md .agents .claude .cursor .gemini CLAUDE.md GEMINI.md AGENTS.md .cursorrules .windsurfrules
          mkdir -p .github/instructions .github/agents .agents/skills
          cp /tmp/coding-pal/instructions/*.md .github/instructions/
          cp /tmp/coding-pal/agents/*.md .github/agents/
          cp -R /tmp/coding-pal/skills/* .agents/skills/
          rm -rf /tmp/coding-pal

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clone sibling DoomR.js workspace for companion game editors
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          case "$REPO_NAME" in
            Cadenza|MappR|PixelGun|PolyGun|ShaderGun)
              if [ ! -d ../DoomR.js ]; then
                git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/1pizzateam/DoomR.js.git" ../DoomR.js
                npm --prefix ../DoomR.js ci
              fi
              ;;
          esac

      - run: npm ci
      - run: npm install -g @github/copilot

      - name: Run ${{ inputs.agent }} agent
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          AGENT: ${{ inputs.agent }}
          SCOPE: ${{ inputs.scope }}
          EXTRA_PROMPT: ${{ inputs.prompt }}
        run: |
          copilot --agent="$AGENT" --allow-all-tools \
            --prompt "Scope: ${SCOPE}. ${EXTRA_PROMPT} Write a brief Markdown summary of changes to audit-report.md. If an upstream @1pizzateam/* library (`@1pizzateam/roostr` -> `1pizzateam/RoostR.js`, `@1pizzateam/bumpr` -> `1pizzateam/BumpR.js`, `@1pizzateam/loopr` -> `1pizzateam/LoopR.js`, `@1pizzateam/spock` -> `1pizzateam/Spock.js`, `@1pizzateam/groovr` -> `1pizzateam/GroovR.js`) should be updated instead of (or prior to) changing this repository, write the structured request array to upstream-requests.json. If a change in DoomR.js requires a companion update in one of the 1PizzaTeam game editors (`cadenza` -> `1pizzateam/Cadenza`, `mappr` -> `1pizzateam/MappR`, `pixelgun` -> `1pizzateam/PixelGun`, `polygun` -> `1pizzateam/PolyGun`, `shadergun` -> `1pizzateam/ShaderGun`), write a JSON array to editor-requests.json with objects `{ \"editor\": \"<cadenza|mappr|pixelgun|polygun|shadergun>\", \"repo\": \"1pizzateam/<Editor>\", \"title\": \"<issue title>\", \"body\": \"<markdown body describing the editor update>\" }`."

      - name: Escalate upstream @1pizzateam/* library requests
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          CURRENT_REPO: ${{ github.repository }}
        run: |
          if [ ! -s upstream-requests.json ]; then
            rm -f upstream-requests.json
            exit 0
          fi

          COUNT=$(jq 'if type == "array" then length else 0 end' upstream-requests.json 2>/dev/null || echo "0")
          if [ "$COUNT" -eq 0 ]; then
            rm -f upstream-requests.json
            exit 0
          fi

          gh label create "blocked:upstream" --repo "$CURRENT_REPO" --force --description "Waiting on an upstream @1pizzateam library release" || true
          gh label create "upstream-escalated:1" --repo "$CURRENT_REPO" --force --description "Escalated once to an upstream @1pizzateam library" || true

          MAX=$((COUNT > 3 ? 3 : COUNT))
          for ((i = 0; i < MAX; i++)); do
            PKG=$(jq -r ".[$i].package // empty" upstream-requests.json)
            TARGET_REPO=$(jq -r ".[$i].repo // empty" upstream-requests.json)
            LIB_TITLE=$(jq -r ".[$i].library_issue_title // empty" upstream-requests.json)
            LIB_BODY=$(jq -r ".[$i].library_issue_body // empty" upstream-requests.json)
            CONSUMER_TITLE=$(jq -r ".[$i].consumer_issue_title // empty" upstream-requests.json)
            CONSUMER_BODY=$(jq -r ".[$i].consumer_issue_body // empty" upstream-requests.json)

            if [ -z "$PKG" ] || [ -z "$TARGET_REPO" ] || [ -z "$LIB_TITLE" ] || [ -z "$CONSUMER_TITLE" ]; then
              continue
            fi
            if [ "$TARGET_REPO" = "$CURRENT_REPO" ]; then
              continue
            fi

            # 1. Create the blocked tracking issue in the consumer repo (e.g. DoomR.js)
            CONSUMER_ISSUE_URL=$(gh issue create --repo "$CURRENT_REPO" \
              --title "$CONSUMER_TITLE" \
              --label "blocked:upstream" \
              --label "upstream-escalated:1" \
              --body "${CONSUMER_BODY}

          ---
          ### Upstream Dependency Gate
          - **Waiting-Package:** \`${PKG}\`
          - **Waiting-Repo:** \`${TARGET_REPO}\`")
            CONSUMER_ISSUE_NUMBER="${CONSUMER_ISSUE_URL##*/}"

            # 2. Create the issue in the upstream library repo and label it '4-release' to trigger its FIFO pipeline
            gh label create "4-release" --repo "$TARGET_REPO" --force --description "Run the autonomous Think -> Plan -> Code -> Prove pipeline" || true
            gh label create "upstream-escalated:1" --repo "$TARGET_REPO" --force --description "Triggered by downstream consumer audit" || true

            LIB_ISSUE_URL=$(gh issue create --repo "$TARGET_REPO" \
              --title "$LIB_TITLE" \
              --label "4-release" \
              --label "upstream-escalated:1" \
              --body "${LIB_BODY}

          ---
          ### Downstream Consumer Callback
          - **Downstream-Repo:** \`${CURRENT_REPO}\`
          - **Downstream-Issue:** #${CONSUMER_ISSUE_NUMBER}
          - **Upstream-Escalated:** 1")
            LIB_ISSUE_NUMBER="${LIB_ISSUE_URL##*/}"

            # 3. Record the exact upstream issue reference on the consumer issue
            gh issue comment "$CONSUMER_ISSUE_NUMBER" --repo "$CURRENT_REPO" \
              --body "Blocked waiting on upstream library issue ${TARGET_REPO}#${LIB_ISSUE_NUMBER} (${LIB_ISSUE_URL}) for package \`${PKG}\`. Once \`${TARGET_REPO}\` merges and publishes the new release to npm, this issue will automatically be labeled \`4-release\` and resume implementation."

            {
              echo ""
              echo "### Escalated Upstream Library Issue"
              echo "- **Library:** \`${PKG}\` (\`${TARGET_REPO}\`)"
              echo "- **Upstream Issue:** ${LIB_ISSUE_URL} (labeled \`4-release\`)"
              echo "- **Downstream Tracking Issue:** ${CONSUMER_ISSUE_URL} (labeled \`blocked:upstream\`)"
            } >> audit-report.md
          done

          rm -f upstream-requests.json

      - name: Dispatch companion game editor requests
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          CURRENT_REPO: ${{ github.repository }}
        run: |
          if [ ! -s editor-requests.json ]; then
            rm -f editor-requests.json
            exit 0
          fi

          COUNT=$(jq 'if type == "array" then length else 0 end' editor-requests.json 2>/dev/null || echo "0")
          if [ "$COUNT" -eq 0 ]; then
            rm -f editor-requests.json
            exit 0
          fi

          MAX=$((COUNT > 5 ? 5 : COUNT))
          for ((i = 0; i < MAX; i++)); do
            EDITOR_NAME=$(jq -r ".[$i].editor // empty" editor-requests.json)
            TARGET_REPO=$(jq -r ".[$i].repo // empty" editor-requests.json)
            ED_TITLE=$(jq -r ".[$i].title // empty" editor-requests.json)
            ED_BODY=$(jq -r ".[$i].body // .[$i].problem // empty" editor-requests.json)

            if [ -z "$TARGET_REPO" ] && [ -n "$EDITOR_NAME" ]; then
              case "$(echo "$EDITOR_NAME" | tr '[:upper:]' '[:lower:]')" in
                cadenza)   TARGET_REPO="1pizzateam/Cadenza" ;;
                mappr)     TARGET_REPO="1pizzateam/MappR" ;;
                pixelgun)  TARGET_REPO="1pizzateam/PixelGun" ;;
                polygun)   TARGET_REPO="1pizzateam/PolyGun" ;;
                shadergun) TARGET_REPO="1pizzateam/ShaderGun" ;;
              esac
            fi

            case "$TARGET_REPO" in
              1pizzateam/Cadenza|1pizzateam/MappR|1pizzateam/PixelGun|1pizzateam/PolyGun|1pizzateam/ShaderGun) ;;
              *) continue ;;
            esac

            if [ -z "$ED_TITLE" ] || [ "$TARGET_REPO" = "$CURRENT_REPO" ]; then
              continue
            fi

            gh label create "4-release" --repo "$TARGET_REPO" --force --description "Run the autonomous Think -> Plan -> Code -> Prove pipeline" || true
            gh label create "downstream:doomr" --repo "$TARGET_REPO" --force --description "Triggered by DoomR.js companion editor sync" || true

            ED_ISSUE_URL=$(gh issue create --repo "$TARGET_REPO" \
              --title "$ED_TITLE" \
              --label "4-release" \
              --label "downstream:doomr" \
              --body "${ED_BODY}

          ---
          ### Triggered by Companion Game Repository
          - **Source-Repo:** \`${CURRENT_REPO}\`")

            {
              echo ""
              echo "### Triggered Companion Game Editor Issue"
              echo "- **Editor Repository:** \`${TARGET_REPO}\`"
              echo "- **Issue:** ${ED_ISSUE_URL} (labeled \`4-release\`)"
            } >> audit-report.md
          done

          rm -f editor-requests.json

      - name: Restore repo primitives, publish summary & verify gate
        if: always()
        run: |
          git clean -fd .github/instructions .github/agents .github/prompts .github/skills .agents .claude .cursor .gemini
          git checkout -- .github/instructions .github/agents .github/prompts .github/skills .github/copilot-instructions.md .agents .claude .cursor .gemini CLAUDE.md GEMINI.md AGENTS.md .cursorrules .windsurfrules 2>/dev/null || true
          if [ -f audit-report.md ]; then
            cat audit-report.md >> "$GITHUB_STEP_SUMMARY"
            mv audit-report.md /tmp/report.md
          else
            echo "Automated \`${{ inputs.agent }}\` audit in \`${{ inputs.scope }}\`." > /tmp/report.md
          fi
          npm test --if-present
          npm run build --if-present

      - name: Open Pull Request if code changed
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT: ${{ inputs.agent }}
          PR_TITLE: ${{ inputs.pr_title }}
        run: |
          BASE="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          [ -z "$(git status --porcelain)" ] && [ -z "$(git log origin/${BASE}..HEAD --oneline 2>/dev/null)" ] && exit 0
          SLUG=$(echo "$AGENT" | tr '[:upper:] ' '[:lower:]-')
          BRANCH="copilot/${SLUG}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "$PR_TITLE"
          fi
          git push -u origin "$BRANCH"
          gh pr create \
            --title "$PR_TITLE" \
            --body-file /tmp/report.md \
            --head "$BRANCH" \
            --base "$BASE"
