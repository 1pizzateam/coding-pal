name: Audit - Runner

on:
  workflow_call:
    inputs:
      agent:
        description: 'Copilot agent name (e.g. dependency-leverage, vector-first, perf-audit, dead-code, test-gap, docs-sync)'
        required: true
        type: string
      scope:
        description: 'Target path to audit'
        required: false
        default: 'src/'
        type: string
      prompt:
        description: 'Extra instructions for the agent'
        required: false
        default: ''
        type: string
      project_title:
        description: 'GitHub Project V2 board title (defaults to repository name)'
        required: false
        default: ''
        type: string
    secrets:
      PIPELINE_GITHUB_TOKEN:
        required: true
      COPILOT_GITHUB_TOKEN:
        required: true

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    concurrency:
      group: copilot-audit-${{ inputs.agent }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_GITHUB_TOKEN }}

      - name: Check scheduled audit activity and backlog gate
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          CURRENT_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          AGENT: ${{ inputs.agent }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$REPO_PRIVATE" = "true" ]; then
            echo "::notice::Skipping scheduled ${AGENT} audit: ${CURRENT_REPO} is a private repository."
            echo "Skipped scheduled \`${AGENT}\` audit: private repository." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RECENT_COMMIT=$(git log -1 --since="7 days ago" --format="%H" 2>/dev/null || true)
          if [ -z "$RECENT_COMMIT" ]; then
            echo "::notice::Skipping scheduled ${AGENT} audit: no new commits in ${CURRENT_REPO} in the last 7 days."
            echo "Skipped scheduled \`${AGENT}\` audit: no new commits in the last 7 days." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AUDIT_LABEL="audit:${AGENT}"
          OPEN_AUDIT_COUNT=$(gh issue list --repo "$CURRENT_REPO" --state open --label "$AUDIT_LABEL" --limit 100 --json number 2>/dev/null | jq 'if type == "array" then length else 0 end' || echo "0")
          if [ "$OPEN_AUDIT_COUNT" -ge 10 ]; then
            echo "::notice::Skipping scheduled ${AGENT} audit: ${OPEN_AUDIT_COUNT} open ${AUDIT_LABEL} issues already awaiting triage."
            echo "Skipped scheduled \`${AGENT}\` audit: ${OPEN_AUDIT_COUNT} open \`${AUDIT_LABEL}\` issues already awaiting triage." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Inject 1pizzateam/coding-pal primitives
        if: steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/1pizzateam/coding-pal.git /tmp/coding-pal
          rm -rf .github/instructions .github/agents .github/prompts .github/skills .github/copilot-instructions.md .agents .claude .cursor .gemini CLAUDE.md GEMINI.md AGENTS.md .cursorrules .windsurfrules
          mkdir -p .github/instructions .github/agents .agents/skills
          cp /tmp/coding-pal/instructions/*.md .github/instructions/
          cp /tmp/coding-pal/agents/*.md .github/agents/
          cp -R /tmp/coding-pal/skills/* .agents/skills/
          rm -rf /tmp/coding-pal

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Clone sibling DoomR.js workspace for companion game editors
        if: steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          case "$REPO_NAME" in
            Cadenza|FaceGun|MappR|PixelGun|PolyGun|ShaderGun)
              if [ ! -d ../DoomR.js ]; then
                git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/1pizzateam/DoomR.js.git" ../DoomR.js
              fi
              if [ "$REPO_NAME" = "FaceGun" ] && [ ! -d ../FaceR.js ]; then
                git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/1pizzateam/FaceR.js.git" ../FaceR.js
              fi
              ;;
          esac

      - name: Install project dependencies for codebase investigation
        if: steps.preflight.outputs.skip != 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts 2>/dev/null || npm ci || true
          fi

      - name: Cache Copilot CLI
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.copilot-cli
          key: copilot-cli-${{ runner.os }}-node22

      - name: Install Copilot CLI
        if: steps.preflight.outputs.skip != 'true'
        run: |
          if [ ! -x "$HOME/.copilot-cli/bin/copilot" ]; then
            npm install --prefix "$HOME/.copilot-cli" -g @github/copilot
          fi
          echo "$HOME/.copilot-cli/bin" >> "$GITHUB_PATH"

      - name: Run ${{ inputs.agent }} agent
        if: steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          AGENT: ${{ inputs.agent }}
          SCOPE: ${{ inputs.scope }}
          EXTRA_PROMPT: ${{ inputs.prompt }}
        run: |
          copilot --model="gemini-3.8-flash" --agent="$AGENT" --allow-all-tools \
            --prompt "Scope: ${SCOPE}. ${EXTRA_PROMPT} Do not modify repository source, test, or documentation files. Write structured findings to audit-findings.json as a JSON array of objects, where each element has exact keys: { \"title\": \"<concise issue title>\", \"body\": \"<Markdown specification with ## Problem, ## Affected Files, ## Suggested Fix, and - **AC-1:** ... acceptance criteria>\" } (or [] if no findings exist), and write a brief Markdown summary of the audit to audit-report.md. If an upstream @1pizzateam/* library (`@1pizzateam/roostr` -> `1pizzateam/RoostR.js`, `@1pizzateam/bumpr` -> `1pizzateam/BumpR.js`, `@1pizzateam/loopr` -> `1pizzateam/LoopR.js`, `@1pizzateam/spock` -> `1pizzateam/Spock.js`, `@1pizzateam/groovr` -> `1pizzateam/GroovR.js`, `@1pizzateam/facer` -> `1pizzateam/FaceR.js`) should be updated instead of (or prior to) changing this repository, write the structured request array to upstream-requests.json. If a finding in DoomR.js requires a companion update in one of the 1PizzaTeam game editors (`cadenza` -> `1pizzateam/Cadenza`, `facegun` -> `1pizzateam/FaceGun`, `mappr` -> `1pizzateam/MappR`, `pixelgun` -> `1pizzateam/PixelGun`, `polygun` -> `1pizzateam/PolyGun`, `shadergun` -> `1pizzateam/ShaderGun`), write a JSON array to editor-requests.json with objects `{ \"editor\": \"<cadenza|facegun|mappr|pixelgun|polygun|shadergun>\", \"repo\": \"1pizzateam/<Editor>\", \"title\": \"<issue title>\", \"body\": \"<markdown body describing the editor update>\" }`."

      - name: Create issues for audit findings and add to Project
        id: create_findings
        if: always() && steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          CURRENT_REPO: ${{ github.repository }}
          AGENT: ${{ inputs.agent }}
          SCOPE: ${{ inputs.scope }}
          PROJECT_TITLE: ${{ inputs.project_title }}
        run: |
          if [ ! -s audit-findings.json ]; then
            rm -f audit-findings.json
            echo "created_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT=$(jq 'if type == "array" then length else 0 end' audit-findings.json 2>/dev/null || echo "0")
          if [ "$COUNT" -eq 0 ]; then
            rm -f audit-findings.json
            echo "created_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OWNER="${CURRENT_REPO%%/*}"
          REPO="${CURRENT_REPO#*/}"
          PROJECT_TITLE="${PROJECT_TITLE:-$REPO}"
          AUDIT_LABEL="audit:${AGENT}"

          gh label create "$AUDIT_LABEL" --repo "$CURRENT_REPO" --force --description "Finding reported by ${AGENT} audit" || true

          OPEN_ISSUES=$(gh issue list --repo "$CURRENT_REPO" --state open --limit 200 --json number,title 2>/dev/null || echo '[]')

          CREATED_COUNT=0
          for ((i = 0; i < COUNT; i++)); do
            TITLE=$(jq -r ".[$i].title // empty" audit-findings.json)
            BODY=$(jq -r ".[$i].body // empty" audit-findings.json)

            if [ -z "$TITLE" ] || [ -z "$BODY" ]; then
              continue
            fi

            EXISTING_NUM=$(echo "$OPEN_ISSUES" | jq -r --arg t "$TITLE" '.[]? | select((.title // "" | ascii_downcase) == ($t | ascii_downcase)) | .number' | head -n 1)
            if [ -n "$EXISTING_NUM" ]; then
              echo "Skipping duplicate finding (already open as #${EXISTING_NUM}): ${TITLE}"
              continue
            fi

            ISSUE_URL=$(gh issue create --repo "$CURRENT_REPO" \
              --title "$TITLE" \
              --label "$AUDIT_LABEL" \
              --body "${BODY}

          ---
          _Reported by \`${AGENT}\` audit in \`${SCOPE}\`._")
            ISSUE_NUMBER="${ISSUE_URL##*/}"
            CREATED_COUNT=$((CREATED_COUNT + 1))

            OPEN_ISSUES=$(echo "$OPEN_ISSUES" | jq -c --argjson num "${ISSUE_NUMBER:-0}" --arg title "$TITLE" '. + [{"number": $num, "title": $title}]')

            DATA=$(gh api graphql -f query='
              query($owner: String!, $repo: String!, $number: Int!, $projectTitle: String!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) { id }
                  owner {
                    ... on Organization {
                      projectsV2(first: 20, query: $projectTitle) {
                        nodes { id title }
                      }
                    }
                    ... on User {
                      projectsV2(first: 20, query: $projectTitle) {
                        nodes { id title }
                      }
                    }
                  }
                }
              }' -f owner="$OWNER" -f repo="$REPO" -F number="$ISSUE_NUMBER" -f projectTitle="$PROJECT_TITLE")

            ISSUE_ID=$(echo "$DATA" | jq -r '.data.repository.issue.id // empty')
            PROJECT=$(echo "$DATA" | jq -c --arg title "$PROJECT_TITLE" --arg repo "$REPO" '.data.repository.owner.projectsV2.nodes[]? | select((.title | ascii_downcase | sub("\\.js$"; "")) == ($title | ascii_downcase | sub("\\.js$"; "")) or (.title | ascii_downcase) == ($repo | ascii_downcase))' | head -n 1)
            PROJECT_ID=$(echo "$PROJECT" | jq -r '.id // empty')

            if [ -n "$ISSUE_ID" ] && [ -n "$PROJECT_ID" ]; then
              gh api graphql -f query='
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } }
                }' -f projectId="$PROJECT_ID" -f contentId="$ISSUE_ID" >/dev/null
            fi

            {
              if [ "$CREATED_COUNT" -eq 1 ]; then
                echo ""
                echo "### Created Audit Finding Issues"
              fi
              echo "- ${ISSUE_URL}: ${TITLE}"
            } >> audit-report.md
          done

          echo "created_count=${CREATED_COUNT}" >> "$GITHUB_OUTPUT"
          rm -f audit-findings.json

      - name: Escalate upstream @1pizzateam/* library requests
        if: always() && steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          CURRENT_REPO: ${{ github.repository }}
          AGENT: ${{ inputs.agent }}
          PROJECT_TITLE: ${{ inputs.project_title }}
        run: |
          if [ ! -s upstream-requests.json ]; then
            rm -f upstream-requests.json
            exit 0
          fi

          COUNT=$(jq 'if type == "array" then length else 0 end' upstream-requests.json 2>/dev/null || echo "0")
          if [ "$COUNT" -eq 0 ]; then
            rm -f upstream-requests.json
            exit 0
          fi

          AUDIT_LABEL="audit:${AGENT}"
          gh label create "blocked:upstream" --repo "$CURRENT_REPO" --force --description "Waiting on an upstream @1pizzateam library release" || true
          gh label create "upstream-escalated:1" --repo "$CURRENT_REPO" --force --description "Escalated once to an upstream @1pizzateam library" || true
          gh label create "$AUDIT_LABEL" --repo "$CURRENT_REPO" --force --description "Finding reported by ${AGENT} audit" || true

          add_to_project() {
            local target_full="$1"
            local issue_num="$2"
            local custom_title="${3:-}"
            local owner="${target_full%%/*}"
            local repo="${target_full#*/}"
            local ptitle="${custom_title:-$repo}"
            local data
            data=$(gh api graphql -f query='
              query($owner: String!, $repo: String!, $number: Int!, $projectTitle: String!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) { id }
                  owner {
                    ... on Organization {
                      projectsV2(first: 20, query: $projectTitle) {
                        nodes { id title }
                      }
                    }
                    ... on User {
                      projectsV2(first: 20, query: $projectTitle) {
                        nodes { id title }
                      }
                    }
                  }
                }
              }' -f owner="$owner" -f repo="$repo" -F number="$issue_num" -f projectTitle="$ptitle")
            local issue_id project_id
            issue_id=$(echo "$data" | jq -r '.data.repository.issue.id // empty')
            project_id=$(echo "$data" | jq -c --arg title "$ptitle" --arg repo "$repo" '.data.repository.owner.projectsV2.nodes[]? | select((.title | ascii_downcase | sub("\\.js$"; "")) == ($title | ascii_downcase | sub("\\.js$"; "")) or (.title | ascii_downcase) == ($repo | ascii_downcase))' | head -n 1 | jq -r '.id // empty')
            if [ -n "$issue_id" ] && [ -n "$project_id" ]; then
              gh api graphql -f query='
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } }
                }' -f projectId="$project_id" -f contentId="$issue_id" >/dev/null
            fi
          }

          MAX=$((COUNT > 3 ? 3 : COUNT))
          for ((i = 0; i < MAX; i++)); do
            PKG=$(jq -r ".[$i].package // empty" upstream-requests.json)
            TARGET_REPO=$(jq -r ".[$i].repo // empty" upstream-requests.json)
            LIB_TITLE=$(jq -r ".[$i].library_issue_title // empty" upstream-requests.json)
            LIB_BODY=$(jq -r ".[$i].library_issue_body // empty" upstream-requests.json)
            CONSUMER_TITLE=$(jq -r ".[$i].consumer_issue_title // empty" upstream-requests.json)
            CONSUMER_BODY=$(jq -r ".[$i].consumer_issue_body // empty" upstream-requests.json)

            if [ -z "$PKG" ] || [ -z "$TARGET_REPO" ] || [ -z "$LIB_TITLE" ] || [ -z "$CONSUMER_TITLE" ]; then
              continue
            fi
            if [ "$TARGET_REPO" = "$CURRENT_REPO" ]; then
              continue
            fi

            # 1. Create the blocked tracking issue in the consumer repo (e.g. DoomR.js) and add to Project
            CONSUMER_ISSUE_URL=$(gh issue create --repo "$CURRENT_REPO" \
              --title "$CONSUMER_TITLE" \
              --label "blocked:upstream" \
              --label "upstream-escalated:1" \
              --label "$AUDIT_LABEL" \
              --body "${CONSUMER_BODY}

          ---
          ### Upstream Dependency Gate
          - **Waiting-Package:** \`${PKG}\`
          - **Waiting-Repo:** \`${TARGET_REPO}\`")
            CONSUMER_ISSUE_NUMBER="${CONSUMER_ISSUE_URL##*/}"
            add_to_project "$CURRENT_REPO" "$CONSUMER_ISSUE_NUMBER" "$PROJECT_TITLE"

            # 2. Create the upstream issue for triage on the upstream library Project board
            gh label create "upstream-escalated:1" --repo "$TARGET_REPO" --force --description "Triggered by downstream consumer audit" || true
            gh label create "$AUDIT_LABEL" --repo "$TARGET_REPO" --force --description "Finding reported by ${AGENT} audit" || true

            LIB_ISSUE_URL=$(gh issue create --repo "$TARGET_REPO" \
              --title "$LIB_TITLE" \
              --label "upstream-escalated:1" \
              --label "$AUDIT_LABEL" \
              --body "${LIB_BODY}

          ---
          ### Downstream Consumer Callback
          - **Downstream-Repo:** \`${CURRENT_REPO}\`
          - **Downstream-Issue:** #${CONSUMER_ISSUE_NUMBER}
          - **Upstream-Escalated:** 1")
            LIB_ISSUE_NUMBER="${LIB_ISSUE_URL##*/}"
            add_to_project "$TARGET_REPO" "$LIB_ISSUE_NUMBER"

            # 3. Record the exact upstream issue reference on the consumer issue
            gh issue comment "$CONSUMER_ISSUE_NUMBER" --repo "$CURRENT_REPO" \
              --body "Blocked waiting on upstream library issue ${TARGET_REPO}#${LIB_ISSUE_NUMBER} (${LIB_ISSUE_URL}) for package \`${PKG}\`. Once \`${TARGET_REPO}\` merges and publishes the new release to npm, this issue will automatically be labeled \`5-release\` and resume implementation."

            {
              echo ""
              echo "### Escalated Upstream Library Issue"
              echo "- **Library:** \`${PKG}\` (\`${TARGET_REPO}\`)"
              echo "- **Upstream Issue:** ${LIB_ISSUE_URL}"
              echo "- **Downstream Tracking Issue:** ${CONSUMER_ISSUE_URL} (labeled \`blocked:upstream\`)"
            } >> audit-report.md
          done

          rm -f upstream-requests.json

      - name: Dispatch companion game editor requests
        if: always() && steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          CURRENT_REPO: ${{ github.repository }}
          AGENT: ${{ inputs.agent }}
        run: |
          if [ ! -s editor-requests.json ]; then
            rm -f editor-requests.json
            exit 0
          fi

          COUNT=$(jq 'if type == "array" then length else 0 end' editor-requests.json 2>/dev/null || echo "0")
          if [ "$COUNT" -eq 0 ]; then
            rm -f editor-requests.json
            exit 0
          fi

          AUDIT_LABEL="audit:${AGENT}"
          MAX=$((COUNT > 5 ? 5 : COUNT))
          for ((i = 0; i < MAX; i++)); do
            EDITOR_NAME=$(jq -r "(.[$i].editor // empty) | ascii_downcase" editor-requests.json)
            TARGET_REPO=$(jq -r ".[$i].repo // empty" editor-requests.json)
            ED_TITLE=$(jq -r ".[$i].title // empty" editor-requests.json)
            ED_BODY=$(jq -r ".[$i].body // empty" editor-requests.json)
            ED_PROBLEM=$(jq -r ".[$i].problem // empty" editor-requests.json)
            ED_DIRECTION=$(jq -r ".[$i].suggestedDirection // empty" editor-requests.json)
            ED_FILES=$(jq -r "(.[$i].affectedFiles // []) | map(\"- \`\" + . + \"\`\") | join(\"\\n\")" editor-requests.json)

            if [ -z "$TARGET_REPO" ] && [ -n "$EDITOR_NAME" ]; then
              case "$EDITOR_NAME" in
                cadenza)   TARGET_REPO="1pizzateam/Cadenza" ;;
                facegun)   TARGET_REPO="1pizzateam/FaceGun" ;;
                mappr)     TARGET_REPO="1pizzateam/MappR" ;;
                pixelgun)  TARGET_REPO="1pizzateam/PixelGun" ;;
                polygun)   TARGET_REPO="1pizzateam/PolyGun" ;;
                shadergun) TARGET_REPO="1pizzateam/ShaderGun" ;;
              esac
            fi

            if [ -z "$ED_BODY" ] && [ -n "$ED_PROBLEM" ]; then
              ED_BODY="## Problem
          ${ED_PROBLEM}

          ## Affected DoomR.js Files
          ${ED_FILES:-"- (see upstream DoomR.js audit)"}

          ## Suggested Direction
          ${ED_DIRECTION}"
            fi

            case "$TARGET_REPO" in
              1pizzateam/Cadenza|1pizzateam/FaceGun|1pizzateam/MappR|1pizzateam/PixelGun|1pizzateam/PolyGun|1pizzateam/ShaderGun) ;;
              *) continue ;;
            esac

            if [ -z "$ED_TITLE" ] || [ "$TARGET_REPO" = "$CURRENT_REPO" ]; then
              continue
            fi

            gh label create "downstream:doomr" --repo "$TARGET_REPO" --force --description "Triggered by DoomR.js companion editor sync" || true
            gh label create "$AUDIT_LABEL" --repo "$TARGET_REPO" --force --description "Finding reported by ${AGENT} audit" || true

            ED_ISSUE_URL=$(gh issue create --repo "$TARGET_REPO" \
              --title "$ED_TITLE" \
              --label "downstream:doomr" \
              --label "$AUDIT_LABEL" \
              --body "${ED_BODY}

          ---
          ### Triggered by Companion Game Repository
          - **Source-Repo:** \`${CURRENT_REPO}\`")
            ED_ISSUE_NUMBER="${ED_ISSUE_URL##*/}"

            ED_OWNER="${TARGET_REPO%%/*}"
            ED_REPO="${TARGET_REPO#*/}"
            ED_DATA=$(gh api graphql -f query='
              query($owner: String!, $repo: String!, $number: Int!, $projectTitle: String!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) { id }
                  owner {
                    ... on Organization {
                      projectsV2(first: 20, query: $projectTitle) {
                        nodes { id title }
                      }
                    }
                    ... on User {
                      projectsV2(first: 20, query: $projectTitle) {
                        nodes { id title }
                      }
                    }
                  }
                }
              }' -f owner="$ED_OWNER" -f repo="$ED_REPO" -F number="$ED_ISSUE_NUMBER" -f projectTitle="$ED_REPO")
            ED_ISSUE_ID=$(echo "$ED_DATA" | jq -r '.data.repository.issue.id // empty')
            ED_PROJECT_ID=$(echo "$ED_DATA" | jq -c --arg title "$ED_REPO" --arg repo "$ED_REPO" '.data.repository.owner.projectsV2.nodes[]? | select((.title | ascii_downcase | sub("\\.js$"; "")) == ($title | ascii_downcase | sub("\\.js$"; "")) or (.title | ascii_downcase) == ($repo | ascii_downcase))' | head -n 1 | jq -r '.id // empty')
            if [ -n "$ED_ISSUE_ID" ] && [ -n "$ED_PROJECT_ID" ]; then
              gh api graphql -f query='
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } }
                }' -f projectId="$ED_PROJECT_ID" -f contentId="$ED_ISSUE_ID" >/dev/null
            fi

            {
              echo ""
              echo "### Triggered Companion Game Editor Issue"
              echo "- **Editor Repository:** \`${TARGET_REPO}\`"
              echo "- **Issue:** ${ED_ISSUE_URL}"
            } >> audit-report.md
          done

          rm -f editor-requests.json

      - name: Restore repo primitives and publish summary
        if: always() && steps.preflight.outputs.skip != 'true'
        env:
          AGENT: ${{ inputs.agent }}
          SCOPE: ${{ inputs.scope }}
        run: |
          git clean -fd .github/instructions .github/agents .github/prompts .github/skills .agents .claude .cursor .gemini
          git checkout -- . 2>/dev/null || true
          if [ -f audit-report.md ]; then
            cat audit-report.md >> "$GITHUB_STEP_SUMMARY"
            rm -f audit-report.md
          else
            echo "Automated \`${AGENT}\` audit in \`${SCOPE}\`." >> "$GITHUB_STEP_SUMMARY"
          fi
