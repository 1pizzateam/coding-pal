name: Copilot Audit Runner

on:
  workflow_call:
    inputs:
      agent:
        description: 'Copilot agent name (e.g. dependency-leverage, vector-first, perf-audit, dead-code, test-gap, docs-sync)'
        required: true
        type: string
      scope:
        description: 'Target path to audit'
        required: false
        default: 'src/'
        type: string
      prompt:
        description: 'Extra instructions for the agent'
        required: false
        default: ''
        type: string
      pr_title:
        description: 'Commit and Pull Request title'
        required: true
        type: string
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    concurrency:
      group: copilot-audit-${{ inputs.agent }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject 1pizzateam/coding-pal primitives
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/1pizzateam/coding-pal.git /tmp/coding-pal
          rm -rf .github/instructions .github/agents .github/prompts .github/skills .github/copilot-instructions.md .agents .claude .cursor .gemini CLAUDE.md GEMINI.md AGENTS.md .cursorrules .windsurfrules
          mkdir -p .github/instructions .github/agents
          cp /tmp/coding-pal/instructions/*.md .github/instructions/
          cp /tmp/coding-pal/agents/*.md .github/agents/
          rm -rf /tmp/coding-pal

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm install -g @github/copilot

      - name: Run ${{ inputs.agent }} agent
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          AGENT: ${{ inputs.agent }}
          SCOPE: ${{ inputs.scope }}
          EXTRA_PROMPT: ${{ inputs.prompt }}
        run: |
          copilot --agent="$AGENT" --allow-all-tools \
            --prompt "Scope: ${SCOPE}. ${EXTRA_PROMPT} Write a brief Markdown summary of changes to audit-report.md."

      - name: Restore repo primitives, publish summary & verify gate
        if: always()
        run: |
          git clean -fd .github/instructions .github/agents .github/prompts .github/skills .agents .claude .cursor .gemini
          git checkout -- .github/instructions .github/agents .github/prompts .github/skills .github/copilot-instructions.md .agents .claude .cursor .gemini CLAUDE.md GEMINI.md AGENTS.md .cursorrules .windsurfrules 2>/dev/null || true
          if [ -f audit-report.md ]; then
            cat audit-report.md >> "$GITHUB_STEP_SUMMARY"
            mv audit-report.md /tmp/report.md
          else
            echo "Automated \`${{ inputs.agent }}\` audit in \`${{ inputs.scope }}\`." > /tmp/report.md
          fi
          npm test --if-present
          npm run build --if-present

      - name: Open Pull Request if code changed
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT: ${{ inputs.agent }}
          PR_TITLE: ${{ inputs.pr_title }}
        run: |
          BASE="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          [ -z "$(git status --porcelain)" ] && [ -z "$(git log origin/${BASE}..HEAD --oneline 2>/dev/null)" ] && exit 0
          SLUG=$(echo "$AGENT" | tr '[:upper:] ' '[:lower:]-')
          BRANCH="copilot/${SLUG}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "$PR_TITLE"
          fi
          git push -u origin "$BRANCH"
          gh pr create \
            --title "$PR_TITLE" \
            --body-file /tmp/report.md \
            --head "$BRANCH" \
            --base "$BASE"
