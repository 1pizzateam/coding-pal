name: Pipeline - Plan (reusable)

on:
  workflow_call:
    inputs:
      issue_number:
        description: 'Optional issue number when triggered via workflow_dispatch'
        required: false
        default: ''
        type: string
      workflow_run_id:
        description: 'Upstream Think run ID containing the think-spec artifact'
        required: false
        default: ''
        type: string
      project_title:
        description: 'Optional GitHub Project V2 board title'
        required: false
        default: ''
        type: string
    secrets:
      PIPELINE_GITHUB_TOKEN:
        required: true
      COPILOT_GITHUB_TOKEN:
        required: true

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    concurrency:
      group: copilot-plan-${{ github.repository }}-${{ inputs.issue_number || inputs.workflow_run_id || github.run_id }}
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Resolve issue number and restore think.md
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.workflow_run_id }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          rm -rf /tmp/specs
          mkdir -p /tmp/specs

          if [ -n "$RUN_ID" ] && [ -z "$INPUT_ISSUE_NUMBER" ]; then
            if ! gh run download "$RUN_ID" -n think-spec -D /tmp/specs 2>/dev/null; then
              echo "Triggering Think workflow run (#${RUN_ID}) was queued, paused, or resumed to Code (no think-spec artifact); skipping Plan."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            ISSUE_NUMBER=$(tr -d '[:space:]' < /tmp/specs/issue_number.txt)
          else
            ISSUE_NUMBER="$INPUT_ISSUE_NUMBER"
            echo "$ISSUE_NUMBER" > /tmp/specs/issue_number.txt
          fi

          if [ -z "$ISSUE_NUMBER" ] || [ "$ISSUE_NUMBER" = "0" ]; then
            echo "::error::Could not determine ISSUE_NUMBER."
            exit 1
          fi

          gh issue edit "$ISSUE_NUMBER" --remove-assignee "@me" 2>/dev/null || true

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "ISSUE_NUMBER=${ISSUE_NUMBER}" >> "$GITHUB_ENV"
          SPEC_DIR="/tmp/specs/issue-${ISSUE_NUMBER}"
          THINK_FILE="${SPEC_DIR}/think.md"
          mkdir -p "$SPEC_DIR"

          if [ ! -s "$THINK_FILE" ]; then
            echo "Fetching latest think.md from issue #${ISSUE_NUMBER} comments..."
            ISSUE_VIEW=$(gh issue view "$ISSUE_NUMBER" --json title,body,labels,comments)
            echo "$ISSUE_VIEW" | jq -r '[.comments[].body | select(test("^# Think:"; "m"))] | last // empty | sub("\\n*(?:---\\n+)?<!-- ai-cost-step:[^\\n]*-->[\\s\\S]*$"; "")' > "$THINK_FILE"
            if [ ! -s "$THINK_FILE" ]; then
              HAS_AUDIT_LABEL=$(echo "$ISSUE_VIEW" | jq -r '[.labels[].name] | any(startswith("audit:"))')
              if [ "$HAS_AUDIT_LABEL" = "true" ]; then
                echo "Audit finding issue #${ISSUE_NUMBER} detected; synthesizing think.md directly to skip Pipeline - Think."
                TODAY=$(date -u +%Y-%m-%d 2>/dev/null || echo "2026-01-01")
                echo "$ISSUE_VIEW" | jq -r --arg issue_number "$ISSUE_NUMBER" --arg today "$TODAY" '
                  ((.title // "") | gsub("[\\r\\n]+"; " ") | sub("^\\s+"; "") | sub("\\s+$"; "") | if length > 0 then . else "Audit Finding Remediation" end) as $title |
                  ([.labels[]?.name // empty | select(startswith("audit:"))] | first // "audit:finding") as $audit_label |
                  ((.body // "")
                    | gsub("```[\\s\\S]*?```"; " ")
                    | gsub("~~~[\\s\\S]*?~~~"; " ")
                    | sub("\\n*---\\n+_Reported by[\\s\\S]*$"; "")
                    | gsub("(?m)^\\s*#+\\s*"; "")
                    | gsub("(?m)^\\s*[-*+]\\s*(\\[[ xX]\\]\\s*)?"; "")
                    | gsub("[`*_~]+"; "")
                    | gsub("[\\r\\n\\t ]+"; " ")
                    | sub("^\\s+"; "")
                    | sub("\\s+$"; "")
                    | if length > 400 then .[0:400] + "..." elif length > 0 then . else $title end
                  ) as $summary |
                  ([(.body // "") | scan("`([A-Za-z0-9_][A-Za-z0-9_./-]*\\.[A-Za-z0-9]+)`") | .[0] | select((startswith("/") or test("(^|/)\\.\\.(/|$)")) | not)] | unique | if length > 0 then (map("`" + . + "`") | join(", ")) else "Repository source and test modules identified in issue #" + $issue_number end) as $affected |
                  "# Think: " + $title + "\n\n" +
                  "## Business Need & Outcome\n" +
                  "- **Backlog Issue:** #" + $issue_number + " — " + $title + " (" + $audit_label + ")\n" +
                  "- **Problem Statement:** " + $summary + "\n" +
                  "- **Consumer:** Repository maintainers and downstream consumers relying on verified codebase quality.\n" +
                  "- **Desired Outcome:** Resolve the reported " + $audit_label + " finding in #" + $issue_number + " with deterministic automated verification and zero regressions.\n\n" +
                  "## Options Considered\n" +
                  "### Option 1: Targeted In-Place Remediation\n" +
                  "- **Approach:** Address the audit finding directly within the affected files (" + $affected + ") while preserving existing public contracts and runtime behavior.\n" +
                  "- **Source:** Custom build\n" +
                  "- **Trade-offs:** Keeps scope strictly bounded to the reported finding without broader architectural churn.\n" +
                  "- **Cost:** Low\n" +
                  "- **Risk:** Low\n\n" +
                  "### Option 2: Broad Subsystem Refactor\n" +
                  "- **Approach:** Re-architect surrounding modules beyond the immediate audit finding scope.\n" +
                  "- **Source:** Custom build\n" +
                  "- **Trade-offs:** Expands blast radius and review surface area unnecessarily for a targeted audit remediation.\n" +
                  "- **Cost:** Medium\n" +
                  "- **Risk:** Medium\n\n" +
                  "## Chosen Approach\n" +
                  "- **Selected:** Option 1\n" +
                  "- **Reasoning:** Automated audit findings already pinpoint the exact file scope, root cause, and remediation direction, making a targeted in-place fix the lowest-risk path.\n" +
                  "- **Approved By:** Automated by coding-pal-audit on " + $today + "\n" +
                  "- **Custom Build Reason:** Remediation applies directly to repository-specific source and test files identified by the audit.\n\n" +
                  "## Forge Asset Bindings\n" +
                  "- **None:** Repository-internal audit remediation does not require external Forge asset composition.\n\n" +
                  "## System Flow & Responsibilities\n" +
                  "- **Request Tracing:** Execution flows through the affected module(s) (" + $affected + ") and their corresponding unit tests.\n" +
                  "- **Component Responsibilities:** Target files identified in issue #" + $issue_number + " own the localized remediation and regression test coverage.\n" +
                  "- **Boundaries:** Changes remain strictly within the files and module boundaries implicated by the audit finding.\n\n" +
                  "## Constraints & Invariants\n" +
                  "- **Decision Records:** _None._\n" +
                  "- **Non-Negotiable Rules:** Preserve existing public APIs, build outputs, and unrelated runtime behavior while resolving the audit finding.\n" +
                  "- **Side-Effect Constraints:** No unintended state mutations, external network calls, or out-of-scope file modifications.\n\n" +
                  "## Blast Radius\n" +
                  "- **Tier:** Low\n" +
                  "- **Affected:** " + $affected + "\n" +
                  "- **Rationale:** Scoped remediation of a single automated audit finding within existing module boundaries.\n" +
                  "- **Rollback:** Revert the pull request commit if any regression is detected.\n\n" +
                  "## Decision Record\n" +
                  "- **Required:** no\n" +
                  "- **Reason:** Low-blast-radius audit remediation within existing architectural boundaries does not require an ADR.\n\n" +
                  "## Persistent Context Updates\n" +
                  "_None._\n\n" +
                  "## Ambiguities & Open Questions\n" +
                  "_None._"
                ' > "$THINK_FILE"
              elif [ -z "$RUN_ID" ]; then
                HAS_STAGE_LABEL=$(echo "$ISSUE_VIEW" | jq -r '[.labels[].name] | any(. == "2-plan" or . == "3-code" or . == "4-prove" or . == "5-release")')
                if [ "$HAS_STAGE_LABEL" = "true" ]; then
                  echo "No think.md found on issue #${ISSUE_NUMBER}; dispatching Pipeline - Think first."
                  gh workflow run think.yml -f issue_number="$ISSUE_NUMBER"
                  echo "skip=true" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
            fi
          fi

          if [ ! -s "$THINK_FILE" ]; then
            echo "::error::No think.md found in artifact or comments for issue #${ISSUE_NUMBER}. Run 'Pipeline - Think' first."
            exit 1
          fi

      - name: Sync issue to Plan on Project board
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PROJECT_TITLE: ${{ inputs.project_title }}
          TARGET_STATUS: Plan
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
        run: |
          if [ -z "$PROJECT_TITLE" ]; then
            echo "::notice::No project_title configured; skipping Project status update."
            exit 0
          fi

          DATA=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $number: Int!, $projectTitle: String!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $number) { id }
                owner {
                  ... on ProjectV2Owner {
                    projectsV2(first: 20, query: $projectTitle) {
                      nodes {
                        id
                        title
                        field(name: "Status") {
                          ... on ProjectV2SingleSelectField {
                            id
                            options { id name }
                          }
                        }
                        fields(first: 50) {
                          nodes {
                            ... on ProjectV2Field {
                              id
                              name
                              dataType
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" -F number="$ISSUE_NUMBER" -f projectTitle="$PROJECT_TITLE")

          ISSUE_ID=$(echo "$DATA" | jq -r '.data.repository.issue.id // empty')
          PROJECT=$(echo "$DATA" | jq -c --arg title "$PROJECT_TITLE" --arg repo "$REPO" '.data.repository.owner.projectsV2.nodes[]? | select((.title | ascii_downcase | sub("\\.js$"; "")) == ($title | ascii_downcase | sub("\\.js$"; "")) or (.title | ascii_downcase) == ($repo | ascii_downcase))' | head -n 1)
          PROJECT_ID=$(echo "$PROJECT" | jq -r '.id // empty')
          FIELD_ID=$(echo "$PROJECT" | jq -r '.field.id // empty')
          OPTION_ID=$(echo "$PROJECT" | jq -r --arg status "$TARGET_STATUS" '.field.options[]? | select((.name | ascii_downcase) == ($status | ascii_downcase)) | .id' | head -n 1)
          COST_FIELD_ID=$(echo "$PROJECT" | jq -r '(.costField.id // ([.fields.nodes[]? | select((.name // "" | ascii_downcase) == "ai cost")][0].id)) // empty')
          COST_FIELD_TYPE=$(echo "$PROJECT" | jq -r '(.costField.dataType // ([.fields.nodes[]? | select((.name // "" | ascii_downcase) == "ai cost")][0].dataType)) // "NUMBER"')

          if [ -z "$ISSUE_ID" ] || [ -z "$PROJECT_ID" ] || [ -z "$FIELD_ID" ] || [ -z "$OPTION_ID" ]; then
            echo "::error::Could not find issue, project, Status field, or '$TARGET_STATUS' option for ${OWNER}/${REPO} in Project '$PROJECT_TITLE'."
            exit 1
          fi

          ITEM_ID=$(gh api graphql -f query='
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } }
            }' -f projectId="$PROJECT_ID" -f contentId="$ISSUE_ID" --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                value: { singleSelectOptionId: $optionId }
              }) { projectV2Item { id } }
            }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$FIELD_ID" -f optionId="$OPTION_ID" >/dev/null

          if [ -n "$COST_FIELD_ID" ]; then
            echo "PROJECT_ID=${PROJECT_ID}" >> "$GITHUB_ENV"
            echo "PROJECT_ITEM_ID=${ITEM_ID}" >> "$GITHUB_ENV"
            echo "COST_FIELD_ID=${COST_FIELD_ID}" >> "$GITHUB_ENV"
            echo "COST_FIELD_TYPE=${COST_FIELD_TYPE}" >> "$GITHUB_ENV"
            COMMENTS_JSON=$(gh issue view "$ISSUE_NUMBER" --json comments 2>/dev/null || echo '{"comments":[]}')
            PENDING_JSON="[]"
            if [ -s "specs/issue-${ISSUE_NUMBER}/ai-cost-pending.jsonl" ]; then
              PENDING_JSON=$(jq -s '.' "specs/issue-${ISSUE_NUMBER}/ai-cost-pending.jsonl")
            fi
            TOTAL_COST=$(jq -n --argjson issue "$COMMENTS_JSON" --argjson pending "$PENDING_JSON" '
              ([ $issue.comments[]?.body // "" | scan("<!-- ai-cost-step:(\\{[^\\n]*?\\}) -->") | .[0] | fromjson? ] + $pending)
              | [.[].cost_usd // 0] | add // 0 | ((. * 10000 | round) / 10000)
            ')
            if [ "$COST_FIELD_TYPE" = "TEXT" ]; then
              TOTAL_COST_TEXT=$(jq -n --argjson c "$TOTAL_COST" '
                def fmt_usd:
                  ((. * 10000 | round) | tostring) as $s
                  | (if ($s | length) <= 4 then ("0000" + $s)[-4:] else $s end) as $padded
                  | (if ($s | length) <= 4 then "0" else $s[0:($s | length) - 4] end) + "." + $padded[-4:];
                "$" + ($c | fmt_usd)
              ' -r)
              gh api graphql -f query='
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $cost: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                    value: { text: $cost }
                  }) { projectV2Item { id } }
                }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$COST_FIELD_ID" -f cost="$TOTAL_COST_TEXT" >/dev/null 2>&1 || true
            else
              gh api graphql -f query='
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $cost: Float!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                    value: { number: $cost }
                  }) { projectV2Item { id } }
                }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$COST_FIELD_ID" -F cost="$TOTAL_COST" >/dev/null 2>&1 || true
            fi
          fi

      - uses: actions/checkout@v4
        if: steps.resolve.outputs.skip != 'true'

      - name: Install ALTEN-group/coding-pal plan primitives
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
        run: |
          mkdir -p specs
          cp -R /tmp/specs/. specs/
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/ALTEN-group/coding-pal.git /tmp/alten-coding-pal
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/1pizzateam/coding-pal.git /tmp/1pizza-coding-pal
          rm -rf .github/instructions .github/agents .github/prompts .github/skills .github/copilot-instructions.md .agents .claude .cursor .gemini CLAUDE.md GEMINI.md AGENTS.md .cursorrules .windsurfrules
          mkdir -p .github/instructions .github/agents .agents/skills
          cp /tmp/1pizza-coding-pal/instructions/*.md .github/instructions/
          cp /tmp/alten-coding-pal/instructions/plan.instructions.md .github/instructions/
          cp /tmp/alten-coding-pal/instructions/forge.instructions.md .github/instructions/
          [ -d tests ] && [ -f /tmp/alten-coding-pal/instructions/node-unit-tests.instructions.md ] && cp /tmp/alten-coding-pal/instructions/node-unit-tests.instructions.md .github/instructions/
          [ -d website ] && [ -f /tmp/alten-coding-pal/instructions/vitepress-docs.instructions.md ] && cp /tmp/alten-coding-pal/instructions/vitepress-docs.instructions.md .github/instructions/
          cp /tmp/alten-coding-pal/agents/plan.agent.md .github/agents/
          cp -R /tmp/alten-coding-pal/skills/plan .agents/skills/plan
          cp -R /tmp/alten-coding-pal/skills/forge .agents/skills/forge
          cp /tmp/1pizza-coding-pal/forge-catalog.json .agents/skills/forge/catalog.json
          for repo_cat in docs/forge/catalog.json .github/forge-catalog.json forge-catalog.json; do
            if [ -f "$repo_cat" ]; then
              jq -s '.[0] as $base | .[1] as $ext | ($base * $ext) | .assets = (((($base.assets // []) + ($ext.assets // [])) | group_by(.id) | map(reduce .[] as $item ({}; . * $item))))' \
                .agents/skills/forge/catalog.json "$repo_cat" > .agents/skills/forge/catalog.json.tmp && mv .agents/skills/forge/catalog.json.tmp .agents/skills/forge/catalog.json
            fi
          done
          if [ -f package.json ]; then
            jq --slurpfile pkg package.json '
              (($pkg[0].dependencies // {}) + ($pkg[0].devDependencies // {})) as $deps |
              .assets |= map(
                . as $a |
                ($deps["@1pizzateam/" + $a.id] // $deps[$a.id] // "") |
                sub("^[~^>=<v]+"; "") as $v |
                if ($v | test("^[0-9]+\\.[0-9]+\\.[0-9]+")) then ($a | .version = $v) else $a end
              )
            ' .agents/skills/forge/catalog.json > .agents/skills/forge/catalog.json.tmp && mv .agents/skills/forge/catalog.json.tmp .agents/skills/forge/catalog.json
          fi
          rm -rf /tmp/alten-coding-pal /tmp/1pizza-coding-pal

      - uses: actions/setup-node@v4
        if: steps.resolve.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies for codebase verification
        if: steps.resolve.outputs.skip != 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts 2>/dev/null || npm ci || true
          fi

      - name: Clone sibling DoomR.js workspace for companion game editors
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          case "$REPO_NAME" in
            Cadenza|FaceGun|MappR|PixelGun|PolyGun|ShaderGun)
              if [ ! -d ../DoomR.js ]; then
                git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/1pizzateam/DoomR.js.git" ../DoomR.js
              fi
              if [ "$REPO_NAME" = "FaceGun" ] && [ ! -d ../FaceR.js ]; then
                git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/1pizzateam/FaceR.js.git" ../FaceR.js
              fi
              ;;
          esac

      - name: Cache Copilot CLI
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.copilot-cli
          key: copilot-cli-${{ runner.os }}-node22

      - name: Install Copilot CLI
        if: steps.resolve.outputs.skip != 'true'
        run: |
          if [ ! -x "$HOME/.copilot-cli/bin/copilot" ]; then
            npm install --prefix "$HOME/.copilot-cli" -g @github/copilot
          fi
          echo "$HOME/.copilot-cli/bin" >> "$GITHUB_PATH"

      - name: Fetch issue context and run Planner agent
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          ISSUE_JSON=$(gh issue view "$ISSUE_NUMBER" --json title,body,comments)
          ISSUE_TITLE=$(echo "$ISSUE_JSON" | jq -r '.title')
          ISSUE_BODY=$(echo "$ISSUE_JSON" | jq -r '.body // ""')
          PREVIOUS_PLAN=$(echo "$ISSUE_JSON" | jq -r '[.comments[].body | select(test("^# Plan:"; "m"))] | last // empty | sub("\\n*(?:---\\n+)?<!-- ai-cost-step:[^\\n]*-->[\\s\\S]*$"; "")')
          DEV_COMMENTS=$(echo "$ISSUE_JSON" | jq -r '
            [.comments[]
              | select((.body // "") | test("^(# (Think|Plan|Prove|Release|Release report)|⏸️ \\*\\*(Paused after|Blocked on)|Pull request opened for #|### Companion Game Editor Updates Dispatched|Fix-loop limit of|Release failed or did not finish\\.|PR #[0-9]+ (conflicts with|or its base changed))"; "m") | not)
              | select((.body // "") | gsub("\\s+"; "") | length > 0)
              | "### Comment by @" + (.author.login // "developer") + " (" + (.createdAt // "") + "):\n" + .body
            ] | join("\n\n")
          ')
          SPEC_DIR="specs/issue-${ISSUE_NUMBER}"
          THINK_FILE="${SPEC_DIR}/think.md"
          PLAN_FILE="${SPEC_DIR}/plan.md"

          IMAGE_URLS=$(echo "$ISSUE_JSON" | jq -r '
            [ (.body // ""), (.comments[]?.body // "") ]
            | join("\n")
            | [ scan("https://(?:github\\.com/user-attachments/assets/[A-Za-z0-9_-]+|user-images\\.githubusercontent\\.com/[^\"\\)\\s>]+|private-user-images\\.githubusercontent\\.com/[^\"\\)\\s>]+|[^\"\\)\\s>]+\\.(?:png|jpg|jpeg|gif|webp))") ]
            | map(if type == "array" then .[0] else . end)
            | unique[]
          ' 2>/dev/null || true)
          IMAGE_CONTEXT=""
          if [ -n "$IMAGE_URLS" ]; then
            IMAGE_DIR=".agents/issue-images"
            mkdir -p "$IMAGE_DIR"
            IMG_IDX=0
            DOWNLOADED_IMAGES=""
            while IFS= read -r img_url; do
              [ -z "$img_url" ] && continue
              IMG_IDX=$((IMG_IDX + 1))
              IMG_FILE="${IMAGE_DIR}/attachment-${IMG_IDX}.png"
              if command -v curl >/dev/null 2>&1; then
                curl -L --fail --silent "$img_url" -o "$IMG_FILE" 2>/dev/null || curl -L --fail --silent -H "Authorization: Bearer ${GH_TOKEN}" "$img_url" -o "$IMG_FILE" 2>/dev/null || true
              fi
              if [ -s "$IMG_FILE" ]; then
                DOWNLOADED_IMAGES="${DOWNLOADED_IMAGES}
          - ${IMG_FILE} (downloaded inside workspace from ${img_url} — open this relative path directly with your Read/view file tool)"
              else
                DOWNLOADED_IMAGES="${DOWNLOADED_IMAGES}
          - ${img_url} (download into .agents/issue-images/ with curl -L and inspect)"
              fi
            done <<< "$IMAGE_URLS"
            IMAGE_CONTEXT="
          Attached Visual Evidence / Screenshots on Issue #${ISSUE_NUMBER} (MUST be opened and viewed directly with your multimodal file-reading tool at the workspace path below before writing ${PLAN_FILE}):${DOWNLOADED_IMAGES}
          "
          fi

          FEEDBACK_CONTEXT=""
          if [ -n "$PREVIOUS_PLAN" ]; then
            FEEDBACK_CONTEXT="${FEEDBACK_CONTEXT}
          Previous Plan Specification (revise and improve this plan according to ${THINK_FILE} and any new Developer Feedback / Follow-up Comments below):
          ${PREVIOUS_PLAN}
          "
          fi
          if [ -n "$DEV_COMMENTS" ]; then
            FEEDBACK_CONTEXT="${FEEDBACK_CONTEXT}
          Developer Feedback / Follow-up Comments on Issue #${ISSUE_NUMBER} (MUST be taken into account and incorporated into the plan, within the boundaries of ${THINK_FILE}):
          ${DEV_COMMENTS}
          "
          fi

          LIBRARY_DOCS_HINT=""
          if [ -f package.json ] && [ "$(node -p "const p=require('./package.json'); Boolean(p.name && p.name.startsWith('@1pizzateam/') && !p.private)")" = "true" ]; then
            LIBRARY_DOCS_HINT="Because this repository is a published @1pizzateam/* library, if any public export, class, method, or signature in src/** is added or modified, ensure the corresponding documentation files (exact files under website/docs/ if website/docs exists, or README.md otherwise) are included in ## File Scope & Boundaries (- **In Scope:**) and updated in an atomic step so release-readiness verification (verify-release-readiness.mjs) passes."
          fi

          export COPILOT_OTEL_ENABLED="true"
          export COPILOT_OTEL_FILE_EXPORTER_PATH="${RUNNER_TEMP}/copilot-otel.jsonl"
          copilot --model="claude-sonnet-5.5" --agent="plan" --allow-all-tools \
            --prompt "Produce a validated Plan record at ${PLAN_FILE} derived strictly from ${THINK_FILE} for GitHub Issue #${ISSUE_NUMBER}.
          Issue Title: ${ISSUE_TITLE}
          Issue Body:
          ${ISSUE_BODY}
          ${IMAGE_CONTEXT}
          ${FEEDBACK_CONTEXT}

          Follow .github/instructions/plan.instructions.md and .agents/skills/plan/SKILL.md (and its references/plan-contract.md).
          Read ${THINK_FILE} first and ground all file scopes, acceptance criteria, atomic implementation steps (with Files, Action, Verification, Bootable Check, and Serves), test plan rows, and blast radius checks in ${THINK_FILE} and the existing repository conventions.
          Order ## Implementation Checklist steps strictly so every step passes its Verification, Bootable Check, and full test suite immediately when executed in sequence: always place core implementation steps BEFORE the test steps that assert on their new behavior (never place a test step before the implementation step it depends on), and if an implementation step changes existing behavior asserted by an existing test file, update that existing assertion in the same implementation step (listing both files in Files) while reserving subsequent test steps for adding new AC-<n> tests.
          Keep the exact required headings and '- **<Label>:**' bullet keys enforced by validate-plan.mjs, while producing a comprehensive, IDE-grade implementation blueprint:
          - **Rich, Concrete Step Specifications & Callee/Boundary Verification:** In each step's '- **Action:**' field, do NOT write vague 1-sentence summaries. Provide a thorough multi-sentence technical specification (plus 2-space indented sub-bullets '  - ...' where helpful) detailing exact function/method signatures, data structures, constants/glyphs, state transitions, integration points with existing symbols, and edge-case handling so the Code agent can implement the feature with zero guesswork.
            - Before specifying changes to arguments passed into any existing helper function, read the callee's implementation to verify its internal loop, step size, quantization, or boundary assumptions so the new inputs do not cause unintended side effects (such as extra loop iterations or off-by-one slices).
            - When specifying floating-point or interpolated boundary checks/cutoffs, include a safe epsilon margin rather than filtering at the exact boundary value, and ensure coupled components that meet at a shared boundary use consistent transforms.
            - Only top-level '- **Files:**', '- **Action:**', '- **Verification:**', '- **Bootable Check:**', and '- **Serves:**' bullets may start at column 0 in a step; indent any sub-bullets inside Action by at least 2 spaces. Do NOT write source code or test code blocks in ${PLAN_FILE} (no code fences or New Code fields)—code is written once in Code.
          - **High-Value Acceptance Criteria (AC-1..AC-8):** Formulate 4 to 8 substantive, observable 'Given ..., then ...' criteria (each on a single '- **AC-<N>:**' line) that verify core mechanics, state transitions, edge cases, and invariants—not just superficial existence checks. Never write an acceptance criterion that locks in a broken legacy behavior or forbids modifying a companion component/threshold if adjusting it is required for the primary fix (AC-1) to work end-to-end.
          ${LIBRARY_DOCS_HINT}
          Every test in ## Test Plan must include its acceptance criterion ID ('AC-1', 'AC-2', etc.) in the test name (for example 'tests/<file>: AC-1 ...' or 'scripts/<file>: AC-1 ...') and start the Test Plan 'Test' cell with the relative test file path so criteria-verify can verify every criterion with --require-test-files.
          Do not modify any production or test files; only write ${PLAN_FILE}.
          Do not post comments or edit labels on GitHub issues; only write ${PLAN_FILE}.
          Validate and cross-check the generated file with: node .agents/skills/plan/scripts/validate-plan.mjs --plan ${PLAN_FILE} --think ${THINK_FILE} and fix any validation errors until it exits with code 0."

          STEP_COST_JSON=$(
            {
              for f in "${COPILOT_HOME:-$HOME/.copilot}"/session-state/*/events.jsonl "$COPILOT_OTEL_FILE_EXPORTER_PATH"; do
                [ -f "$f" ] && cat "$f" || true
              done
            } | jq -sc --arg step "Plan" '
              def num(x): if (x | type) == "number" then x elif (x | type) == "string" then (x | tonumber? // 0) else 0 end;
              ([.[] | select(.type? == "session.usage_record") | .data.usage | select(type == "object")]) as $urec |
              ([.[] | select(.type? == "assistant.usage")]) as $ausg |
              ([.[] | select(.type? == null and (."gen_ai.usage.input_tokens"? != null or .input_tokens? != null or .prompt_tokens? != null))]) as $otel |
              (if ($urec | length) > 0 then $urec elif ($ausg | length) > 0 then $ausg else $otel end) as $recs |
              def tok_in: [$recs[] | (.inputTokens? // .input_tokens? // .promptTokens? // .prompt_tokens? // ."gen_ai.usage.input_tokens"? // 0) | num(.)] | add // 0;
              def tok_out: [$recs[] | (.outputTokens? // .output_tokens? // .completionTokens? // .completion_tokens? // ."gen_ai.usage.output_tokens"? // 0) | num(.)] | add // 0;
              def tok_cache: [$recs[] | (.cacheReadTokens? // .cache_read_tokens? // .cached_tokens? // ."gen_ai.usage.cache_read.input_tokens"? // 0) | num(.)] | add // 0;
              def tok_cache_write: [$recs[] | (.cacheWriteTokens? // .cache_write_tokens? // ."gen_ai.usage.cache_creation.input_tokens"? // 0) | num(.)] | add // 0;
              def nano_aiu: [$recs[] | (.copilotUsage.totalNanoAiu? // .copilotUsage.total_nano_aiu? // .totalNanoAiu? // 0) | num(.)] | add // 0;
              def explicit_cost: [$recs[] | (.cost_usd? // .total_cost_usd? // .costUsd? // .totalCostUsd? // ."gen_ai.usage.cost"? // 0) | num(.)] | add // 0;
              def models: [$recs[] | (.model? // ."gen_ai.response.model"? // ."gen_ai.request.model"? // empty) | select(type == "string" and length > 0 and . != "auto")] | unique;
              def model_str: (models | if length == 0 then "auto" else join(", ") end);
              def rate_in(m): if (m | test("opus"; "i")) then 15.0 elif (m | test("haiku|mini|flash|nano|luna"; "i")) then 0.25 else 3.0 end;
              def rate_out(m): if (m | test("opus"; "i")) then 75.0 elif (m | test("haiku|mini|flash|nano|luna"; "i")) then 1.25 else 15.0 end;
              (tok_in) as $in | (tok_out) as $out | (tok_cache) as $cache | (tok_cache_write) as $cwrite | (nano_aiu) as $naiu | (model_str) as $m |
              ([($in - $cache - $cwrite), 0] | max) as $uncached_in |
              (if explicit_cost > 0 then explicit_cost
               elif $naiu > 0 then (($naiu / 1000000000.0) * 0.01)
               else (($uncached_in * rate_in($m) + $cwrite * (rate_in($m) * 1.25) + $cache * (rate_in($m) * 0.1) + $out * rate_out($m)) / 1000000.0)
               end) as $cost |
              {
                step: $step,
                model: $m,
                input_tokens: $in,
                output_tokens: $out,
                cached_tokens: $cache,
                requests: (if ($recs | length) > 0 then ($recs | length) else 1 end),
                cost_usd: (($cost * 10000 | round) / 10000)
              }
            ' 2>/dev/null || echo '{"step":"Plan","model":"auto","input_tokens":0,"output_tokens":0,"cached_tokens":0,"requests":1,"cost_usd":0}'
          )
          rm -rf "${COPILOT_HOME:-$HOME/.copilot}"/session-state/* "${COPILOT_OTEL_FILE_EXPORTER_PATH}"
          mkdir -p "$SPEC_DIR"
          echo "$STEP_COST_JSON" >> "${SPEC_DIR}/ai-cost.jsonl"
          echo "$STEP_COST_JSON" > "${SPEC_DIR}/ai-cost-pending.jsonl"
          PRIOR_COST=$(echo "$ISSUE_JSON" | jq -r '.comments[].body // empty' 2>/dev/null | sed -n 's/.*<!-- ai-cost-step:\({.*}\) -->.*/\1/p' | jq -sr '([.[].cost_usd // 0] | add // 0)' 2>/dev/null || echo "0")
          echo "$STEP_COST_JSON" | jq -r --argjson prior "${PRIOR_COST:-0}" '
            def fmt_usd(x): (x * 10000 | round / 10000) | tostring | if test("\\.") then (split(".") | .[0] + "." + ((.[1] + "0000")[0:4])) else . + ".0000" end;
            ((.cost_usd // 0) + $prior) as $cum |
            "\n\n---\n<!-- ai-cost-step:" + (. | tojson) + " -->\n💰 **AI Cost (" + .step + "):** `$" + fmt_usd(.cost_usd) + "` (`" + .model + "` · " + (.input_tokens | tostring) + " in / " + (.output_tokens | tostring) + " out tokens · " + (.requests | tostring) + (if .requests == 1 then " request" else " requests" end) + (if $prior > 0 then " · **Cumulative:** `$" + fmt_usd($cum) + "`" else "" end) + ")"
          ' > "${SPEC_DIR}/ai-cost-step.md"

      - name: Validate plan.md contract and cross-check against think.md
        if: steps.resolve.outputs.skip != 'true'
        run: |
          THINK_FILE="specs/issue-${ISSUE_NUMBER}/think.md"
          PLAN_FILE="specs/issue-${ISSUE_NUMBER}/plan.md"
          node .agents/skills/plan/scripts/validate-plan.mjs --plan "$PLAN_FILE" --think "$THINK_FILE"
          cat "$PLAN_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan.md on issue
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
        run: |
          PLAN_FILE="specs/issue-${ISSUE_NUMBER}/plan.md"
          COST_STEP_FILE="specs/issue-${ISSUE_NUMBER}/ai-cost-step.md"
          COMMENT_FILE="$PLAN_FILE"
          if [ -s "$COST_STEP_FILE" ]; then
            COMMENT_FILE="$RUNNER_TEMP/plan-comment.md"
            printf "%s%s\n" "$(cat "$PLAN_FILE")" "$(cat "$COST_STEP_FILE")" > "$COMMENT_FILE"
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file "$COMMENT_FILE"
          rm -f "specs/issue-${ISSUE_NUMBER}/ai-cost-pending.jsonl"

          if [ -n "${COST_FIELD_ID:-}" ] && [ -n "${PROJECT_ID:-}" ] && [ -n "${PROJECT_ITEM_ID:-}" ]; then
            COMMENTS_JSON=$(gh issue view "$ISSUE_NUMBER" --json comments 2>/dev/null || echo '{"comments":[]}')
            TOTAL_COST=$(jq -n --argjson issue "$COMMENTS_JSON" '
              [ $issue.comments[]?.body // "" | scan("<!-- ai-cost-step:(\\{[^\\n]*?\\}) -->") | .[0] | fromjson? ]
              | [.[].cost_usd // 0] | add // 0 | ((. * 10000 | round) / 10000)
            ')
            if [ "${COST_FIELD_TYPE:-NUMBER}" = "TEXT" ]; then
              TOTAL_COST_TEXT=$(jq -n --argjson c "$TOTAL_COST" '
                def fmt_usd:
                  ((. * 10000 | round) | tostring) as $s
                  | (if ($s | length) <= 4 then ("0000" + $s)[-4:] else $s end) as $padded
                  | (if ($s | length) <= 4 then "0" else $s[0:($s | length) - 4] end) + "." + $padded[-4:];
                "$" + ($c | fmt_usd)
              ' -r)
              gh api graphql -f query='
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $cost: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                    value: { text: $cost }
                  }) { projectV2Item { id } }
                }' -f projectId="$PROJECT_ID" -f itemId="$PROJECT_ITEM_ID" -f fieldId="$COST_FIELD_ID" -f cost="$TOTAL_COST_TEXT" >/dev/null 2>&1 || true
            else
              gh api graphql -f query='
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $cost: Float!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                    value: { number: $cost }
                  }) { projectV2Item { id } }
                }' -f projectId="$PROJECT_ID" -f itemId="$PROJECT_ITEM_ID" -f fieldId="$COST_FIELD_ID" -F cost="$TOTAL_COST" >/dev/null 2>&1 || true
            fi
          fi

      - name: Check for manual validation checkpoint after Plan
        id: checkpoint
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          ISSUE_JSON=$(gh issue view "$ISSUE_NUMBER" --json body,labels)
          PAUSE_PLAN=$(echo "$ISSUE_JSON" | jq -r '
            (([.labels[].name] | any(. == "2-plan" or . == "pause:plan")))
            or ((.body // "") | test("(\\[pause:plan\\]|- \\[[xX]\\] [Pp]ause after [Pp]lan)"))
          ')

          if [ "$PAUSE_PLAN" != "true" ]; then
            echo "paused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "paused=true" >> "$GITHUB_OUTPUT"
          gh issue edit "$ISSUE_NUMBER" --remove-label "1-think,2-plan,3-code,4-prove,5-release,pause:plan" --add-assignee "@me" || true
          gh issue comment "$ISSUE_NUMBER" --body "⏸️ **Paused after Plan for Manual Validation**

          Review (and optionally edit) the \`# Plan:\` specification comment above.
          - To implement the plan (**Code**) and stop at the Pull Request without running Prove, add the **\`3-code\`** label.
          - To run **\`Code → Prove\`** and pause after Prove validation without merging, add the **\`4-prove\`** label.
          - To run **\`Code → Prove → Release\`** and auto-merge, add the **\`5-release\`** label."

      - name: Upload plan.md and think.md artifact
        id: handoff
        if: steps.resolve.outputs.skip != 'true' && steps.checkpoint.outputs.paused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plan-spec
          path: |
            specs/issue_number.txt
            specs/issue-${{ env.ISSUE_NUMBER }}/think.md
            specs/issue-${{ env.ISSUE_NUMBER }}/plan.md
            specs/issue-${{ env.ISSUE_NUMBER }}/editor-requests.json
          retention-days: 7

      - name: Start Code
        if: steps.handoff.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh workflow run code.yml -f workflow_run_id="$RUN_ID"

      - name: Mark issue needs:developer if Plan fails
        if: failure() && steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "${ISSUE_NUMBER:-}" ]; then
            GH_TOKEN="${GITHUB_TOKEN:-$GH_TOKEN}" gh label create needs:developer --force --description "Pipeline failed or fix-loop limit reached; developer attention required" || true
            GH_TOKEN="${GITHUB_TOKEN:-$GH_TOKEN}" gh issue edit "$ISSUE_NUMBER" --add-label "needs:developer" --remove-label "1-think,2-plan,3-code,4-prove,5-release" || true
            gh issue edit "$ISSUE_NUMBER" --add-assignee "@me" || true
          fi
