name: Audit - Test coverage gaps

on:
  workflow_call:
    inputs:
      scope: { type: string, default: 'src/' }

jobs:
  audit:
    uses: 1pizzateam/coding-pal/.github/workflows/audit-runner.yml@main
    with:
      agent: test-gap
      scope: ${{ inputs.scope }}
      pr_title: "test: cover missing edge cases for ${{ inputs.scope }}"
    secrets: inherit
