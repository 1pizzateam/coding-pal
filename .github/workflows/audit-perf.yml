name: Audit - Performance & Zero-GC

on:
  workflow_call:
    inputs:
      scope: { type: string, default: 'src/' }

jobs:
  audit:
    uses: 1pizzateam/coding-pal/.github/workflows/audit-runner.yml@main
    with:
      agent: perf-audit
      scope: ${{ inputs.scope }}
      pr_title: "perf: eliminate hot-loop allocations in ${{ inputs.scope }}"
    secrets: inherit
