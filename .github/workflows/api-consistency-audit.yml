name: API Consistency & Docs Audit

on:
  workflow_call:
    inputs:
      scope: { type: string, default: 'src/' }

jobs:
  audit:
    uses: 1pizzateam/coding-pal/.github/workflows/copilot-audit.yml@main
    with:
      agent: api-consistency
      scope: ${{ inputs.scope }}
      pr_title: "refactor: align public API consistency and docs in ${{ inputs.scope }}"
    secrets: inherit
