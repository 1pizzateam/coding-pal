name: Pipeline - Think (reusable)

on:
  workflow_call:
    inputs:
      issue_number:
        description: 'Issue number to generate think.md for'
        required: true
        type: string
      event_name:
        description: 'Triggering event name (issues or workflow_dispatch)'
        required: false
        default: 'issues'
        type: string
      project_title:
        description: 'Optional GitHub Project V2 board title'
        required: false
        default: ''
        type: string
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true

permissions:
  contents: read
  issues: write
  actions: write
  pull-requests: read

jobs:
  think:
    runs-on: ubuntu-latest
    concurrency:
      group: copilot-think-${{ github.repository }}-issue-${{ inputs.issue_number }}
      cancel-in-progress: false
    steps:
      - name: Check FIFO queue and inspect existing specs for Smart Resume
        id: fifo
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          echo "ISSUE_NUMBER=${ISSUE_NUMBER}" >> "$GITHUB_ENV"
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            ACTIVE_PIPELINE_RUNS=0
            for wf in "Pipeline - Plan" "Pipeline - Code" "Pipeline - Prove"; do
              COUNT=$(gh run list --workflow "$wf" --limit 5 --json status \
                --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested")] | length' 2>/dev/null || echo "0")
              ACTIVE_PIPELINE_RUNS=$((ACTIVE_PIPELINE_RUNS + COUNT))
            done

            OPEN_AGENT_PRS=$(gh pr list --state open --json number,headRefName,labels \
              --jq "[.[] | select(.headRefName | test(\"^(feature|fix|chore)/issue-[0-9]+-\")) | select((.headRefName | test(\"^(feature|fix|chore)/issue-${ISSUE_NUMBER}-\")) | not) | select(([.labels[].name] | any(. == \"needs:developer\" or . == \"review:code\")) | not)] | length" 2>/dev/null || echo "0")

            QUEUE_DATA=$(gh api graphql -f query='
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  issues(states: [OPEN], first: 100) {
                    nodes {
                      number
                      createdAt
                      labels(first: 20) { nodes { name } }
                      timelineItems(itemTypes: [LABELED_EVENT], last: 20) {
                        nodes {
                          ... on LabeledEvent {
                            createdAt
                            label { name }
                          }
                        }
                      }
                    }
                  }
                }
              }' -f owner="$OWNER" -f repo="$REPO" 2>/dev/null || true)

            QUEUE_HEAD=$(echo "$QUEUE_DATA" | jq -r '
              [
                .data.repository.issues.nodes[]?
                | select([.labels.nodes[].name] | any(. == "1-think" or . == "2-plan" or . == "3-code" or . == "4-release"))
                | select(([.labels.nodes[].name] | index("needs:developer")) == null)
                | {
                    number: .number,
                    readyAt: (([.timelineItems.nodes[]? | select(.label.name == "1-think" or .label.name == "2-plan" or .label.name == "3-code" or .label.name == "4-release") | .createdAt] | last) // .createdAt)
                  }
              ]
              | sort_by(.readyAt, .number)
              | .[0].number // empty
            ')

            if [ "$ACTIVE_PIPELINE_RUNS" -gt 0 ] || [ "$OPEN_AGENT_PRS" -gt 0 ] || { [ -n "$QUEUE_HEAD" ] && [ "$QUEUE_HEAD" != "$ISSUE_NUMBER" ]; }; then
              echo "::notice::Issue #${ISSUE_NUMBER} is queued in FIFO (head of queue: #${QUEUE_HEAD:-$ISSUE_NUMBER}, active runs: ${ACTIVE_PIPELINE_RUNS}, open PRs: ${OPEN_AGENT_PRS}). It will start automatically when the current issue completes."
              echo "queued=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "queued=false" >> "$GITHUB_OUTPUT"

          # Clear any previous manual review checkpoint labels now that the issue is active
          gh issue edit "$ISSUE_NUMBER" --remove-label "review:think,review:plan,review:code" 2>/dev/null || true

          ISSUE_VIEW=$(gh issue view "$ISSUE_NUMBER" --json labels,comments)
          HAS_THINK_TRIGGER=$(echo "$ISSUE_VIEW" | jq -r '[.labels[].name] | index("1-think") != null')
          HAS_PLAN_TRIGGER=$(echo "$ISSUE_VIEW" | jq -r '[.labels[].name] | index("2-plan") != null')
          HAS_CODE_TRIGGER=$(echo "$ISSUE_VIEW" | jq -r '[.labels[].name] | index("3-code") != null')
          HAS_RELEASE_TRIGGER=$(echo "$ISSUE_VIEW" | jq -r '[.labels[].name] | index("4-release") != null')
          EXISTING_THINK=$(echo "$ISSUE_VIEW" | jq -r '[.comments[].body | select(test("^# Think:"; "m"))] | last // empty')
          EXISTING_PLAN=$(echo "$ISSUE_VIEW" | jq -r '[.comments[].body | select(test("^# Plan:"; "m"))] | last // empty')
          EXISTING_PR=$(gh pr list --state open --json number,headRefName \
            --jq "[.[] | select(.headRefName | test(\"^(feature|fix|chore)/issue-${ISSUE_NUMBER}-\"))][0].number // empty" 2>/dev/null || true)

          # Smart Resume 0: An open PR already exists and the issue was explicitly marked for release.
          if [ -n "$EXISTING_PR" ] && [ "$HAS_RELEASE_TRIGGER" = "true" ]; then
            echo "Found open PR #${EXISTING_PR} for issue #${ISSUE_NUMBER}; dispatching Pipeline - Prove directly."
            gh pr edit "$EXISTING_PR" --remove-label "review:code" 2>/dev/null || true
            gh workflow run prove.yml -f pr_number="$EXISTING_PR" -f issue_number="$ISSUE_NUMBER"
            echo "resumed_stage=prove" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$EXISTING_PR" ] && [ "$HAS_CODE_TRIGGER" = "true" ]; then
            echo "Issue #${ISSUE_NUMBER} already has open PR #${EXISTING_PR}; leaving it at the manual review checkpoint."
            gh issue edit "$ISSUE_NUMBER" --add-label "review:code" --remove-label "3-code" || true
            gh pr edit "$EXISTING_PR" --add-label "review:code" || true
            echo "resumed_stage=code" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Smart Resume 1: Reuse both specs for Code unless Think or Plan was explicitly requested.
          if [ -n "$EXISTING_THINK" ] && [ -n "$EXISTING_PLAN" ] && [ "$HAS_THINK_TRIGGER" != "true" ] && [ "$HAS_PLAN_TRIGGER" != "true" ]; then
            echo "Found validated # Think: and # Plan: comments on issue #${ISSUE_NUMBER}; dispatching Pipeline - Code directly."
            gh workflow run code.yml -f issue_number="$ISSUE_NUMBER"
            echo "resumed_stage=code" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Smart Resume 2: Reuse an existing Think spec unless Think was explicitly requested again.
          if [ -n "$EXISTING_THINK" ] && [ "$HAS_THINK_TRIGGER" != "true" ]; then
            echo "Found validated # Think: comment on issue #${ISSUE_NUMBER}; reusing existing think.md to trigger Plan."
            mkdir -p "specs/issue-${ISSUE_NUMBER}"
            printf "%s\n" "$EXISTING_THINK" > "specs/issue-${ISSUE_NUMBER}/think.md"
            echo "$ISSUE_NUMBER" > specs/issue_number.txt
            echo "resumed_stage=plan" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "resumed_stage=none" >> "$GITHUB_OUTPUT"

      - name: Sync issue to Think on Project board
        if: steps.fifo.outputs.queued != 'true' && steps.fifo.outputs.resumed_stage == 'none'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PROJECT_TITLE: ${{ inputs.project_title }}
          TARGET_STATUS: Think
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          if [ -z "$PROJECT_TITLE" ]; then
            echo "::notice::No project_title configured; skipping Project status update."
            exit 0
          fi

          DATA=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $number: Int!, $projectTitle: String!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $number) { id }
                owner {
                  ... on ProjectV2Owner {
                    projectsV2(first: 20, query: $projectTitle) {
                      nodes {
                        id
                        title
                        field(name: "Status") {
                          ... on ProjectV2SingleSelectField {
                            id
                            options { id name }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" -F number="$ISSUE_NUMBER" -f projectTitle="$PROJECT_TITLE")

          ISSUE_ID=$(echo "$DATA" | jq -r '.data.repository.issue.id // empty')
          PROJECT=$(echo "$DATA" | jq -c --arg title "$PROJECT_TITLE" '.data.repository.owner.projectsV2.nodes[]? | select((.title | ascii_downcase) == ($title | ascii_downcase))' | head -n 1)
          PROJECT_ID=$(echo "$PROJECT" | jq -r '.id // empty')
          FIELD_ID=$(echo "$PROJECT" | jq -r '.field.id // empty')
          OPTION_ID=$(echo "$PROJECT" | jq -r --arg status "$TARGET_STATUS" '.field.options[]? | select((.name | ascii_downcase) == ($status | ascii_downcase)) | .id' | head -n 1)

          if [ -z "$ISSUE_ID" ] || [ -z "$PROJECT_ID" ] || [ -z "$FIELD_ID" ] || [ -z "$OPTION_ID" ]; then
            echo "::error::Could not find issue, project, Status field, or '$TARGET_STATUS' option for ${OWNER}/${REPO} in Project '$PROJECT_TITLE'."
            exit 1
          fi

          ITEM_ID=$(gh api graphql -f query='
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } }
            }' -f projectId="$PROJECT_ID" -f contentId="$ISSUE_ID" --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                value: { singleSelectOptionId: $optionId }
              }) { projectV2Item { id } }
            }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$FIELD_ID" -f optionId="$OPTION_ID" >/dev/null

      - uses: actions/checkout@v4
        if: steps.fifo.outputs.queued != 'true' && steps.fifo.outputs.resumed_stage == 'none'

      - name: Install ALTEN-group/coding-pal think primitives
        if: steps.fifo.outputs.queued != 'true' && steps.fifo.outputs.resumed_stage == 'none'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/ALTEN-group/coding-pal.git /tmp/alten-coding-pal
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/1pizzateam/coding-pal.git /tmp/1pizza-coding-pal
          rm -rf .github/instructions .github/agents .github/prompts .github/skills .github/copilot-instructions.md .agents .claude .cursor .gemini CLAUDE.md GEMINI.md AGENTS.md .cursorrules .windsurfrules
          mkdir -p .github/instructions .github/agents .agents/skills
          cp /tmp/1pizza-coding-pal/instructions/*.md .github/instructions/
          cp /tmp/alten-coding-pal/instructions/sharp-agent.instructions.md .github/instructions/
          cp /tmp/alten-coding-pal/instructions/think.instructions.md .github/instructions/
          cp /tmp/alten-coding-pal/instructions/decision-record.instructions.md .github/instructions/
          [ -d tests ] && [ -f /tmp/alten-coding-pal/instructions/node-unit-tests.instructions.md ] && cp /tmp/alten-coding-pal/instructions/node-unit-tests.instructions.md .github/instructions/
          [ -d website ] && [ -f /tmp/alten-coding-pal/instructions/vitepress-docs.instructions.md ] && cp /tmp/alten-coding-pal/instructions/vitepress-docs.instructions.md .github/instructions/
          cp /tmp/alten-coding-pal/agents/think.agent.md .github/agents/
          cp -R /tmp/alten-coding-pal/skills/think .agents/skills/think
          cp -R /tmp/alten-coding-pal/skills/decision-record .agents/skills/decision-record
          rm -rf /tmp/alten-coding-pal /tmp/1pizza-coding-pal

      - uses: actions/setup-node@v4
        if: steps.fifo.outputs.queued != 'true' && steps.fifo.outputs.resumed_stage == 'none'
        with:
          node-version: 22
          cache: npm

      - name: Clone sibling DoomR.js workspace for companion game editors
        if: steps.fifo.outputs.queued != 'true' && steps.fifo.outputs.resumed_stage == 'none'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          case "$REPO_NAME" in
            Cadenza|MappR|PixelGun|PolyGun|ShaderGun)
              if [ ! -d ../DoomR.js ]; then
                git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/1pizzateam/DoomR.js.git" ../DoomR.js
                npm --prefix ../DoomR.js ci
              fi
              ;;
          esac

      - if: steps.fifo.outputs.queued != 'true' && steps.fifo.outputs.resumed_stage == 'none'
        run: npm ci
      - if: steps.fifo.outputs.queued != 'true' && steps.fifo.outputs.resumed_stage == 'none'
        run: npm install -g @github/copilot

      - name: Fetch issue context and run Thinker agent
        if: steps.fifo.outputs.queued != 'true' && steps.fifo.outputs.resumed_stage == 'none'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          ISSUE_JSON=$(gh issue view "$ISSUE_NUMBER" --json title,body,labels)
          ISSUE_TITLE=$(echo "$ISSUE_JSON" | jq -r '.title')
          ISSUE_BODY=$(echo "$ISSUE_JSON" | jq -r '.body // ""')
          ALREADY_ESCALATED=$(echo "$ISSUE_JSON" | jq -r '[.labels[].name] | index("upstream-escalated:1") != null')
          SPEC_DIR="specs/issue-${ISSUE_NUMBER}"
          THINK_FILE="${SPEC_DIR}/think.md"
          UPSTREAM_FILE="${SPEC_DIR}/upstream-request.json"
          EDITOR_REQ_FILE="${SPEC_DIR}/editor-requests.json"
          mkdir -p "$SPEC_DIR"

          ESCALATION_HINT=""
          if [ "$ALREADY_ESCALATED" != "true" ]; then
            ESCALATION_HINT="If solving this issue requires adding or updating a general-purpose capability in an upstream @1pizzateam/* library first (\`@1pizzateam/roostr\` -> \`1pizzateam/RoostR.js\`, \`@1pizzateam/bumpr\` -> \`1pizzateam/BumpR.js\`, \`@1pizzateam/loopr\` -> \`1pizzateam/LoopR.js\`, \`@1pizzateam/spock\` -> \`1pizzateam/Spock.js\`, \`@1pizzateam/groovr\` -> \`1pizzateam/GroovR.js\`) that is not yet available in the installed version, ALSO write a JSON object to ${UPSTREAM_FILE} with exact keys: {\"package\": \"@1pizzateam/<name>\", \"repo\": \"1pizzateam/<Repo>.js\", \"title\": \"feat(<scope>): <summary>\", \"problem\": \"<why this belongs in the upstream library>\", \"suggestedDirection\": \"<proposed API and behavior>\", \"affectedFiles\": [\"<files in this repo waiting on it>\"]}. Only create ${UPSTREAM_FILE} when an upstream library release is genuinely required before this repository can implement the issue."
          fi

          EDITOR_HINT=""
          if [ "${GITHUB_REPOSITORY}" = "1pizzateam/DoomR.js" ]; then
            EDITOR_HINT="Additionally, if implementing this DoomR.js feature requires a companion update in one or more of the 5 game editors (\`cadenza\` -> \`1pizzateam/Cadenza\` for songs/SFX/rack instruments, \`mappr\` -> \`1pizzateam/MappR\` for map tile glyphs/level schema/validator, \`pixelgun\` -> \`1pizzateam/PixelGun\` for texture atlases/procedural stamps/shader modes, \`polygun\` -> \`1pizzateam/PolyGun\` for 3D models/primitives/animations, \`shadergun\` -> \`1pizzateam/ShaderGun\` for GLSL shaders/uniforms/layers), write a JSON array to ${EDITOR_REQ_FILE} where each element has exact keys: {\"editor\": \"<cadenza|mappr|pixelgun|polygun|shadergun>\", \"repo\": \"1pizzateam/<Cadenza|MappR|PixelGun|PolyGun|ShaderGun>\", \"title\": \"feat(<scope>): <editor update summary>\", \"problem\": \"<what changed in DoomR.js and why the editor needs updating>\", \"suggestedDirection\": \"<exact files/schemas/UI in the editor to update>\", \"affectedFiles\": [\"<DoomR.js files involved>\"]}. Only create ${EDITOR_REQ_FILE} when at least one game editor genuinely needs a companion update."
          fi

          LIBRARY_DOCS_HINT=""
          if [ -f package.json ] && [ "$(node -p "const p=require('./package.json'); Boolean(p.name && p.name.startsWith('@1pizzateam/') && !p.private)")" = "true" ]; then
            LIBRARY_DOCS_HINT="Because this repository is a published @1pizzateam/* library, if solving this issue adds or changes any public export, class, method, or signature in src/**, you MUST include the corresponding documentation files (website/docs/** if website/docs exists, or README.md otherwise) in ## In Scope so documentation stays in sync with src/ and passes release-readiness verification."
          fi

          copilot --agent="think" --allow-all-tools \
            --prompt "Produce a validated Think record at ${THINK_FILE} for GitHub Issue #${ISSUE_NUMBER}.
          Issue Title: ${ISSUE_TITLE}
          Issue Body:
          ${ISSUE_BODY}

          Follow .github/instructions/think.instructions.md and .agents/skills/think/SKILL.md (and its references/think-contract.md).
          Because no Forge catalog is installed in this repository, evaluate options grounded in the codebase and existing package.json dependencies, set Custom build where applicable with Custom Build Reason in ## Chosen Approach and '- **None:** <reason>' in ## Forge Asset Bindings.
          ${ESCALATION_HINT}
          ${EDITOR_HINT}
          ${LIBRARY_DOCS_HINT}
          Validate the generated file with: node .agents/skills/think/scripts/validate-think.mjs --think ${THINK_FILE} and fix any validation errors until it exits with code 0."

      - name: Validate think.md contract
        if: steps.fifo.outputs.queued != 'true' && steps.fifo.outputs.resumed_stage == 'none'
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          THINK_FILE="specs/issue-${ISSUE_NUMBER}/think.md"
          node .agents/skills/think/scripts/validate-think.mjs --think "$THINK_FILE"
          cat "$THINK_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment think.md on issue
        if: steps.fifo.outputs.queued != 'true' && steps.fifo.outputs.resumed_stage == 'none'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          THINK_FILE="specs/issue-${ISSUE_NUMBER}/think.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$THINK_FILE"
          echo "$ISSUE_NUMBER" > specs/issue_number.txt

          EDITOR_REQ_FILE="specs/issue-${ISSUE_NUMBER}/editor-requests.json"
          if [ -s "$EDITOR_REQ_FILE" ]; then
            ED_SUMMARY=$(jq -r '.[]? | "- **\(.editor // .repo)** (`\(.repo)`): \(.title)"' "$EDITOR_REQ_FILE" 2>/dev/null || true)
            if [ -n "$ED_SUMMARY" ]; then
              gh issue comment "$ISSUE_NUMBER" --body "### Companion Game Editor Updates Scheduled
          Once this issue merges into \`${GITHUB_REPOSITORY}\`, the pipeline will automatically open \`4-release\` issues in the affected game editor repositories:
          ${ED_SUMMARY}"
            fi
          fi

      - name: Check for upstream @1pizzateam/* library escalation
        id: escalate
        if: steps.fifo.outputs.queued != 'true' && steps.fifo.outputs.resumed_stage == 'none'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          CURRENT_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          UPSTREAM_FILE="specs/issue-${ISSUE_NUMBER}/upstream-request.json"
          if [ ! -s "$UPSTREAM_FILE" ]; then
            echo "escalated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PKG=$(jq -r '.package // empty' "$UPSTREAM_FILE" 2>/dev/null || true)
          TARGET_REPO=$(jq -r '.repo // empty' "$UPSTREAM_FILE" 2>/dev/null || true)
          UP_TITLE=$(jq -r '.title // empty' "$UPSTREAM_FILE" 2>/dev/null || true)
          UP_PROBLEM=$(jq -r '.problem // empty' "$UPSTREAM_FILE" 2>/dev/null || true)
          UP_DIRECTION=$(jq -r '.suggestedDirection // empty' "$UPSTREAM_FILE" 2>/dev/null || true)
          UP_FILES=$(jq -r '(.affectedFiles // []) | map("- `" + . + "`") | join("\n")' "$UPSTREAM_FILE" 2>/dev/null || true)

          case "$TARGET_REPO" in
            1pizzateam/RoostR.js|1pizzateam/BumpR.js|1pizzateam/LoopR.js|1pizzateam/Spock.js|1pizzateam/GroovR.js|1pizzateam/Cadenza|1pizzateam/MappR|1pizzateam/PixelGun|1pizzateam/PolyGun|1pizzateam/ShaderGun)
              ;;
            *)
              echo "Ignoring unsupported upstream target repo '${TARGET_REPO}'."
              echo "escalated=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [ -z "$PKG" ] || [ -z "$UP_TITLE" ] || [ -z "$UP_PROBLEM" ] || [ "$TARGET_REPO" = "$CURRENT_REPO" ]; then
            echo "Incomplete upstream-request.json; proceeding with normal Plan."
            echo "escalated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh label create "blocked:upstream" --force --description "Waiting on an upstream @1pizzateam library release" || true
          gh label create "upstream-escalated:1" --force --description "Escalated once to an upstream @1pizzateam library" || true
          gh label create "4-release" --repo "$TARGET_REPO" --force --description "Run the autonomous Think -> Plan -> Code -> Prove pipeline" || true
          gh label create "upstream-escalated:1" --repo "$TARGET_REPO" --force --description "Triggered by downstream consumer" || true

          UP_BODY="## Problem
          ${UP_PROBLEM}

          ## Affected Downstream Files (\`${CURRENT_REPO}\`)
          ${UP_FILES:-"- (see downstream issue)"}

          ## Suggested Direction
          ${UP_DIRECTION}

          ---
          ### Downstream Consumer Callback
          - **Downstream-Repo:** \`${CURRENT_REPO}\`
          - **Downstream-Issue:** #${ISSUE_NUMBER}
          - **Upstream-Escalated:** 1"

          LIB_ISSUE_URL=$(gh issue create --repo "$TARGET_REPO" \
            --title "$UP_TITLE" \
            --label "4-release" \
            --label "upstream-escalated:1" \
            --body "$UP_BODY")
          LIB_ISSUE_NUMBER="${LIB_ISSUE_URL##*/}"

          gh issue edit "$ISSUE_NUMBER" --add-label "blocked:upstream,upstream-escalated:1" --remove-label "1-think,2-plan,3-code,4-release" || true
          gh issue comment "$ISSUE_NUMBER" --body "⏸️ **Paused for Upstream Dependency Escalation**

          The Think phase determined that \`${PKG}\` (\`${TARGET_REPO}\`) should be updated first before implementing #${ISSUE_NUMBER}.

          - **Waiting-Package:** \`${PKG}\`
          - **Waiting-Repo:** \`${TARGET_REPO}\`
          - **Upstream-Issue:** ${TARGET_REPO}#${LIB_ISSUE_NUMBER} (${LIB_ISSUE_URL})

          Once \`${TARGET_REPO}\` merges and publishes the new release, this issue will automatically be re-labeled \`4-release\` and resume implementation."

          echo "escalated=true" >> "$GITHUB_OUTPUT"

          QUEUE_DATA=$(gh api graphql -f query='
            query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                issues(states: [OPEN], first: 100) {
                  nodes {
                    number
                    createdAt
                    labels(first: 20) { nodes { name } }
                    timelineItems(itemTypes: [LABELED_EVENT], last: 20) {
                      nodes {
                        ... on LabeledEvent {
                          createdAt
                          label { name }
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" 2>/dev/null || true)

          NEXT_ISSUE=$(echo "$QUEUE_DATA" | jq -r --argjson current "$ISSUE_NUMBER" '
            [
              .data.repository.issues.nodes[]?
              | select(.number != $current)
              | select([.labels.nodes[].name] | any(. == "1-think" or . == "2-plan" or . == "3-code" or . == "4-release"))
              | select(([.labels.nodes[].name] | index("needs:developer")) == null)
              | {
                  number: .number,
                  readyAt: (([.timelineItems.nodes[]? | select(.label.name == "1-think" or .label.name == "2-plan" or .label.name == "3-code" or .label.name == "4-release") | .createdAt] | last) // .createdAt)
                }
            ]
            | sort_by(.readyAt, .number)
            | .[0].number // empty
          ')

          if [ -n "$NEXT_ISSUE" ]; then
            echo "Advancing FIFO queue to next labeled issue #${NEXT_ISSUE} while #${ISSUE_NUMBER} waits on upstream..."
            gh workflow run think.yml -f issue_number="$NEXT_ISSUE"
          fi

      - name: Check for manual validation checkpoint after Think
        id: checkpoint
        if: >-
          steps.fifo.outputs.queued != 'true' &&
          steps.fifo.outputs.resumed_stage == 'none' &&
          steps.escalate.outputs.escalated != 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          ISSUE_JSON=$(gh issue view "$ISSUE_NUMBER" --json body,labels)
          PAUSE_THINK=$(echo "$ISSUE_JSON" | jq -r '
            (([.labels[].name] | any(. == "1-think" or . == "pause:think")))
            or ((.body // "") | test("(\\[pause:think\\]|- \\[[xX]\\] [Pp]ause after [Tt]hink)"))
          ')

          if [ "$PAUSE_THINK" != "true" ]; then
            echo "paused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "paused=true" >> "$GITHUB_OUTPUT"
          gh label create "review:think" --color "FBCA04" --force --description "Paused after Think; waiting for manual validation of think.md" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "review:think" --remove-label "1-think,2-plan,3-code,4-release,pause:think" || true
          gh issue comment "$ISSUE_NUMBER" --body "⏸️ **Paused after Think for Manual Validation**

          Review (and optionally edit) the \`# Think:\` specification comment above.
          - To generate the **Plan** next and pause again for validation, add the **\`2-plan\`** label.
          - To run **\`Plan → Code\`** and stop at the Pull Request without auto-merging, add the **\`3-code\`** label.
          - To run **\`Plan → Code → Prove\`** and auto-merge, add the **\`4-release\`** label."

          QUEUE_DATA=$(gh api graphql -f query='
            query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                issues(states: [OPEN], first: 100) {
                  nodes {
                    number
                    createdAt
                    labels(first: 20) { nodes { name } }
                    timelineItems(itemTypes: [LABELED_EVENT], last: 20) {
                      nodes {
                        ... on LabeledEvent {
                          createdAt
                          label { name }
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" 2>/dev/null || true)

          NEXT_ISSUE=$(echo "$QUEUE_DATA" | jq -r --argjson current "$ISSUE_NUMBER" '
            [
              .data.repository.issues.nodes[]?
              | select(.number != $current)
              | select([.labels.nodes[].name] | any(. == "1-think" or . == "2-plan" or . == "3-code" or . == "4-release"))
              | select(([.labels.nodes[].name] | index("needs:developer")) == null)
              | {
                  number: .number,
                  readyAt: (([.timelineItems.nodes[]? | select(.label.name == "1-think" or .label.name == "2-plan" or .label.name == "3-code" or .label.name == "4-release") | .createdAt] | last) // .createdAt)
                }
            ]
            | sort_by(.readyAt, .number)
            | .[0].number // empty
          ')

          if [ -n "$NEXT_ISSUE" ]; then
            echo "Advancing FIFO queue to next labeled issue #${NEXT_ISSUE} while #${ISSUE_NUMBER} awaits manual Think review..."
            gh workflow run think.yml -f issue_number="$NEXT_ISSUE"
          fi

      - name: Upload think.md artifact for Plan workflow
        if: >-
          steps.fifo.outputs.queued != 'true' &&
          steps.fifo.outputs.resumed_stage != 'code' &&
          steps.fifo.outputs.resumed_stage != 'prove' &&
          steps.escalate.outputs.escalated != 'true' &&
          steps.checkpoint.outputs.paused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: think-spec
          path: |
            specs/issue_number.txt
            specs/issue-${{ inputs.issue_number }}/think.md
            specs/issue-${{ inputs.issue_number }}/editor-requests.json
          retention-days: 7

      - name: Advance FIFO queue if Think fails
        if: failure() && steps.fifo.outputs.queued != 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          gh label create needs:developer --force --description "Pipeline failed or fix-loop limit reached; developer attention required" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "needs:developer" --remove-label "1-think,2-plan,3-code,4-release" || true

          QUEUE_DATA=$(gh api graphql -f query='
            query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                issues(states: [OPEN], first: 100) {
                  nodes {
                    number
                    createdAt
                    labels(first: 20) { nodes { name } }
                    timelineItems(itemTypes: [LABELED_EVENT], last: 20) {
                      nodes {
                        ... on LabeledEvent {
                          createdAt
                          label { name }
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" 2>/dev/null || true)

          NEXT_ISSUE=$(echo "$QUEUE_DATA" | jq -r --argjson current "$ISSUE_NUMBER" '
            [
              .data.repository.issues.nodes[]?
              | select(.number != $current)
              | select([.labels.nodes[].name] | any(. == "1-think" or . == "2-plan" or . == "3-code" or . == "4-release"))
              | select(([.labels.nodes[].name] | index("needs:developer")) == null)
              | {
                  number: .number,
                  readyAt: (([.timelineItems.nodes[]? | select(.label.name == "1-think" or .label.name == "2-plan" or .label.name == "3-code" or .label.name == "4-release") | .createdAt] | last) // .createdAt)
                }
            ]
            | sort_by(.readyAt, .number)
            | .[0].number // empty
          ')

          if [ -n "$NEXT_ISSUE" ]; then
            echo "Advancing FIFO queue to next labeled issue #${NEXT_ISSUE}..."
            gh workflow run think.yml -f issue_number="$NEXT_ISSUE"
          fi
