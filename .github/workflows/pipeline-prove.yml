name: Pipeline - Prove (reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull request number to validate (optional)'
        required: false
        type: string
        default: ''
      issue_number:
        description: 'Issue number whose open PR should be validated (optional)'
        required: false
        type: string
        default: ''
      workflow_run_id:
        description: 'Code run ID containing code-spec (also supports an earlier job in the same run)'
        required: false
        type: string
        default: ''
      project_title:
        description: 'GitHub Project V2 board title'
        required: false
        type: string
        default: 'DoomR'
      fix_loop_limit:
        description: 'Maximum automatic remediation attempts before developer handoff'
        required: false
        type: string
        default: '5'
      auto_release_npm:
        description: 'Automatically bump package.json version and publish a GitHub Release after PR merge for @1pizzateam/* libraries'
        required: false
        type: boolean
        default: true
      deployment_workflow:
        description: 'Push-triggered deployment workflow to await before Done (empty when no deployment is configured)'
        required: false
        type: string
        default: ''
      deployment_paths:
        description: 'Newline-separated git paths matching the deployment push filter (empty means every push)'
        required: false
        type: string
        default: ''
      node_version:
        description: 'Node.js version'
        required: false
        type: string
        default: '22'
    secrets:
      PIPELINE_GITHUB_TOKEN:
        required: true
      COPILOT_GITHUB_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  prove:
    runs-on: ubuntu-latest
    concurrency:
      group: copilot-prove-${{ github.repository }}-${{ inputs.pr_number || inputs.issue_number || inputs.workflow_run_id || github.run_id }}
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      FIX_LOOP_LIMIT: ${{ inputs.fix_loop_limit }}
    steps:
      - name: Resolve PR, branch, and issue number
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.workflow_run_id }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          rm -rf /tmp/specs
          mkdir -p /tmp/specs
          PR_NUMBER=""
          ISSUE_NUMBER=""

          if [ -n "$RUN_ID" ] && [ -z "$INPUT_PR_NUMBER" ] && [ -z "$INPUT_ISSUE_NUMBER" ]; then
            if ! gh run download "$RUN_ID" -n code-spec -D /tmp/specs 2>/dev/null; then
              echo "Triggering Code workflow run (#${RUN_ID}) was skipped (no code-spec artifact); skipping Prove."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PR_NUMBER=$(tr -d '[:space:]' < /tmp/specs/pr_number.txt)
            ISSUE_NUMBER=$(tr -d '[:space:]' < /tmp/specs/issue_number.txt)
          elif [ -n "$INPUT_PR_NUMBER" ]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
          elif [ -n "$INPUT_ISSUE_NUMBER" ]; then
            ISSUE_NUMBER="$INPUT_ISSUE_NUMBER"
            PR_NUMBER=$(gh pr list --state open --json number,headRefName \
              --jq "[.[] | select(.headRefName | test(\"^(feature|fix|chore)/issue-${ISSUE_NUMBER}-\"))][0].number // empty")
          else
            PR_NUMBER=$(gh pr list --state open --json number,headRefName,updatedAt \
              --jq '[.[] | select(.headRefName | test("^(feature|fix|chore)/issue-[0-9]+-"))] | sort_by(.updatedAt) | reverse | .[0].number // empty')
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No open agent pull request found to validate; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_JSON=$(gh pr view "$PR_NUMBER" --json number,state,headRefName,baseRefName,body,title)
          PR_STATE=$(echo "$PR_JSON" | jq -r '.state')
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "PR #${PR_NUMBER} is already ${PR_STATE}; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH_NAME=$(echo "$PR_JSON" | jq -r '.headRefName')
          BASE_REF=$(echo "$PR_JSON" | jq -r '.baseRefName')

          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_NUMBER=$(echo "$BRANCH_NAME" | sed -nE 's/^(feature|fix|chore)\/issue-([0-9]+)-.*/\2/p')
          fi
          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_NUMBER=$(echo "$PR_JSON" | jq -r '.body // ""' | sed -nE 's/.*- \*\*Closes:\*\* #([0-9]+).*/\1/p' | head -n 1)
          fi

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "::error::Could not determine ISSUE_NUMBER for PR #${PR_NUMBER} (branch ${BRANCH_NAME})."
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "PR_NUMBER=${PR_NUMBER}" >> "$GITHUB_ENV"
          echo "ISSUE_NUMBER=${ISSUE_NUMBER}" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> "$GITHUB_ENV"
          echo "BASE_REF=${BASE_REF}" >> "$GITHUB_ENV"

      - name: Sync issue to Prove on Project board
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PROJECT_TITLE: ${{ inputs.project_title }}
          TARGET_STATUS: Prove
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
        run: |
          cat > "$RUNNER_TEMP/prove-project-status.sh" <<'STATUS_SCRIPT'
          if [ -z "$PROJECT_TITLE" ]; then
            echo "::notice::No project_title configured; skipping Project status update."
            exit 0
          fi

          DATA=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $number: Int!, $projectTitle: String!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $number) { id }
                owner {
                  ... on ProjectV2Owner {
                    projectsV2(first: 20, query: $projectTitle) {
                      nodes {
                        id
                        title
                        field(name: "Status") {
                          ... on ProjectV2SingleSelectField {
                            id
                            options { id name }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" -F number="$ISSUE_NUMBER" -f projectTitle="$PROJECT_TITLE")

          ISSUE_ID=$(echo "$DATA" | jq -r '.data.repository.issue.id // empty')
          PROJECT=$(echo "$DATA" | jq -c --arg title "$PROJECT_TITLE" --arg repo "$REPO" '.data.repository.owner.projectsV2.nodes[]? | select((.title | ascii_downcase | sub("\\.js$"; "")) == ($title | ascii_downcase | sub("\\.js$"; "")) or (.title | ascii_downcase) == ($repo | ascii_downcase))' | head -n 1)
          PROJECT_ID=$(echo "$PROJECT" | jq -r '.id // empty')
          FIELD_ID=$(echo "$PROJECT" | jq -r '.field.id // empty')
          OPTION_ID=$(echo "$PROJECT" | jq -r --arg status "$TARGET_STATUS" '.field.options[]? | select((.name | ascii_downcase) == ($status | ascii_downcase)) | .id' | head -n 1)

          if [ -z "$ISSUE_ID" ] || [ -z "$PROJECT_ID" ] || [ -z "$FIELD_ID" ] || [ -z "$OPTION_ID" ]; then
            echo "::error::Could not find issue, project, Status field, or '$TARGET_STATUS' option for ${OWNER}/${REPO} in Project '$PROJECT_TITLE'."
            exit 1
          fi

          ITEM_ID=$(gh api graphql -f query='
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } }
            }' -f projectId="$PROJECT_ID" -f contentId="$ISSUE_ID" --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                value: { singleSelectOptionId: $optionId }
              }) { projectV2Item { id } }
            }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$FIELD_ID" -f optionId="$OPTION_ID" >/dev/null
          STATUS_SCRIPT
          bash -eo pipefail "$RUNNER_TEMP/prove-project-status.sh"

      - uses: actions/checkout@v4
        if: steps.resolve.outputs.skip != 'true'
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_GITHUB_TOKEN }}

      - name: Refresh PR branch against latest base
        id: freshness
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git check-ref-format "refs/heads/${BASE_REF}"
          git check-ref-format "refs/heads/${BRANCH_NAME}"
          git fetch origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          BASE_SHA=$(git rev-parse "refs/remotes/origin/${BASE_REF}")

          if ! git merge-base --is-ancestor "$BASE_SHA" HEAD; then
            if ! git merge --no-edit "$BASE_SHA"; then
              git merge --abort
              MESSAGE="PR #${PR_NUMBER} conflicts with the latest ${BASE_REF}. Resolve conflicts within the approved plan, or revise Think/Plan before retrying Prove."
              echo "::error::${MESSAGE}"
              gh pr comment "$PR_NUMBER" --body "$MESSAGE"
              exit 1
            fi
            git push origin "HEAD:refs/heads/${BRANCH_NAME}"
          fi

          echo "PROVE_BASE_SHA=${BASE_SHA}" >> "$GITHUB_ENV"

      - name: Configure git identity and restore specs / PR body
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BASE_REF"

          SPEC_DIR="specs/issue-${ISSUE_NUMBER}"
          mkdir -p "$SPEC_DIR"
          if [ -d "/tmp/specs/issue-${ISSUE_NUMBER}" ]; then
            cp -R "/tmp/specs/issue-${ISSUE_NUMBER}/." "$SPEC_DIR/"
          fi

          if [ ! -s "${SPEC_DIR}/think.md" ]; then
            gh issue view "$ISSUE_NUMBER" --json comments \
              --jq '[.comments[].body | select(test("^# Think:"; "m"))] | last // empty' > "${SPEC_DIR}/think.md"
          fi
          if [ ! -s "${SPEC_DIR}/plan.md" ]; then
            gh issue view "$ISSUE_NUMBER" --json comments \
              --jq '[.comments[].body | select(test("^# Plan:"; "m"))] | last // empty' > "${SPEC_DIR}/plan.md"
          fi

          gh pr view "$PR_NUMBER" --json body --jq '.body // ""' > pr-body.md

      - name: Install ALTEN-group/coding-pal Prove and Remediation primitives
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/ALTEN-group/coding-pal.git /tmp/alten-coding-pal
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/1pizzateam/coding-pal.git /tmp/1pizza-coding-pal
          rm -rf .github/instructions .github/agents .github/prompts .github/skills .github/copilot-instructions.md .agents .claude .cursor .gemini CLAUDE.md GEMINI.md AGENTS.md .cursorrules .windsurfrules
          mkdir -p .github/instructions .github/agents .agents/skills
          cp /tmp/1pizza-coding-pal/instructions/*.md .github/instructions/
          cp -R /tmp/1pizza-coding-pal/skills/* .agents/skills/
          cp /tmp/alten-coding-pal/instructions/sharp-agent.instructions.md .github/instructions/
          cp /tmp/alten-coding-pal/instructions/code-loop.instructions.md .github/instructions/
          cp /tmp/alten-coding-pal/instructions/prove.instructions.md .github/instructions/
          cp /tmp/alten-coding-pal/instructions/prove-controls.instructions.md .github/instructions/
          [ -d tests ] && [ -f /tmp/alten-coding-pal/instructions/node-unit-tests.instructions.md ] && cp /tmp/alten-coding-pal/instructions/node-unit-tests.instructions.md .github/instructions/
          [ -d website ] && [ -f /tmp/alten-coding-pal/instructions/vitepress-docs.instructions.md ] && cp /tmp/alten-coding-pal/instructions/vitepress-docs.instructions.md .github/instructions/
          [ -d website ] && [ -d /tmp/alten-coding-pal/skills/vitepress-docs-examples ] && cp -R /tmp/alten-coding-pal/skills/vitepress-docs-examples .agents/skills/vitepress-docs-examples
          cp /tmp/alten-coding-pal/agents/prove.agent.md .github/agents/
          cp /tmp/alten-coding-pal/agents/gate-fix.agent.md .github/agents/
          cp /tmp/alten-coding-pal/agents/code.agent.md .github/agents/
          for skill in think plan code-loop pr-record prove scope-guard secret-guard dependency-guard task-gate control-guard test-probe preview-smoke criteria-verify; do
            cp -R "/tmp/alten-coding-pal/skills/${skill}" ".agents/skills/${skill}"
          done
          rm -rf /tmp/alten-coding-pal /tmp/1pizza-coding-pal

          printf "%s\n" \
            ".github/instructions/" \
            ".github/agents/" \
            ".agents/" \
            "specs/issue_number.txt" \
            "specs/pr_number.txt" \
            "reports/" \
            "pr-body.md" \
            "gate-output.log" >> .git/info/exclude
          echo '[{"path": "/", "status": 200, "maxMs": 2000}]' > /tmp/preview-routes.json

      - uses: actions/setup-node@v4
        if: steps.resolve.outputs.skip != 'true'
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Clone sibling DoomR.js workspace for companion game editors
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          case "$REPO_NAME" in
            Cadenza|MappR|PixelGun|PolyGun|ShaderGun)
              if [ ! -d ../DoomR.js ]; then
                git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/1pizzateam/DoomR.js.git ../DoomR.js
                npm --prefix ../DoomR.js ci
              fi
              ;;
          esac

      - if: steps.resolve.outputs.skip != 'true'
        run: npm ci
      - if: steps.resolve.outputs.skip != 'true'
        run: npm install -g @github/copilot

      - name: Prepare automated validation recording
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/record-prove.sh" <<'RECORD_SCRIPT'
          SPEC_DIR="specs/issue-${ISSUE_NUMBER}"
          PROVE_FILE="${SPEC_DIR}/prove.md"

          node .agents/skills/prove/scripts/validate-prove.mjs --dir "$SPEC_DIR" --stage pass
          cat "$PROVE_FILE" >> "$GITHUB_STEP_SUMMARY"

          node -e '
            const fs = require("fs");
            let body = fs.readFileSync("pr-body.md", "utf8");
            for (const q of ["Client Intent", "Behavioral Experience", "Safety & Blast Radius"]) {
              body = body.replace(new RegExp(`(- \\*\\*${q}:\\*\\*)\\s*Pending`, "g"), "$1 Auto-merge");
            }
            fs.writeFileSync("pr-body.md", body);
          '
          TIER=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { readPlan, readThink, TIERS } from "./.agents/skills/pr-record/scripts/validate-pr.mjs";
            const dir = `specs/issue-${process.env.ISSUE_NUMBER}`;
            const tiers = [readPlan(readFileSync(`${dir}/plan.md`, "utf8")).tier, readThink(readFileSync(`${dir}/think.md`, "utf8")).tier];
            console.log(TIERS[Math.max(...tiers.map(tier => TIERS.indexOf(tier)))]);
          ')
          if [ "$TIER" = "High" ] || [ "$TIER" = "Critical" ]; then
            copilot --model="auto" --agent="prove" --allow-all-tools \
              --prompt "Complete only pr-body.md for autonomous ${TIER} Prove validation using ${PROVE_FILE}, ${SPEC_DIR}/think.md, ${SPEC_DIR}/plan.md and actual verification evidence.
            No human sign-off is required or may be invented. Follow the autonomous Prove section of .agents/skills/pr-record/references/pr-record-contract.md.
            Keep the three assessment fields Auto-merge only because the independently validated Prove report passed.
            Set Rollback Validated to the exact rollback mechanism from Think followed by '; Automated verification' only when concrete rollback verification evidence is recorded in ${PROVE_FILE}.
            For Critical also set Joint Sign-off to 'Automated verification' and Staged Rollout to an existing, validated rollout record reference.
            If evidence is missing, leave the affected field Pending and report the failure; never invent verification or edit controls, production code, tests, or specifications."
          fi
          TODAY=$(date -u +%Y-%m-%d)
          node .agents/skills/pr-record/scripts/validate-pr.mjs --body pr-body.md --dir "$SPEC_DIR" --stage prove --pr-date "$TODAY" --allow-auto-prove
          gh pr edit "$PR_NUMBER" --body-file pr-body.md

          git add "$PROVE_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "docs(prove): add validated prove.md for issue #${ISSUE_NUMBER}"
            git push origin "$BRANCH_NAME"
          fi
          RECORD_SCRIPT

      - name: Run Prove validation and auto-remediation loop
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PROJECT_TITLE: ${{ inputs.project_title }}
          ALLOW_PENDING_APPROVAL: "1"
          ALLOW_AUTO_PROVE: "1"
        run: |
          SPEC_DIR="specs/issue-${ISSUE_NUMBER}"
          PROVE_FILE="${SPEC_DIR}/prove.md"
          ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title')

          wait_for_pr_checks() {
            local checks pending failed poll
            for ((poll=0; poll<120; poll++)); do
              checks=$(gh pr view "$PR_NUMBER" --json statusCheckRollup --jq '.statusCheckRollup') || return 1
              checks=$(echo "$checks" | jq --arg run "/actions/runs/${GITHUB_RUN_ID}/" '
                [.[] | select(((.detailsUrl // .targetUrl // "") | contains($run)) | not)]
              ') || return 1
              if [ "$(echo "$checks" | jq 'length')" -eq 0 ] && [ "$poll" -lt 3 ]; then
                sleep 10
                continue
              fi
              echo "$checks"
              failed=$(echo "$checks" | jq '[.[] | select(
                (.__typename == "CheckRun" and .status == "COMPLETED" and
                  (.conclusion != "SUCCESS" and .conclusion != "NEUTRAL" and .conclusion != "SKIPPED")) or
                (.__typename == "StatusContext" and (.state == "FAILURE" or .state == "ERROR"))
              )] | length')
              if [ "$failed" -gt 0 ]; then
                echo "::error::GitHub PR checks failed. See check names and URLs above."
                return 1
              fi
              pending=$(echo "$checks" | jq '[.[] | select(
                (.__typename == "CheckRun" and .status != "COMPLETED") or
                (.__typename == "StatusContext" and .state != "SUCCESS")
              )] | length')
              if [ "$pending" -eq 0 ]; then
                return 0
              fi
              sleep 10
            done
            echo "::error::GitHub PR checks did not finish within 20 minutes."
            return 1
          }

          run_deterministic_controls() {
            mkdir -p reports
            : > gate-output.log
            local any_failed=0

            run_check() {
              local name="$1"
              shift
              echo "=== Control: ${name} ===" >> gate-output.log
              if "$@" >> gate-output.log 2>&1; then
                echo "✓ ${name}: PASS"
              else
                echo "✗ ${name}: FAIL"
                any_failed=1
              fi
            }

            run_check "validate-think" node .agents/skills/think/scripts/validate-think.mjs --think "${SPEC_DIR}/think.md" --stage draft
            run_check "validate-plan" node .agents/skills/plan/scripts/validate-plan.mjs --dir "$SPEC_DIR" --stage draft
            run_check "branch-guard" node .agents/skills/code-loop/scripts/branch-guard.mjs --git --base "$BASE_REF"
            run_check "code-loop" node .agents/skills/code-loop/scripts/code-loop.mjs check-history --dir "$SPEC_DIR" --base "origin/${BASE_REF}"
            run_check "control-guard" node .agents/skills/control-guard/scripts/control-guard.mjs --git "origin/${BASE_REF}"
            run_check "secret-guard" node .agents/skills/secret-guard/scripts/secret-guard.mjs --git --base "origin/${BASE_REF}"
            run_check "dependency-guard" node .agents/skills/dependency-guard/scripts/dependency-guard.mjs --git --base "origin/${BASE_REF}"

            SCOPE_ARGS=(--scope "${SPEC_DIR}/**" --scope "pr-body.md" --scope "reports/**")
            while IFS= read -r scope_glob; do
              [ -n "$scope_glob" ] && SCOPE_ARGS+=(--scope "$scope_glob")
            done < <(node -e '
              const fs = require("fs");
              const md = fs.readFileSync(process.argv[1], "utf8");
              const paths = new Set();
              const boundary = md.match(/^##\s+File Scope & Boundaries\s*\n([\s\S]*?)(?:\n##\s+|$)/m);
              if (boundary) {
                let collecting = false;
                let buf = "";
                for (const line of boundary[1].split(/\r?\n/)) {
                  const m = line.match(/^- \*\*(.+?):\*\*\s*(.*)$/);
                  if (m) {
                    if (m[1].trim().toLowerCase() === "in scope") {
                      collecting = true;
                      buf += m[2] + "\n";
                    } else if (collecting) {
                      break;
                    }
                  } else if (collecting) {
                    buf += line + "\n";
                  }
                }
                for (const m of buf.matchAll(/`([^`\n]+)`/g)) {
                  const p = m[1].trim();
                  if (p && p !== "_None._") paths.add(p);
                }
              }
              const legacy = md.match(/^##\s+In Scope\s*\n([\s\S]*?)(?:\n##\s+|$)/m);
              if (legacy) {
                for (const m of legacy[1].matchAll(/`([^`\n]+)`/g)) {
                  const p = m[1].trim();
                  if (p && p !== "_None._") paths.add(p);
                }
              }
              for (const p of paths) console.log(p);
            ' "${SPEC_DIR}/plan.md")
            run_check "scope-guard" node .agents/skills/scope-guard/scripts/scope-guard.mjs --git --base "origin/${BASE_REF}" "${SCOPE_ARGS[@]}"
            TASK_STAGES=(--stage "test:npm test" --stage "build:npm run build")
            if [ -f package.json ] && [ "$(node -p "const p=require('./package.json'); Boolean(p.name && p.name.startsWith('@1pizzateam/') && !p.private)")" = "true" ]; then
              TASK_STAGES+=(--stage "release-readiness:node .agents/skills/release-readiness/scripts/verify-release-readiness.mjs --mode pr --require-dist --build-docs")
            fi
            run_check "task-gate" node .agents/skills/task-gate/scripts/task-gate.mjs "${TASK_STAGES[@]}"

            if [ -f "./node_modules/jest/bin/jest.js" ]; then
              node --experimental-vm-modules ./node_modules/jest/bin/jest.js --json --outputFile=reports/test-report.json >/dev/null 2>&1 || true
              run_check "criteria-verify" node .agents/skills/criteria-verify/scripts/verify-criteria.mjs --plan "${SPEC_DIR}/plan.md" --report reports/test-report.json --require-test-files
            else
              {
                for tf in tests/*.test.mjs tests/*.test.js scripts/test-*.mjs; do
                  if [ -f "$tf" ]; then
                    echo "# file: ${tf}"
                    node "$tf" || true
                  fi
                done
              } > reports/test-report.log
              run_check "criteria-verify" node .agents/skills/criteria-verify/scripts/verify-criteria.mjs --plan "${SPEC_DIR}/plan.md" --report reports/test-report.log --require-test-files
            fi

            MODIFIED_SRCS=$(git diff --name-only --diff-filter=M "origin/${BASE_REF}..HEAD" -- 'src/**')
            if [ -n "$MODIFIED_SRCS" ]; then
              PROBE_ARGS=()
              for src in $MODIFIED_SRCS; do
                PROBE_ARGS+=(--source "$src")
              done
              run_check "test-probe" node .agents/skills/test-probe/scripts/test-probe.mjs --base "origin/${BASE_REF}" --test-cmd "npm test" "${PROBE_ARGS[@]}"
            else
              echo "=== Control: test-probe ===" >> gate-output.log
              echo "N/A (no existing tracked src/** files modified)" >> gate-output.log
            fi

            if node -e 'const pkg=require("./package.json"); process.exit((pkg.dependencies?.vite || pkg.devDependencies?.vite) ? 0 : 1)' 2>/dev/null; then
              npx vite preview --port 4173 --host 127.0.0.1 >/tmp/vite-preview.log 2>&1 &
              PREVIEW_PID=$!
              run_check "preview-smoke" node .agents/skills/preview-smoke/scripts/preview-smoke.mjs --url http://127.0.0.1:4173 --routes /tmp/preview-routes.json --timeout-ms 5000 --retries 5 --retry-delay-ms 1000
              kill "$PREVIEW_PID" 2>/dev/null || true
            else
              echo "=== Control: preview-smoke ===" >> gate-output.log
              echo "N/A (library package without web server preview)" >> gate-output.log
            fi

            run_check "validate-pr" node .agents/skills/pr-record/scripts/validate-pr.mjs --body pr-body.md --dir "$SPEC_DIR" --stage code --allow-pending-approval
            run_check "github-pr-checks" wait_for_pr_checks

            return $any_failed
          }

          while true; do
            CONTROLS_OK=0
            if run_deterministic_controls; then
              CONTROLS_OK=1
            fi

            if [ "$CONTROLS_OK" -eq 1 ]; then
              : > "$PROVE_FILE"
              copilot --model="auto" --agent="prove" --allow-all-tools \
                --prompt "Run the Prove validation for Pull Request #${PR_NUMBER} (GitHub Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}) on branch ${BRANCH_NAME} (base: ${BASE_REF}).

              Follow .github/instructions/prove.instructions.md, .agents/skills/prove/SKILL.md, and .agents/skills/prove/references/prove-contract.md.
              1. Read ${SPEC_DIR}/think.md, ${SPEC_DIR}/plan.md, pr-body.md, gate-output.log, and inspect the diff with git diff origin/${BASE_REF}...HEAD.
              2. Write the Prove record to ${PROVE_FILE} with exact header links (- **Issue:** #${ISSUE_NUMBER}, - **PR:** #${PR_NUMBER}, - **Think:** \`${SPEC_DIR}/think.md\`, - **Plan:** \`${SPEC_DIR}/plan.md\`, - **Branch:** \`${BRANCH_NAME}\`, - **Base:** \`${BASE_REF}\`).
              3. Record the truthful status of all 13 required deterministic controls from gate-output.log, verify every AC-<n> criterion against the implementation and tests, and evaluate Client Intent, Behavioral Experience, and Safety & Blast Radius. The branch includes the latest base: check interactions with intervening changes, not just textual conflicts. If the approved Think/Plan is no longer valid, record a blocking finding; do not broaden scope or change the specs.
              4. Validate ${PROVE_FILE} until it exits 0:
                 node .agents/skills/prove/scripts/validate-prove.mjs --dir ${SPEC_DIR} --stage draft"

              if node .agents/skills/prove/scripts/validate-prove.mjs --dir "$SPEC_DIR" --stage pass >> gate-output.log 2>&1; then
                if bash -eo pipefail "$RUNNER_TEMP/record-prove.sh" >> gate-output.log 2>&1 &&
                  wait_for_pr_checks >> gate-output.log 2>&1; then
                  echo "✓ Prove validation and final PR checks passed!"
                  break
                fi
              fi
            fi

            TARGET_STATUS=Code bash -eo pipefail "$RUNNER_TEMP/prove-project-status.sh"
            REPAIR_FILE="reports/repair-attempt.md"
            {
              echo "# Prove repair request"
              echo "Issue #${ISSUE_NUMBER}; PR #${PR_NUMBER}; base ${BASE_REF}; commit $(git rev-parse HEAD)."
              echo "## Failed checks and exact output"
              cat gate-output.log
              if [ "$CONTROLS_OK" -eq 1 ]; then
                echo "## Independent review findings"
                cat "$PROVE_FILE"
              else
                echo "Independent review deferred until all checks pass. Ignore any older prove.md verdict."
              fi
              echo "## Constraints"
              echo "Use ${SPEC_DIR}/think.md and ${SPEC_DIR}/plan.md. Fix only approved scope; stop if replanning is required. Never weaken controls."
            } > "$REPAIR_FILE"
            gh issue comment "$ISSUE_NUMBER" --body-file "$REPAIR_FILE"
            gh pr comment "$PR_NUMBER" --body-file "$REPAIR_FILE"

            ATTEMPTS=$(gh pr view "$PR_NUMBER" --json labels \
              --jq '[.labels[].name | select(startswith("fix-loop:")) | ltrimstr("fix-loop:") | tonumber] | max // 0')

            if [ "$ATTEMPTS" -ge "$FIX_LOOP_LIMIT" ]; then
              GH_TOKEN="${GITHUB_TOKEN:-$GH_TOKEN}" gh label create needs:developer --force --description "Fix-loop limit reached" || true
              GH_TOKEN="${GITHUB_TOKEN:-$GH_TOKEN}" gh pr edit "$PR_NUMBER" --add-label needs:developer
              gh pr edit "$PR_NUMBER" --add-assignee "@me" || true
              GH_TOKEN="${GITHUB_TOKEN:-$GH_TOKEN}" gh issue edit "$ISSUE_NUMBER" --add-label "needs:developer" --remove-label "1-think,2-plan,3-code,4-release" || true
              gh issue edit "$ISSUE_NUMBER" --add-assignee "@me" || true
              if [ "$CONTROLS_OK" -eq 1 ] && [ -f "$PROVE_FILE" ]; then
                gh pr review "$PR_NUMBER" --request-changes --body-file "$PROVE_FILE" || gh pr comment "$PR_NUMBER" --body-file "$PROVE_FILE"
              fi
              gh pr comment "$PR_NUMBER" --body "Fix-loop limit of ${FIX_LOOP_LIMIT} reached during Prove validation. Automatic remediation stops here and the Developer steps in."
              exit 1
            fi

            NEXT=$((ATTEMPTS + 1))
            GH_TOKEN="${GITHUB_TOKEN:-$GH_TOKEN}" gh label create "fix-loop:${NEXT}" --force --description "Auto-remediation attempt ${NEXT}" || true
            GH_TOKEN="${GITHUB_TOKEN:-$GH_TOKEN}" gh pr edit "$PR_NUMBER" --add-label "fix-loop:${NEXT}"
            if [ "$ATTEMPTS" -gt 0 ]; then
              GH_TOKEN="${GITHUB_TOKEN:-$GH_TOKEN}" gh pr edit "$PR_NUMBER" --remove-label "fix-loop:${ATTEMPTS}" || true
            fi

            BEFORE=$(git rev-parse HEAD)
            copilot --model="auto" --agent="code" --allow-all-tools \
              --prompt "Remediate the failing Prove controls and findings for Pull Request #${PR_NUMBER} (Issue #${ISSUE_NUMBER}, attempt ${NEXT}/${FIX_LOOP_LIMIT}).

            Read ${REPAIR_FILE}, gate-output.log, ${SPEC_DIR}/think.md, ${SPEC_DIR}/plan.md and pr-body.md. The repair request includes the current failed commands/output and, only when checks passed, the independent review findings. For failed GitHub checks, inspect their linked run logs with gh run view <run-id> --log-failed before fixing. Ignore stale review records. If the plan is invalid, report a blocking explanation and stop; do not broaden scope.
            Follow .github/instructions/prove-controls.instructions.md, .github/agents/code.agent.md, and .agents/skills/code-loop/SKILL.md:
            1. Fix only the application/test files within the In Scope paths of ${SPEC_DIR}/plan.md (and update pr-body.md if validate-pr failed).
            2. Never weaken, skip, or edit any control or spec file.
            3. Re-run the failed checks and node .agents/skills/control-guard/scripts/control-guard.mjs --git origin/${BASE_REF}.
            4. Stage and commit your fix on ${BRANCH_NAME} with a clear message referencing #${ISSUE_NUMBER}."

            if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then
              node .agents/skills/control-guard/scripts/control-guard.mjs --git "origin/${BASE_REF}"
              git push origin "$BRANCH_NAME"
            fi
            TARGET_STATUS=Prove bash -eo pipefail "$RUNNER_TEMP/prove-project-status.sh"
          done

      - name: Approve validated Pull Request
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ALLOW_PENDING_APPROVAL: "1"
          ALLOW_AUTO_PROVE: "1"
        run: |
          SPEC_DIR="specs/issue-${ISSUE_NUMBER}"
          PROVE_FILE="${SPEC_DIR}/prove.md"

          gh pr review "$PR_NUMBER" --approve --body-file "$PROVE_FILE" || gh pr comment "$PR_NUMBER" --body-file "$PROVE_FILE"

      - name: Sync issue to Release on Project board
        id: release_stage
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PROJECT_TITLE: ${{ inputs.project_title }}
          TARGET_STATUS: Release
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
        run: TARGET_STATUS=Release bash -eo pipefail "$RUNNER_TEMP/prove-project-status.sh"

      - name: Verify validated revisions and merge
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          CURRENT_BASE=$(git rev-parse "refs/remotes/origin/${BASE_REF}")
          VALIDATED_HEAD=$(git rev-parse HEAD)
          REMOTE_HEAD=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          if [ "$CURRENT_BASE" != "$PROVE_BASE_SHA" ] || [ "$REMOTE_HEAD" != "$VALIDATED_HEAD" ]; then
            MESSAGE="PR #${PR_NUMBER} or its base changed during validation. Merge blocked; rerun Prove to refresh the branch and repeat all checks."
            echo "::error::${MESSAGE}"
            gh pr comment "$PR_NUMBER" --body "$MESSAGE"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$CURRENT_BASE" "$VALIDATED_HEAD"; then
            echo "::error::The validated branch no longer includes the checked base. Rerun Prove after refreshing the branch."
            exit 1
          fi
          echo "RELEASE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          gh pr merge "$PR_NUMBER" --squash --delete-branch --match-head-commit "$VALIDATED_HEAD"
          MERGE_SHA=$(gh pr view "$PR_NUMBER" --json mergeCommit --jq '.mergeCommit.oid // empty')
          if [ -z "$MERGE_SHA" ]; then
            echo "::error::PR merge did not produce a merge commit; release cannot proceed."
            exit 1
          fi
          echo "RELEASE_MERGE_SHA=${MERGE_SHA}" >> "$GITHUB_ENV"
          GH_TOKEN="${GITHUB_TOKEN:-$GH_TOKEN}" gh issue edit "$ISSUE_NUMBER" --remove-label "1-think,2-plan,3-code,4-release" || true

      - name: Dispatch companion game editor updates after PR merge
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          REPO_FULL_NAME: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          EDITOR_REQ_FILE="specs/issue-${ISSUE_NUMBER}/editor-requests.json"
          if [ -s "$EDITOR_REQ_FILE" ] && jq -e 'type == "array" and length > 0' "$EDITOR_REQ_FILE" >/dev/null 2>&1; then
            map_editor_repo() {
              case "$1" in
                cadenza|1pizzateam/cadenza) echo "1pizzateam/Cadenza" ;;
                mappr|1pizzateam/mappr) echo "1pizzateam/MappR" ;;
                pixelgun|1pizzateam/pixelgun) echo "1pizzateam/PixelGun" ;;
                polygun|1pizzateam/polygun) echo "1pizzateam/PolyGun" ;;
                shadergun|1pizzateam/shadergun) echo "1pizzateam/ShaderGun" ;;
                *) echo "" ;;
              esac
            }

            DISPATCHED_LINKS=()
            while IFS= read -r item; do
              ED_KEY=$(echo "$item" | jq -r '(.editor // .repo // "") | ascii_downcase')
              ED_TITLE=$(echo "$item" | jq -r '.title // empty')
              ED_BODY=$(echo "$item" | jq -r '
                if (.body // "") != "" then
                  .body
                elif (.problem // "") != "" then
                  "## Problem\n" + .problem
                  + (if (.suggestedDirection // "") != "" then "\n\n## Suggested Direction\n" + .suggestedDirection else "" end)
                  + (if ((.affectedFiles // []) | length) > 0 then "\n\n## Affected Files\n" + ((.affectedFiles | map("- `" + tostring + "`")) | join("\n")) else "" end)
                else
                  ""
                end
              ')
              TARGET_REPO=$(map_editor_repo "$ED_KEY")
              if [ -z "$TARGET_REPO" ] || [ -z "$ED_TITLE" ] || [ -z "$ED_BODY" ]; then
                continue
              fi

              gh label create "4-release" --repo "$TARGET_REPO" --force --description "Run the autonomous Think -> Plan -> Code -> Prove pipeline" || true
              gh label create "upstream:doomr" --repo "$TARGET_REPO" --force --description "Triggered by a merged DoomR.js feature update" || true

              EXISTING=$(gh issue list --repo "$TARGET_REPO" --state open --limit 100 --json number,title \
                --jq ".[] | select((.title | ascii_downcase) == ($(echo "$ED_TITLE" | jq -Rs 'ascii_downcase'))) | .number" | head -n 1)

              if [ -n "$EXISTING" ]; then
                ED_URL="https://github.com/${TARGET_REPO}/issues/${EXISTING}"
                echo "Reusing open companion editor issue ${ED_URL}"
              else
                FULL_BODY="${ED_BODY}

          ---
          _Triggered automatically by merged ${REPO_FULL_NAME}#${ISSUE_NUMBER} (PR #${PR_NUMBER})._"
                ED_URL=$(gh issue create \
                  --repo "$TARGET_REPO" \
                  --title "$ED_TITLE" \
                  --body "$FULL_BODY" \
                  --label "4-release,upstream:doomr")
                echo "Created companion editor issue ${ED_URL}"
              fi
              DISPATCHED_LINKS+=("- **${TARGET_REPO}**: ${ED_URL}")
            done < <(jq -c '.[]' "$EDITOR_REQ_FILE")

            if [ "${#DISPATCHED_LINKS[@]}" -gt 0 ]; then
              COMMENT_BODY=$(printf "### Companion Game Editor Updates Dispatched\n\nNow that PR #%s is merged into \`%s\`, the following companion editor issues have been opened and labeled \`4-release\` to trigger their autonomous pipelines:\n\n%s\n" \
                "$PR_NUMBER" "$BASE_REF" "$(printf '%s\n' "${DISPATCHED_LINKS[@]}")")
              gh issue comment "$ISSUE_NUMBER" --body "$COMMENT_BODY"
            fi
          fi

          case "$REPO_NAME" in
            Cadenza|MappR|PixelGun|PolyGun|ShaderGun)
              HEAD_SHA=$(git rev-parse HEAD)
              gh api repos/1pizzateam/DoomR.js/dispatches \
                -f event_type="upstream-library-released" \
                -f "client_payload[package]=1pizzateam/${REPO_NAME}" \
                -f "client_payload[version]=${HEAD_SHA}" \
                -f "client_payload[upstream_repo]=${REPO_FULL_NAME}" \
                -f "client_payload[repository]=${REPO_FULL_NAME}" || true
              ;;
          esac

      - name: Auto-release merged @1pizzateam/* library version
        id: release
        if: steps.resolve.outputs.skip != 'true' && inputs.auto_release_npm
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ ! -f package.json ]; then exit 0; fi
          IS_PUBLISHABLE=$(node -p '
            const pkg = require("./package.json");
            Boolean(pkg.name && pkg.name.startsWith("@1pizzateam/") && !pkg.private)
          ')
          if [ "$IS_PUBLISHABLE" != "true" ]; then
            echo "Not a publishable @1pizzateam/* library; skipping automatic release."
            exit 0
          fi

          git fetch origin "$BASE_REF"
          git checkout "$BASE_REF"
          git reset --hard "origin/${BASE_REF}"

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title // ""')

          if echo "$CURRENT_VERSION" | grep -qE -- '-(alpha|beta|rc)'; then
            BUMP_TYPE="prerelease"
          elif echo "$ISSUE_TITLE" | grep -qiE '^fix(\(|:|\s)'; then
            BUMP_TYPE="patch"
          else
            BUMP_TYPE="minor"
          fi

          npm version "$BUMP_TYPE" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v${NEW_VERSION}"

          if [ -f website/package.json ]; then
            node -e '
              const fs = require("fs");
              const v = process.argv[1];
              for (const f of ["website/package.json", "website/package-lock.json"]) {
                if (!fs.existsSync(f)) continue;
                const j = JSON.parse(fs.readFileSync(f, "utf8"));
                j.version = v;
                if (j.packages && j.packages[""]) j.packages[""].version = v;
                fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
              }
            ' "$NEW_VERSION"
          fi

          RELEASE_DATE=$(node -p '
            const d = new Date();
            const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
            const day = d.getUTCDate();
            const suffix = (day % 10 === 1 && day !== 11) ? "st" : (day % 10 === 2 && day !== 12) ? "nd" : (day % 10 === 3 && day !== 13) ? "rd" : "th";
            `${months[d.getUTCMonth()]} ${day}${suffix} ${d.getUTCFullYear()}`;
          ')

          SPEC_DIR="specs/issue-${ISSUE_NUMBER}"
          copilot --model="auto" --allow-all-tools \
            --prompt "Prepare release ${TAG_NAME} (bumped from ${CURRENT_VERSION}) for merged PR #${PR_NUMBER} / Issue #${ISSUE_NUMBER} (${ISSUE_TITLE}) following .agents/skills/release-readiness/SKILL.md.
          1. Update CHANGELOG.md so the very first section at line 1 is:
             Version ${NEW_VERSION} (${RELEASE_DATE})
             -----------------------------
              * <concise bullet point(s) summarizing the changes from ${SPEC_DIR}/plan.md and the latest merge commit>
             Keep all previous Version sections intact below a blank line.
          2. Check that all public runtime symbols exported from src/ are documented in website/docs/** (if website/docs exists) or README.md, and update documentation if any export or signature from this release is missing.
          3. Run:
             node .agents/skills/release-readiness/scripts/verify-release-readiness.mjs --mode release --expected-version ${NEW_VERSION} --previous-version ${CURRENT_VERSION}
             Fix any reported CHANGELOG.md, README.md, website/docs, or package.json issues until it exits 0. Do NOT create git commits or tags."

          if node -p "Boolean(require('./package.json').scripts?.['build:lib'])" | grep -q true; then
            npm run build:lib
          else
            npm run build
          fi
          npm test

          node .agents/skills/release-readiness/scripts/verify-release-readiness.mjs \
            --mode release \
            --expected-version "$NEW_VERSION" \
            --previous-version "$CURRENT_VERSION" \
            --require-dist \
            --build-docs

          npm publish --dry-run --access public

          git add package.json CHANGELOG.md README.md
          [ -f package-lock.json ] && git add package-lock.json
          [ -d website ] && git add website
          git commit -m "chore(release): ${TAG_NAME} (for #${ISSUE_NUMBER})"
          git tag "$TAG_NAME"
          git push origin "$BASE_REF" --follow-tags

          RELEASE_COMMIT=$(git rev-parse HEAD)
          echo "release_sha=${RELEASE_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          gh release create "$TAG_NAME" \
            --target "$RELEASE_COMMIT" \
            --title "$TAG_NAME" \
            --generate-notes
          echo "Created verified GitHub Release ${TAG_NAME} on ${BASE_REF} to trigger publish-npm.yml."

      - name: Start Release
        id: start_release
        if: steps.resolve.outputs.skip != 'true' && (steps.release.outcome == 'success' || steps.release.outcome == 'skipped')
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          DEPLOYMENT_WORKFLOW: ${{ inputs.deployment_workflow }}
          DEPLOYMENT_PATHS: ${{ inputs.deployment_paths }}
          PROJECT_TITLE: ${{ inputs.project_title }}
        run: |
          if [ -n "$RELEASE_SHA" ] || [ -n "$DEPLOYMENT_WORKFLOW" ]; then
            gh workflow run release.yml \
              -f issue_number="$ISSUE_NUMBER" \
              -f pr_number="$PR_NUMBER" \
              -f base_ref="$BASE_REF" \
              -f prove_base_sha="$PROVE_BASE_SHA" \
              -f release_merge_sha="$RELEASE_MERGE_SHA" \
              -f release_started_at="$RELEASE_STARTED_AT" \
              -f release_sha="${RELEASE_SHA:-}" \
              -f release_tag="${RELEASE_TAG:-}" \
              -f project_title="$PROJECT_TITLE" \
              -f deployment_workflow="$DEPLOYMENT_WORKFLOW" \
              -f deployment_paths="$DEPLOYMENT_PATHS"
            echo "dispatched=true" >> "$GITHUB_OUTPUT"
          else
            mkdir -p reports
            REPORT="reports/release.md"
            {
              echo "# Release report"
              echo "Issue #${ISSUE_NUMBER}; PR #${PR_NUMBER}; merged commit ${RELEASE_MERGE_SHA}."
              echo "Delivery run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "All required release workflows succeeded (or no external publication/deployment was applicable)."
            } > "$REPORT"
            gh issue comment "$ISSUE_NUMBER" --body-file "$REPORT"
            gh pr comment "$PR_NUMBER" --body-file "$REPORT"
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            TARGET_STATUS=Done bash -eo pipefail "$RUNNER_TEMP/prove-project-status.sh"
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload prove.md artifact
        if: steps.resolve.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: prove-spec
          path: |
            specs/issue-${{ env.ISSUE_NUMBER }}/prove.md
            pr-body.md
            gate-output.log
            reports/repair-attempt.md
            reports/release.md

      - name: Report Release failure on the issue and PR
        if: (failure() || cancelled()) && steps.release_stage.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PROJECT_TITLE: ${{ inputs.project_title }}
        run: |
          if [ -f "$RUNNER_TEMP/prove-project-status.sh" ]; then
            TARGET_STATUS=Release bash -eo pipefail "$RUNNER_TEMP/prove-project-status.sh" || true
          fi
          MESSAGE="Release failed or did not finish. Issue stays in Release and needs developer attention. Inspect ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}; any detailed Release report is posted above. A merged PR is not rolled back automatically."
          gh issue comment "$ISSUE_NUMBER" --body "$MESSAGE"
          gh pr comment "$PR_NUMBER" --body "$MESSAGE"

      - name: Mark issue needs:developer if Prove failed
        if: (failure() || cancelled()) && steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -n "${ISSUE_NUMBER:-}" ]; then
            GH_TOKEN="${GITHUB_TOKEN:-$GH_TOKEN}" gh label create needs:developer --force --description "Pipeline failed or fix-loop limit reached; developer attention required" || true
            GH_TOKEN="${GITHUB_TOKEN:-$GH_TOKEN}" gh issue edit "$ISSUE_NUMBER" --add-label "needs:developer" --remove-label "1-think,2-plan,3-code,4-release" || true
            gh issue edit "$ISSUE_NUMBER" --add-assignee "@me" || true
          fi
